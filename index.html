<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گروپی برایان - Brothers Cup</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { 
            --primary: #6366f1; 
            --secondary: #fbbf24; 
            --accent: #ec4899;
            --bg: #030712; 
            --card-inner: rgba(30, 41, 59, 0.7); 
            --border: rgba(255, 255, 255, 0.1); 
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { 
            background: radial-gradient(circle at top, #1e1b4b, #030712); 
            color: white; margin: 0; display: flex; justify-content: center; min-height: 100vh; 
        }
        
        /* Glassmorphism effects */
        .glass { background: var(--card-inner); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 24px; }

        .container { width: 100%; max-width: 450px; padding: 20px; }
        
        /* Auth Page */
        .auth-card { padding: 40px 20px; text-align: center; margin-top: 50px; }
        .logo-text { font-size: 32px; font-weight: 900; background: linear-gradient(to right, #fbbf24, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }

        /* Navigation */
        .top-nav { display: flex; gap: 10px; margin-bottom: 25px; }
        .nav-btn { flex: 1; padding: 12px; border-radius: 14px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.3s; }
        .btn-gold { background: var(--secondary); color: #000; }
        .btn-dark { background: rgba(255,255,255,0.1); color: #fff; }

        /* Match Cards */
        .match-card { margin-bottom: 25px; position: relative; overflow: hidden; transition: transform 0.2s; }
        .match-card:active { transform: scale(0.98); }
        .match-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .event-tag { font-size: 10px; background: var(--primary); padding: 4px 10px; border-radius: 20px; text-transform: uppercase; }
        .match-body { padding: 20px 15px; }
        
        .teams-grid { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .team { flex: 1; text-align: center; }
        .team img { width: 55px; height: 55px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
        .vs { font-weight: 900; color: var(--secondary); font-style: italic; font-size: 18px; }
        
        .prediction-row { display: flex; gap: 8px; }
        .opt-btn { 
            flex: 1; padding: 15px 5px; border-radius: 16px; border: 1px solid var(--border); 
            background: rgba(255,255,255,0.05); color: #fff; cursor: pointer; 
            display: flex; flex-direction: column; align-items: center; gap: 5px; transition: 0.3s;
        }
        .opt-btn span:first-child { font-size: 10px; opacity: 0.7; }
        .opt-btn span:last-child { font-weight: bold; font-size: 14px; }
        .opt-btn.selected { background: var(--secondary); color: #000; border-color: var(--secondary); box-shadow: 0 0 20px rgba(251,191,36,0.3); }
        .opt-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Popups */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; padding: 20px; align-items: center; justify-content: center; }
        .modal-content { width: 100%; max-width: 380px; padding: 25px; max-height: 80vh; overflow-y: auto; }

        /* Admin Controls */
        .admin-zone { margin-top: 15px; padding-top: 15px; border-top: 1px dashed rgba(255,255,255,0.2); display: flex; justify-content: center; gap: 5px; }
        .admin-action { padding: 8px 12px; border-radius: 8px; border: none; font-size: 11px; cursor: pointer; background: #22c55e; color: white; }

        input { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: white; margin-bottom: 15px; font-size: 16px; outline: none; }
        .btn-main { width: 100%; padding: 16px; border-radius: 16px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-page" class="auth-card glass">
        <div class="logo-text">Brothers Cup</div>
        <p style="color: #94a3b8; margin-bottom: 30px;">بەخێربێیت بۆ جیهانی پێشبینییەکان</p>
        <input type="text" id="userNameInput" placeholder="ناوەکەت بنووسە">
        <button class="btn-main" onclick="loginUser()">چوونە ژوورەوە</button>
    </div>

    <div id="main-app" style="display: none;">
        <div class="top-nav">
            <button class="nav-btn btn-gold" onclick="openRank()">📊 ڕیزبەندی</button>
            <button id="admin-reset-btn" class="nav-btn btn-dark" style="color:#ef4444; display:none;" onclick="resetOnlyPredictions()">🔄 Reset</button>
            <button class="nav-btn btn-dark" style="flex:0.4" onclick="logout()">🚪</button>
        </div>

        <div id="matches-list"></div>
    </div>
</div>

<div id="leaderboard-view" class="modal">
    <div class="modal-content glass">
        <h2 style="text-align: center; color: var(--secondary);">لیستی سەرکەوتووان</h2>
        <div id="rank-list"></div>
        <button class="btn-main" style="margin-top:20px;" onclick="closeView('leaderboard-view')">داخستن</button>
    </div>
</div>

<div id="all-preds-view" class="modal">
    <div class="modal-content glass">
        <h3 id="pred-match-title" style="text-align:center; color:var(--secondary);"></h3>
        <div id="preds-content"></div>
        <button class="btn-main" style="margin-top:20px;" onclick="closeView('all-preds-view')">داخستن</button>
    </div>
</div>

        { id: "m22_12", t1: "مارسیلیا", t2: "لیل", p1: 3, pX: 4, p2: 5, event: "خولی فەڕەنسی", deadline: "2026-03-22T19:15:00", img1: "https://crests.football-data.org/516.png", img2: "https://crests.football-data.org/527.png" },

        { id: "m22_14", t1: "New York City", t2: "Inter Miami", p1: 3, pX: 4, p2: 5, event: "خولی ئەمریکی", deadline: "2026-03-22T20:00:00", img1: "https://crests.football-data.org/4330.png", img2: "https://crests.football-data.org/1132.png" },
        
        // 26/03
        { id: "m26_1", t1: "ئیتاڵیا", t2: "ئێرلەندا", p1: 2, pX: 4, p2: 5, event: "پاڵاوتنی مۆندیال", deadline: "2026-03-26T22:45:00", img1: "https://crests.football-data.org/784.png", img2: "https://crests.football-data.org/791.png" },
        { id: "m26_2", t1: "بەرازیل", t2: "فەڕەنسا", p1: 5, pX: 3, p2: 4, event: "دۆستانە", deadline: "2026-03-26T23:00:00", img1: "https://crests.football-data.org/764.png", img2: "https://crests.football-data.org/773.png" }
    ];

    function loginUser() {
        const n = document.getElementById('userNameInput').value.trim();
        if(!n) return; localStorage.setItem('groupBryanUser', n); location.reload();
    }

    if (currentUser) {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        const isAdmin = currentUser === 'Hedi';
        if(isAdmin) document.getElementById('admin-reset-btn').style.display = 'block';
        
        renderMatches();
    }

    function renderMatches() {
        const now = new Date();
        let h = '';
        matches.forEach(m => {
            const isLocked = now >= new Date(m.deadline);
            h += `
            <div class="match-card glass">
                <div class="match-header">
                    <span class="event-tag">${m.event}</span>
                    <span style="font-size:11px; color:#aaa;">${new Date(m.deadline).toLocaleString('ku-IQ',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})}</span>
                </div>
                <div class="match-body">
                    <div class="teams-grid">
                        <div class="team"><img src="${m.img1}"><div style="font-size:12px; margin-top:5px;">${m.t1}</div></div>
                        <div class="vs">VS</div>
                        <div class="team"><img src="${m.img2}"><div style="font-size:12px; margin-top:5px;">${m.t2}</div></div>
                    </div>
                    <div class="prediction-row">
                        <button class="opt-btn" id="${m.id}-btn1" ${isLocked?'disabled':''} onclick="vote('${m.id}',1,${m.p1})"><span>بردنەوەی ${m.t1}</span><span>${m.p1}خاڵ</span></button>
                        <button class="opt-btn" id="${m.id}-btn2" ${isLocked?'disabled':''} onclick="vote('${m.id}',2,${m.pX})"><span>یەکسان بوون</span><span>${m.pX}خاڵ</span></button>
                        <button class="opt-btn" id="${m.id}-btn3" ${isLocked?'disabled':''} onclick="vote('${m.id}',3,${m.p2})"><span>بردنەوەی ${m.t2}</span><span>${m.p2}خاڵ</span></button>
                    </div>
                    <button class="btn-main" id="viewbtn-${m.id}" style="margin-top:15px; padding:8px; font-size:12px; display:none; background:rgba(255,255,255,0.1);" onclick="showPredictions('${m.id}')">👁️ بینینی پێشبینی ئەوانی تر</button>
                    
                    <div class="admin-zone" id="admin-tools-${m.id}" style="display:none">
                        <button class="admin-action" onclick="setResult('${m.id}',1,${m.p1})">W1</button>
                        <button class="admin-action" style="background:#64748b" onclick="setResult('${m.id}',2,${m.pX})">X</button>
                        <button class="admin-action" onclick="setResult('${m.id}',3,${m.p2})">W2</button>
                    </div>
                </div>
            </div>`;
        });
        document.getElementById('matches-list').innerHTML = h;
        loadUserStates();
    }

    function loadUserStates() {
        const isAdmin = currentUser === 'Hedi';
        
        // Load results to lock admin tools
        db.ref('results').on('value', snap => {
            const results = snap.val() || {};
            matches.forEach(m => {
                const tools = document.getElementById(`admin-tools-${m.id}`);
                if (isAdmin && !results[m.id]) tools.style.display = 'flex';
                else if (tools) tools.style.display = 'none';
            });
        });

        // Load user predictions
        db.ref('users/' + currentUser + '/predictions').on('value', snap => {
            const preds = snap.val() || {};
            matches.forEach(m => {
                const isLocked = new Date() >= new Date(m.deadline);
                if (preds[m.id]) {
                    const btn = document.getElementById(m.id + '-btn' + preds[m.id].choice);
                    if(btn) btn.classList.add('selected');
                    document.querySelectorAll(`#${m.id} .opt-btn`).forEach(b => b.disabled = true);
                    document.getElementById('viewbtn-' + m.id).style.display = 'block';
                }
            });
        });
    }

    function vote(mId, c, p) {
        if(confirm("پێشبینییەکە قفڵ بکرێت؟ ئیتر ناتوانیت دەستکاری بکەیت.")) {
            db.ref('users/' + currentUser + '/predictions/' + mId).set({ choice: c, pts: p });
        }
    }

    function setResult(mId, winChoice, pts) {
        if(!confirm("خاڵەکان هەژمار بکرێن بۆ هەمووان؟")) return;
        db.ref('results/' + mId).set({ winner: winChoice }).then(() => {
            db.ref('users').once('value', snap => {
                snap.forEach(uSnap => {
                    const u = uSnap.val();
                    if(u.predictions && u.predictions[mId] && u.predictions[mId].choice == winChoice) {
                        db.ref('users/' + uSnap.key).update({ 
                            weekly: (u.weekly || 0) + pts, 
                            total: (u.total || 0) + pts 
                        });
                    }
                });
                alert("تەواو! خاڵەکان هەژمار کران.");
            });
        });
    }

    function showPredictions(mId) {
        const m = matches.find(x => x.id === mId);
        document.getElementById('pred-match-title').innerText = `${m.t1} vs ${m.t2}`;
        db.ref('users').once('value', snap => {
            let h = '';
            snap.forEach(u => {
                const p = u.val().predictions ? u.val().predictions[mId] : null;
                let txt = "پێشبینی نەکردووە";
                if(p) txt = p.choice == 1 ? m.t1 : p.choice == 2 ? "یەکسان" : m.t2;
                h += `<div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid rgba(255,255,255,0.05);">
                        <span>${u.key}</span><span style="color:var(--secondary)">${txt}</span>
                      </div>`;
            });
            document.getElementById('preds-content').innerHTML = h;
            document.getElementById('all-preds-view').style.display = 'flex';
        });
    }

    function openRank() {
        db.ref('users').once('value', snap => {
            let p = []; snap.forEach(u => { p.push({ n: u.key, ...u.val() }); });
            p.sort((a, b) => (b.total || 0) - (a.total || 0));
            document.getElementById('rank-list').innerHTML = p.map(i => `
                <div style="display:flex; justify-content:space-between; padding:15px 10px; border-bottom:1px solid var(--border);">
                    <span style="font-weight:bold;">${i.n}</span>
                    <div style="display:flex; gap:20px;">
                        <span style="color:#aaa; font-size:12px;">هەفتە: ${i.weekly||0}</span>
                        <span style="color:var(--secondary); font-weight:900;">${i.total||0}</span>
                    </div>
                </div>`).join('');
            document.getElementById('leaderboard-view').style.display = 'flex';
        });
    }

    function resetOnlyPredictions() {
        if(confirm("ئایا دڵنیایت لە سڕینەوەی هەموو پێشبینی و ئەنجامەکان؟")) {
            db.ref('results').remove();
            db.ref('users').once('value', snap => {
                snap.forEach(uSnap => { db.ref('users/' + uSnap.key + '/predictions').remove(); });
                alert("سڕایەوە!"); location.reload();
            });
        }
    }

    function closeView(id) { document.getElementById(id).style.display = 'none'; }
    function logout() { localStorage.removeItem('groupBryanUser'); location.reload(); }
</script>
</body>
</html>
