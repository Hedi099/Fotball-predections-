<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گروپی برایان</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #6366f1; --secondary: #fbbf24; --bg: #030712; --card-inner: rgba(15, 23, 42, 0.95); --border: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        
        #salawat-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.98); display: flex; justify-content: center; align-items: center; z-index: 9999; backdrop-filter: blur(10px); }
        .salawat-card { background: linear-gradient(145deg, #1e293b, #0f172a); border: 2px solid #fbbf24; padding: 30px; border-radius: 30px; text-align: center; max-width: 350px; width: 90%; box-shadow: 0 0 30px rgba(251, 191, 36, 0.2); }
        .salawat-text { font-size: 20px; line-height: 1.6; color: #fff; margin-bottom: 25px; font-weight: bold; }
        .salawat-btn { background: #fbbf24; color: #000; border: none; padding: 15px 30px; border-radius: 15px; font-weight: 900; cursor: pointer; font-size: 16px; transition: 0.3s; width: 100%; }

        .container { width: 100%; max-width: 440px; padding: 15px; }
        .top-nav { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .rank-btn { background: var(--secondary); color: #000; border: none; padding: 12px 8px; border-radius: 12px; font-weight: bold; cursor: pointer; flex: 1; text-align: center; font-size: 13px; }
        #leaderboard-view { display: none; background: var(--card-inner); border: 1px solid var(--border); border-radius: 20px; padding: 15px; margin-bottom: 20px; position: fixed; top: 5%; left: 5%; right: 5%; z-index: 1000; max-height: 85vh; overflow-y: auto; box-shadow: 0 0 40px #000; }
        .rank-header { display: flex; justify-content: space-between; padding: 10px; border-bottom: 2px solid var(--secondary); font-weight: bold; font-size: 13px; color: var(--secondary); }
        .rank-row { display: flex; justify-content: space-between; padding: 12px 10px; border-bottom: 1px solid var(--border); align-items: center; }
        .rank-name { flex: 2; text-align: right; }
        .rank-vals { flex: 1; display: flex; justify-content: space-around; font-weight: bold; }
        #all-preds-view { display: none; background: var(--card-inner); border: 1px solid var(--border); border-radius: 20px; padding: 15px; position: fixed; top: 15%; left: 8%; right: 8%; z-index: 1001; box-shadow: 0 0 50px #000; }
        .match-card { position: relative; border-radius: 30px; margin-top: 25px; overflow: hidden; border: 1px solid var(--border); background-image: url('https://images.unsplash.com/photo-1624896081705-72036a166046?w=800'); background-size: cover; background-position: center; }
        .card-overlay { background: linear-gradient(to bottom, rgba(3,7,18,0.5), var(--card-inner)); padding: 25px 15px; backdrop-filter: blur(2px); }
        .match-event-badge { position: absolute; top: 12px; right: 12px; background: var(--primary); color: white; font-size: 10px; font-weight: bold; padding: 4px 12px; border-radius: 50px; }
        .stadium-label { font-size: 10px; color: #aaa; margin-bottom: 5px; display: block; }
        .timer { font-size: 11px; color: var(--secondary); background: rgba(0,0,0,0.7); padding: 4px 12px; border-radius: 50px; display: inline-block; margin-bottom: 15px; direction: ltr; }
        .prediction-container { display: flex; justify-content: space-between; align-items: center; gap: 5px; }
        .predict-box { flex: 1; display: flex; flex-direction: column; align-items: center; }
        .team-logo { width: 50px; height: 50px; object-fit: contain; margin-bottom: 8px; }
        .team-name { font-size: 11px; font-weight: bold; text-align: center; height: 32px; line-height: 1.2; }
        .opt-btn { width: 90%; background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: #fff; padding: 12px 0; border-radius: 12px; cursor: pointer; font-size: 10px; transition: 0.2s; }
        .opt-btn.selected { background: var(--secondary) !important; color: #000 !important; font-weight: 900; box-shadow: 0 0 15px rgba(251,191,36,0.4); }
        .opt-btn:disabled:not(.selected) { opacity: 0.3; cursor: not-allowed; }
        .view-others-btn { width: 100%; margin-top: 15px; background: rgba(99, 102, 241, 0.2); color: #818cf8; border: 1px solid #4338ca; padding: 10px; border-radius: 12px; font-size: 11px; font-weight: bold; cursor: pointer; display: none; }
        .admin-tools { margin-top: 15px; padding-top: 10px; border-top: 1px dashed #444; display: none; text-align: center; }
        .admin-btn { background: #22c55e; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 10px; cursor: pointer; margin: 2px; }
        input { width: 100%; padding: 16px; border-radius: 15px; border: 1px solid var(--border); background: #111827; color: white; margin-bottom: 15px; text-align: center; font-size: 16px; }
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 16px; border-radius: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="salawat-overlay">
    <div class="salawat-card">
        <div style="font-size: 40px; margin-bottom: 15px;">✨</div>
        <div class="salawat-text">صەلەواتێک بنێرە بۆ گیانی پاکی پێغەمبەر (ص)</div>
        <button class="salawat-btn" onclick="closeSalawat()">اللهم صل على محمد</button>
    </div>
</div>

<div class="container">
    <div id="login-page">
        <h1 style="text-align: center; margin-bottom: 30px;">🏆 گروپی برایان</h1>
        <input type="text" id="userNameInput" placeholder="ناوەکەت بنووسە">
        <button class="btn-main" onclick="loginUser()">چوونە ژوورەوە</button>
    </div>

    <div id="main-app" style="display: none;">
        <div class="top-nav">
            <button class="rank-btn" onclick="openRank()">📊 ڕیزبەندی</button>
            <button id="admin-reset-btn" class="rank-btn" style="background:#ef4444; color:white; display:none;" onclick="resetOnlyPredictions()">🔄 Reset Preds</button>
            <button id="admin-reset-weekly" class="rank-btn" style="background:#dc2626; color:white; display:none;" onclick="resetWeeklyPoints()">🧹 Reset Weekly</button>
            <button class="rank-btn" style="background:#444; color:white; flex:0.6;" onclick="logout()">دەرچوون</button>
        </div>
        <div id="leaderboard-view">
            <div class="rank-header"><span style="flex:2">ناوی یاریزان</span><div style="flex:1; display:flex; justify-content:space-around;"><span>هەفتە</span><span>گشتی</span></div></div>
            <div id="rank-list"></div>
            <button class="btn-main" style="margin-top:20px;" onclick="closeView('leaderboard-view')">داخستن</button>
        </div>
        <div id="all-preds-view">
            <h3 id="pred-match-title" style="text-align:center; color:var(--secondary); font-size:14px;"></h3>
            <div id="preds-content" style="max-height:300px; overflow-y:auto;"></div>
            <button class="btn-main" style="margin-top:20px; padding:10px;" onclick="closeView('all-preds-view')">داخستن</button>
        </div>
        <div id="matches-list"></div>
    </div>
</div>

    function loginUser() {
        const n = document.getElementById('userNameInput').value.trim();
        if(!n) return; localStorage.setItem('groupBryanUser', n); location.reload();
    }

    if (currentUser) {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        const isAdmin = currentUser === 'Hedi';
        if(isAdmin) {
            document.getElementById('admin-reset-btn').style.display = 'block';
            document.getElementById('admin-reset-weekly').style.display = 'block';
        }
        
        let h = '';
        const now = new Date(); // کاتی ئێستا

        matches.forEach(m => {
            const matchDeadline = new Date(m.deadline);
            const isLocked = now >= matchDeadline; // ئایا کاتی پێشبینی بەسەرچووە؟
            
            // پیشاندانی کات بە شێوازێکی جوان
            const displayDate = matchDeadline.toLocaleString('en-GB', { day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit' });

            h += `<div class="match-card" id="${m.id}">
                <div class="card-overlay">
                    <div class="match-event-badge">${m.event}</div>
                    <center>
                        <span class="stadium-label">🏟️ یاریگای ${m.t1}</span>
                        <div class="timer" style="${isLocked ? 'color:#ef4444;' : ''}">
                            ${isLocked ? '🔒 داخراوە: ' : 'کات: '} ${displayDate}
                        </div>
                    </center>
                    <div class="prediction-container">
                        <div class="predict-box"><img src="${m.img1}" class="team-logo"><div class="team-name">${m.t1}</div>
                            <button class="opt-btn" id="${m.id}-btn1" ${isLocked ? 'disabled' : ''} onclick="vote('${m.id}', 1, ${m.p1})">${m.p1} خاڵ</button></div>
                        <div class="predict-box" style="padding-top:25px;"><div class="team-name">یەکسان</div>
                            <button class="opt-btn" id="${m.id}-btn2" ${isLocked ? 'disabled' : ''} onclick="vote('${m.id}', 2, ${m.pX})">${m.pX} خاڵ</button></div>
                        <div class="predict-box"><img src="${m.img2}" class="team-logo"><div class="team-name">${m.t2}</div>
                            <button class="opt-btn" id="${m.id}-btn3" ${isLocked ? 'disabled' : ''} onclick="vote('${m.id}', 3, ${m.p2})">${m.p2} خاڵ</button></div>
                    </div>
                    <button class="view-others-btn" id="viewbtn-${m.id}" onclick="showPredictions('${m.id}', '${m.t1} vs ${m.t2}')">👁 بینینی پێشبینی ئەوانی تر</button>
                    <div class="admin-tools" style="display:${isAdmin?'block':'none'}">
                        <button class="admin-btn" onclick="setResult('${m.id}',1,${m.p1})">بردنی1</button>
                        <button class="admin-btn" onclick="setResult('${m.id}',2,${m.pX})">X</button>
                        <button class="admin-btn" onclick="setResult('${m.id}',3,${m.p2})">بردنی2</button>
                    </div>
                </div>
            </div>`;
        });
        document.getElementById('matches-list').innerHTML = h || '<p>هیچ یارییەک نییە</p>';
        
        db.ref('users/' + currentUser + '/predictions').on('value', snap => {
            const preds = snap.val() || {};
            document.querySelectorAll('.opt-btn').forEach(b => { 
                const mid = b.id.split('-btn')[0];
                const matchData = matches.find(m => m.id === mid);
                const isLocked = new Date() >= new Date(matchData.deadline);
                
                b.classList.remove('selected'); 
                if(!isLocked) b.disabled = false; 
            });
            
            document.querySelectorAll('.view-others-btn').forEach(b => b.style.display = 'none');
            Object.keys(preds).forEach(mid => {
                const btn = document.getElementById(mid + '-btn' + preds[mid].choice);
                if(btn) {
                    btn.classList.add('selected');
                    document.querySelectorAll(`#${mid} .opt-btn`).forEach(b => b.disabled = true);
                    document.getElementById('viewbtn-' + mid).style.display = 'block';
                }
            });
        });
    }

    function vote(mId, c, p) {
        const matchData = matches.find(m => m.id === mId);
        if(new Date() >= new Date(matchData.deadline)) {
            alert("ببورە، دێدلاینی ئەم یارییە کۆتایی هاتووە و پێشبینی وەرناگیرێت.");
            return;
        }
        if(confirm("پێشبینییەکە قفڵ بکرێت؟")) db.ref('users/' + currentUser + '/predictions/' + mId).set({ choice: c, pts: p });
    }

    function resetWeeklyPoints() {
        if(confirm("ئایا دڵنیایت لە سفرکردنەوەی خاڵەکانی 'ئەم هەفتەیە'؟")) {
            db.ref('users').once('value', snap => {
                snap.forEach(uSnap => { db.ref('users/' + uSnap.key).update({ weekly: 0 }); });
                alert("خاڵەکانی هەفتە سفرکرانەوە!"); location.reload();
            });
        }
    }

    function resetOnlyPredictions() {
        if(confirm("پێشبینییەکان بسڕێنەوە؟")) {
            db.ref('users').once('value', snap => {
                snap.forEach(uSnap => { db.ref('users/' + uSnap.key + '/predictions').remove(); });
                alert("سڕایەوە!"); location.reload();
            });
        }
    }

    function showPredictions(mId, title) {
        document.getElementById('pred-match-title').innerText = title;
        db.ref('users').once('value', snap => {
            let listH = '';
            snap.forEach(u => {
                const p = u.val().predictions ? u.val().predictions[mId] : null;
                const m = matches.find(x => x.id === mId);
                let choiceText = "پێشبینی نەکردووە";
                if(p && m) choiceText = p.choice == 1 ? m.t1 : p.choice == 2 ? "یەکسان" : m.t2;
                listH += `<div class="rank-row"><span>${u.key}</span><span style="color:var(--secondary)">${choiceText}</span></div>`;
            });
            document.getElementById('preds-content').innerHTML = listH;
            document.getElementById('all-preds-view').style.display = 'block';
        });
    }

    function openRank() {
        db.ref('users').once('value', snap => {
            let p = []; snap.forEach(u => { p.push({ n: u.key, ...u.val() }); });
            p.sort((a, b) => (b.total || 0) - (a.total || 0));
            document.getElementById('rank-list').innerHTML = p.map(i => `
                <div class="rank-row">
                    <span class="rank-name">${i.n}</span>
                    <div class="rank-vals"><span>${i.weekly||0}</span><span>${i.total||0}</span></div>
                </div>`).join('');
            document.getElementById('leaderboard-view').style.display = 'block';
        });
    }

    function setResult(mId, winChoice, pts) {
        if(!confirm("خاڵەکان هەژمار بکرێن؟")) return;
        db.ref('users').once('value', snap => {
            snap.forEach(uSnap => {
                const u = uSnap.val();
                if(u.predictions && u.predictions[mId] && u.predictions[mId].choice == winChoice) {
                    db.ref('users/' + uSnap.key).update({ weekly: (u.weekly || 0) + pts, total: (u.total || 0) + pts });
                }
            });
            alert("تەواو بوو!");
        });
    }

    function closeView(id) { document.getElementById(id).style.display = 'none'; }
    function logout() { localStorage.removeItem('groupBryanUser'); location.reload(); }
</script>
</body>
</html>
