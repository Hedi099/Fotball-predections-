<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گروپی برایان - نوێبوونەوە</title>
    <style>
        :root { --primary: #6366f1; --bg: #030712; }
        body { 
            background: var(--bg); 
            color: white; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: 'Segoe UI', Tahoma, sans-serif;
            text-align: center;
        }
        .maintenance-container {
            padding: 20px;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            display: block;
        }
        h1 {
            color: #fbbf24;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #d1d5db;
            font-size: 16px;
        }
        .loader {
            border: 4px solid #1f2937;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="maintenance-container">
    <span class="icon">🛠️</span>
    <h1>وێبسایتەکە لە نوێبوونەوەدایە</h1>
    <p>ببورن بۆ ماوەیەکی کاتی ڕاگیراوە، بەم زووانە دەگەڕێینەوە...</p>
    <div class="loader"></div>
</div>
