<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئەپی پێشبینی هاوار</title>
    <style>
        /* --- ستایڵ و ڕەنگەکان --- */
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        body {
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container { width: 100%; max-width: 500px; }

        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: #3b82f6; margin-bottom: 5px; }

        /* سێ کارتەکە */
        .top-cards { display: flex; gap: 10px; margin-bottom: 25px; }
        .card {
            flex: 1; padding: 15px; border-radius: 15px;
            text-align: center; background: #1e293b;
            border-bottom: 4px solid #3b82f6;
        }
        .card h3 { font-size: 12px; margin: 0; color: #94a3b8; }
        .card .count { font-size: 20px; font-weight: bold; display: block; margin-top: 5px; }

        /* --- بەشی نوێ: فۆرمی ناردنی پێشبینی --- */
        .prediction-form {
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 1px solid #334155;
        }
        .prediction-form h2 { font-size: 16px; margin-top: 0; color: #f59e0b; }
        
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #3b82f6;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #2563eb; }

        /* لیستی خوارەوە */
        .match-item {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 4px solid #10b981;
        }
        .teams { font-weight: bold; font-size: 14px; }
        .prediction-text { color: #10b981; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <h1>سیستەمی پێشبینی</h1>
            <small>بەخێرهاتی هاوار گیان</small>
        </header>

        <div class="top-cards">
            <div class="card"><h3>یارییەکان</h3><span class="count" id="match-count">0</span></div>
            <div class="card" style="border-color: #10b981;"><h3>سەرکەوتوو</h3><span class="count">٨٥٪</span></div>
            <div class="card" style="border-color: #f59e0b;"><h3>خاڵەکان</h3><span class="count">١٢٥٠</span></div>
        </div>

        <div class="prediction-form">
            <h2>پێشبینی نوێ بنووسە</h2>
            <input type="text" id="matchInput" placeholder="نموونە: ڕیال مەدرید - لیڤەرپوول">
            <input type="text" id="predictInput" placeholder="پێشبینی تۆ (بۆ نموونە: ٢-١)">
            <button onclick="addPrediction()">ناردنی پێشبینی 🚀</button>
        </div>

        <div class="match-list">
            <h2 style="font-size: 18px;">لیستی پێشبینییەکان</h2>
            <div id="list-container">
                </div>
        </div>
    </div>

    <script>
        let count = 0;

        function addPrediction() {
            const match = document.getElementById('matchInput').value;
            const predict = document.getElementById('predictInput').value;

            if (match === '' || predict === '') {
                alert("تکایە هەموو خانەکان پڕ بکەرەوە!");
                return;
            }

            const container = document.getElementById('list-container');
            
            // دروستکردنی دیزاینی یاری نوێ
            const div = document.createElement('div');
            div.className = 'match-item';
            div.innerHTML = `
                <div>
                    <div class="teams">${match}</div>
                    <small style="color: #94a3b8;">ئێستا</small>
                </div>
                <div class="prediction-text">${predict}</div>
            `;

            // زیادکردن بۆ سەرەوەی لیستەکە
            container.prepend(div);

            // زیادکردنی ژمارەی یارییەکان
            count++;
            document.getElementById('match-count').innerText = count;

            // پاککردنەوەی خانەکان
            document.getElementById('matchInput').value = '';
            document.getElementById('predictInput').value = '';
        }
    </script>
</body>
</html>
