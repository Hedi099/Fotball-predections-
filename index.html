<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گروپی برایان - وەشانی VIP</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { 
            --primary: #3b82f6; --secondary: #f59e0b; --bg: #0f172a; 
            --card-bg: rgba(30, 41, 59, 0.8); --border: rgba(255, 255, 255, 0.1); 
            --danger: #ef4444; --success: #22c55e;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: radial-gradient(circle at top right, #1e293b, #0f172a); color: white; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; padding: 15px; }
        .hadith-box { background: rgba(245, 158, 11, 0.1); border: 1px solid var(--secondary); border-radius: 20px; padding: 20px; margin-bottom: 25px; text-align: center; }
        #login-page, #main-app, .admin-box { background: var(--card-bg); backdrop-filter: blur(10px); padding: 25px; border-radius: 30px; border: 1px solid var(--border); margin-top: 15px; text-align: center; }
        input { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid var(--border); background: rgba(15, 23, 42, 0.8); color: white; margin-bottom: 15px; text-align: center; }
        .btn-main { width: 100%; background: linear-gradient(to left, var(--primary), #8b5cf6); color: white; border: none; padding: 16px; border-radius: 15px; font-weight: bold; cursor: pointer; }
        .match-card { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); border-radius: 25px; padding: 20px 10px; margin-top: 25px; position: relative; }
        .stadium-info { font-size: 11px; color: #94a3b8; display: block; margin-top: 12px; text-align: center; border-top: 1px solid var(--border); padding-top: 8px; }
        .timer { font-size: 12px; color: var(--secondary); font-weight: bold; background: rgba(0,0,0,0.3); padding: 5px 12px; border-radius: 50px; margin-bottom: 10px; display: inline-block; direction: ltr; }
        .prediction-container { display: flex; justify-content: space-around; align-items: center; }
        .predict-box { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .team-logo { width: 55px; height: 55px; object-fit: contain; background: white; border-radius: 12px; padding: 5px; }
        .team-name { font-size: 11px; font-weight: 600; color: #f1f5f9; text-align: center; margin-bottom: 5px; height: 35px; display: flex; align-items: center; }
        .opt-btn { width: 90%; background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: white; padding: 10px 2px; border-radius: 10px; cursor: pointer; font-size: 11px; }
        .opt-btn.selected { background: var(--secondary); color: black; font-weight: bold; border-color: white; }
        .expired { opacity: 0.6; filter: grayscale(0.4); }
        #leaderboard-overlay { display: none; position: fixed; inset: 0; background: #0f172a; z-index: 1000; padding: 20px; overflow-y: auto; }
        .rank-table { width: 100%; border-collapse: collapse; margin-top: 10px; background: rgba(255,255,255,0.03); border-radius: 15px; overflow: hidden; }
        .rank-table th { background: #1e293b; color: var(--secondary); padding: 15px; font-size: 14px; }
        .rank-table td { padding: 15px 10px; border-bottom: 1px solid var(--border); text-align: center; font-size: 14px; }
        .rank-table td.u-n { text-align: right; font-weight: bold; }
        .admin-item { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 15px; margin-bottom: 15px; border-right: 4px solid var(--primary); }
        .admin-btns { display: flex; gap: 8px; margin-top: 10px; }
        .adm-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 10px; color: white; }
        .close-btn { background: var(--danger); color: white; border: none; padding: 12px; border-radius: 12px; width: 100%; cursor: pointer; margin-bottom: 10px; }
        
        /* ستایلی تابلۆی براوەی هەفتە */
        .winner-banner { background: linear-gradient(45deg, #f59e0b, #d97706); color: black; padding: 12px; border-radius: 15px; font-weight: bold; margin-bottom: 15px; font-size: 14px; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
        
        /* دوگمەی دابەزاندنی ئەپ */
        #installBtn { display: none; background: #22c55e; border: none; color: white; padding: 15px; border-radius: 15px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <div class="hadith-box">
        <span style="color:var(--secondary); font-size:12px; font-weight:bold;">پێغەمبەرمان محمد ﷺ ئەفەرموێت :</span>
        <div style="font-size:14px; margin-top:10px;">«الدَّالُّ عَلَى الخَيْرِ كَفَاعِلِهِ»</div>
        <div style="font-size:12px; margin-top:8px; color: #cbd5e1; border-top: 1px dashed rgba(255,255,255,0.2); padding-top:8px;">
            واتە: "ئەو کەسەی ڕێنمایی خەڵکی دەکات بۆ کاری چاکە، وەک ئەوە وایە کە خۆی کارەکەی کردبێت."
        </div>
    </div>

    <div id="login-page">
        <h1>🏆 گروپی برایان</h1>
        <input type="text" id="userNameInput" placeholder="ناوەکەت بنووسە">
        <button class="btn-main" onclick="loginUser()">چوونە ژوورەوە</button>
    </div>

    <div id="main-app" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 20px;">
            <div style="text-align: right;">
                <span id="welcomeText" style="color: var(--secondary); font-weight: bold;"></span><br>
                <small onclick="logoutUser()" style="color: var(--danger); cursor:pointer;">دەرچوون ↩</small>
            </div>
            <div style="display: flex; gap: 15px;">
                <div style="text-align:center;"><div id="uWeekly" style="color:var(--success); font-weight:bold;">0</div><small>هەفتە</small></div>
                <div style="text-align:center;"><div id="uTotal" style="color:var(--secondary); font-weight:bold;">0</div><small>گشتی</small></div>
            </div>
        </div>

        <button id="installBtn">📲 دابەزاندنی ئەپی (گروپی برایان)</button>

        <button class="btn-main" style="background: white; color: black; margin: 20px 0;" onclick="openLeaderboard()">📊 خشتەی ڕیزبەندی</button>
        <div id="matches-list"></div>

        <div id="admin-panel" class="admin-box" style="display:none; border: 2px solid var(--danger);">
            <h3 style="color:var(--danger)">کۆنتڕۆڵی ئەنجامەکان (Hedi)</h3>
            <div id="admin-controls"></div>
            <button class="btn-main" style="background:var(--danger); margin-top:20px;" onclick="resetWeeklyOnly()">🔄 سڕینەوەی خاڵی هەفتە</button>
        </div>
    </div>
</div>

<div id="leaderboard-overlay">
    <button class="close-btn" onclick="document.getElementById('leaderboard-overlay').style.display='none'">داخستن ✖</button>
    
    <div class="winner-banner">
        <span>👏 براوەی هەفتە دەبێتە خاوەن چەپڵەیەکی گەرم</span>
    </div>

    <table class="rank-table">
        <thead>
            <tr><th style="text-align: right;">یاریزان</th><th>هەفتە</th><th>گشتی</th></tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
    </table>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBCXp7vjnb1naq1GpiyN29Br3SH_yNGkkQ",
        authDomain: "brayan-2a1ef.firebaseapp.com",
        databaseURL: "https://brayan-2a1ef-default-rtdb.firebaseio.com",
        projectId: "brayan-2a1ef",
        storageBucket: "brayan-2a1ef.firebasestorage.app",
        messagingSenderId: "655783456427",
        appId: "1:655783456427:web:1535d3dfd9b53515c391ee"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentUser = localStorage.getItem('groupBryanUser');

    // لۆژیکی دابەزاندنی وێبسایت بۆ سەر شاشە
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installBtn.style.display = 'none';
            }
            deferredPrompt = null;
        }
    });

    const matches = [
        { id: "m1", t1: "ئیسپانیۆل", t2: "ریال ئۆڤیدۆ", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/80.png", img2: "https://crests.football-data.org/71.png", stadium: "Stage Front Stadium", deadline: "2026-03-09T23:00:00+03:00" },
        { id: "m2", t1: "لیڤەرپووڵ", t2: "گەلەتەسەرای", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/64.png", img2: "https://crests.football-data.org/610.png", stadium: "Anfield", deadline: "2026-03-10T20:45:00+03:00" },
        { id: "m3", t1: "ئەتڵانتا", t2: "بایرن میونشن", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/102.png", img2: "https://crests.football-data.org/5.png", stadium: "Gewiss Stadium", deadline: "2026-03-10T23:00:00+03:00" },
        { id: "m4", t1: "ئەتلەتیکۆ مەدرید", t2: "تۆتنهام", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/78.png", img2: "https://crests.football-data.org/73.png", stadium: "Metropolitano", deadline: "2026-03-10T23:00:00+03:00" },
        { id: "m5", t1: "بارسێلۆنا", t2: "نیوکاسڵ", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/81.png", img2: "https://crests.football-data.org/67.png", stadium: "Camp Nou", deadline: "2026-03-10T23:00:00+03:00" },
        { id: "m6", t1: "ئارسناڵ", t2: "لیڤەرکوزن", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/57.png", img2: "https://crests.football-data.org/3.png", stadium: "Emirates Stadium", deadline: "2026-03-11T20:45:00+03:00" },
        { id: "m7", t1: "ڕیاڵ مەدرید", t2: "مان سیتی", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/86.png", img2: "https://crests.football-data.org/65.png", stadium: "Santiago Bernabéu", deadline: "2026-03-11T23:00:00+03:00" },
        { id: "m8", t1: "بۆدۆ گلیمت", t2: "لیشبۆنە", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/5444.png", img2: "https://crests.football-data.org/498.png", stadium: "Aspmyra Stadion", deadline: "2026-03-11T23:00:00+03:00" },
        { id: "m9", t1: "پاریس", t2: "چێڵسی", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/524.png", img2: "https://crests.football-data.org/61.png", stadium: "Parc des Princes", deadline: "2026-03-11T23:00:00+03:00" },
        { id: "m10", t1: "بۆلۆگنا", t2: "ڕۆما", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/103.png", img2: "https://crests.football-data.org/100.png", stadium: "Stadio Renato Dall'Ara", deadline: "2026-03-12T20:45:00+03:00" },
        { id: "m11", t1: "لیل", t2: "ئەستۆن ڤێلا", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/521.png", img2: "https://crests.football-data.org/58.png", stadium: "Stade Pierre-Mauroy", deadline: "2026-03-12T23:00:00+03:00" },
        { id: "m12", t1: "سێلتاڤیگۆ", t2: "لیۆن", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/80.png", img2: "https://crests.football-data.org/523.png", stadium: "Balaídos", deadline: "2026-03-12T23:00:00+03:00" }
    ];

    function loginUser() {
        const name = document.getElementById('userNameInput').value.trim();
        if (name.length < 2) return;
        localStorage.setItem('groupBryanUser', name); location.reload();
    }

    function updateTimers() {
        matches.forEach(m => {
            const now = new Date().getTime();
            const target = new Date(m.deadline).getTime();
            const diff = target - now;
            const timerEl = document.getElementById('timer-' + m.id);
            const cardEl = document.getElementById(m.id);

            if (diff <= 0) {
                if (timerEl) timerEl.innerHTML = "🔒 داخراوە";
                if (cardEl) cardEl.classList.add('expired');
                document.querySelectorAll(`#${m.id} .opt-btn`).forEach(b => b.disabled = true);
            } else {
                const h = Math.floor(diff / (1000 * 60 * 60));
                const m_rem = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                if (timerEl) timerEl.innerHTML = `⏳ ${h}h ${m_rem}m ${s}s`;
            }
        });
    }

    if (currentUser) {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('welcomeText').innerText = "سڵاو، " + currentUser;
        if (currentUser === "Hedi") document.getElementById('admin-panel').style.display = 'block';

        let h = '', a = '';
        matches.forEach(m => {
            h += `<div class="match-card" id="${m.id}">
                <div style="text-align:center;"><div class="timer" id="timer-${m.id}">...</div></div>
                <div class="prediction-container">
                    <div class="predict-box">
                        <span class="team-name">${m.t1}</span>
                        <img src="${m.img1}" class="team-logo">
                        <button class="opt-btn" id="${m.id}-btn1" onclick="vote('${m.id}', 1, ${m.p1})">1 (${m.p1})</button>
                    </div>
                    <div class="predict-box">
                        <span class="team-name">یەکسان</span>
                        <button class="opt-btn" id="${m.id}-btn2" onclick="vote('${m.id}', 2, ${m.pX})" style="margin-top:55px;">X (${m.pX})</button>
                    </div>
                    <div class="predict-box">
                        <span class="team-name">${m.t2}</span>
                        <img src="${m.img2}" class="team-logo">
                        <button class="opt-btn" id="${m.id}-btn3" onclick="vote('${m.id}', 3, ${m.p2})">2 (${m.p2})</button>
                    </div>
                </div>
                <div class="stadium-info">${m.stadium}</div>
            </div>`;

            a += `<div class="admin-item"><div>${m.t1} vs ${m.t2}</div><div class="admin-btns">
                <button class="adm-btn" style="background:var(--success)" onclick="finish('${m.id}',1,${m.p1})">${m.t1}</button>
                <button class="adm-btn" style="background:#555;" onclick="finish('${m.id}',2,${m.pX})">X</button>
                <button class="adm-btn" style="background:var(--danger)" onclick="finish('${m.id}',3,${m.p2})">${m.t2}</button>
            </div></div>`;
        });
        document.getElementById('matches-list').innerHTML = h;
        document.getElementById('admin-controls').innerHTML = a;
        setInterval(updateTimers, 1000);
        updateTimers();

        db.ref('users/' + currentUser).on('value', snap => {
            const d = snap.val() || {total:0, weekly:0};
            document.getElementById('uTotal').innerText = d.total || 0;
            document.getElementById('uWeekly').innerText = d.weekly || 0;
            if (d.predictions) {
                Object.keys(d.predictions).forEach(mid => {
                    const btn = document.getElementById(mid + '-btn' + d.predictions[mid].choice);
                    if(btn) {
                        document.getElementById(mid).querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
                        btn.classList.add('selected');
                    }
                });
            }
        });
    }

    function vote(mId, c, p) { if(confirm("پێشبینییەکەت قفڵ دەکەیت؟")) db.ref('users/'+currentUser+'/predictions/'+mId).set({choice:c, pts:p}); }

    function finish(mId, res, p) {
        db.ref('users').once('value').then(snap => {
            snap.forEach(u => {
                const d = u.val();
                if(d.predictions?.[mId]?.choice == res) {
                    db.ref('users/'+u.key).update({total: (d.total||0)+p, weekly: (d.weekly||0)+p});
                }
            });
            alert("ئەنجام هەژمار کرا!");
        });
    }

    function openLeaderboard() {
        db.ref('users').once('value').then(snap => {
            let arr = [];
            snap.forEach(u => {
                const data = u.val();
                arr.push({name: u.key, t: data.total || 0, w: data.weekly || 0});
            });
            arr.sort((a,b) => b.w - a.w);
            let row = '';
            arr.forEach((u, i) => {
                row += `<tr><td class="u-n">${i+1}. ${u.name}</td><td>${u.w}</td><td>${u.t}</td></tr>`;
            });
            document.getElementById('leaderboard-body').innerHTML = row;
            document.getElementById('leaderboard-overlay').style.display = 'block';
        });
    }

    function resetWeeklyOnly() {
        if(confirm("سفرکردنەوەی هەفتانە؟")) {
            db.ref('users').once('value').then(snap => {
                snap.forEach(u => db.ref('users/'+u.key).update({weekly:0, predictions:{}}));
            });
        }
    }

    function logoutUser() { localStorage.removeItem('groupBryanUser'); location.reload(); }
</script>
</body>
</html>
