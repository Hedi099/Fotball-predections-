<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گروپی برایان - وەشانی VIP</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { 
            --primary: #3b82f6; --secondary: #f59e0b; --bg: #0f172a; 
            --card-bg: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1); 
            --danger: #ef4444; --success: #22c55e;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: radial-gradient(circle at top right, #1e293b, #0f172a); color: white; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; padding: 15px; }
        .hadith-box { background: rgba(245, 158, 11, 0.1); border: 1px solid var(--secondary); border-radius: 20px; padding: 20px; margin-bottom: 15px; text-align: center; }
        
        .install-app-btn {
            display: block; width: 100%; background: linear-gradient(45deg, #059669, #10b981);
            color: white; border: none; padding: 14px; border-radius: 15px; font-weight: bold;
            font-size: 14px; cursor: pointer; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: 0.3s; animation: bounce 2s infinite;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        #login-page, #main-app, .admin-box { background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(10px); padding: 25px; border-radius: 30px; border: 1px solid var(--border); margin-top: 15px; text-align: center; }
        input { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid var(--border); background: rgba(15, 23, 42, 0.8); color: white; margin-bottom: 15px; text-align: center; font-size: 16px; }
        .btn-main { width: 100%; background: linear-gradient(to left, var(--primary), #8b5cf6); color: white; border: none; padding: 16px; border-radius: 15px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        
        .btn-leaderboard {
            width: 100%; background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid var(--secondary);
            padding: 14px; border-radius: 20px; font-weight: bold; cursor: pointer; margin: 20px 0;
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s;
        }
        .btn-leaderboard:hover { background: var(--secondary); color: black; }

        .delete-account-btn { background: var(--danger); color: white; border: none; padding: 4px 8px; border-radius: 8px; font-size: 9px; cursor: pointer; font-weight: bold; }

        .match-card { 
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.8)), url('https://images.unsplash.com/photo-1522778119026-d647f0596c20?q=80&w=1000&auto=format&fit=crop');
            background-size: cover; background-position: center; border: 1px solid var(--border); 
            border-radius: 25px; padding: 25px 10px; margin-top: 25px; position: relative; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden;
        }
        .stadium-info { font-size: 11px; color: #cbd5e1; display: block; margin-top: 15px; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; }
        .timer { font-size: 12px; color: var(--secondary); font-weight: bold; background: rgba(0,0,0,0.7); padding: 5px 15px; border-radius: 50px; margin-bottom: 15px; display: inline-block; direction: ltr; border: 1px solid var(--secondary); }
        .prediction-container { display: flex; justify-content: space-around; align-items: center; position: relative; z-index: 1; }
        .predict-box { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .team-logo { width: 60px; height: 60px; object-fit: contain; background: rgba(255,255,255,0.95); border-radius: 18px; padding: 8px; }
        .team-name { font-size: 12px; font-weight: bold; color: #ffffff; text-align: center; height: 35px; display: flex; align-items: center; text-shadow: 2px 2px 5px rgba(0,0,0,1); }
        .opt-btn { width: 90%; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 12px 2px; border-radius: 12px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .opt-btn.selected { background: var(--secondary); color: black; font-weight: 900; border-color: white; }
        
        #leaderboard-overlay { display: none; position: fixed; inset: 0; background: #0f172a; z-index: 1000; padding: 20px; overflow-y: auto; }
        
        .rank-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        .rank-table thead th { color: #94a3b8; font-size: 13px; padding: 10px; font-weight: bold; }
        .rank-row { background: rgba(255, 255, 255, 0.05); }
        .rank-row td { padding: 15px 12px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        .rank-row td:first-child { border-right: 1px solid var(--border); border-top-right-radius: 15px; border-bottom-right-radius: 15px; text-align: right; }
        .rank-row td:last-child { border-left: 1px solid var(--border); border-top-left-radius: 15px; border-bottom-left-radius: 15px; text-align: left; }
        .pts-badge { color: var(--success); font-weight: bold; }
        .total-badge { color: #94a3b8; font-size: 13px; margin-left: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="hadith-box">
        <span style="color:var(--secondary); font-size:12px; font-weight:bold;">پێغەمبەرمان محمد ﷺ ئەفەرموێت :</span>
        <div style="font-size:15px; margin-top:10px; font-weight: bold; line-height: 1.6;">
            «أَسْتَغْفِرُ اللَّهَ العَظِيمَ الَّذِي لاَ إِلَهَ إِلَّا هُوَ الحَيُّ القَيُّومُ وَأَتُوبُ إِلَيْهِ»
            <br>
            <span style="font-size: 13px; color: #cbd5e1; font-weight: normal;">هەرکەسێک بیڵێت گوناهەکانی دەبەخشرێت ئەگەر لە مەیدانی جەنگیش ڕایکردبێت</span>
        </div>
    </div>

    <button id="pwaInstallBtn" class="install-app-btn">📲 دابەزاندنی ئەپی (گروپی برایان)</button>

    <div id="login-page">
        <h1>🏆 گروپی برایان</h1>
        <input type="text" id="userNameInput" placeholder="ناوەکەت بنووسە">
        <input type="password" id="userPassInput" placeholder="پاسوۆرد (ئەگەر هەتبێت)">
        <button class="btn-main" onclick="loginUser()">چوونە ژوورەوە</button>
    </div>

    <div id="main-app" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 20px; border: 1px solid var(--border);">
            <div style="text-align: right;">
                <span id="welcomeText" style="color: var(--secondary); font-weight: bold;"></span><br>
                <div style="display: flex; gap: 8px; align-items: center; margin-top: 5px;">
                    <small onclick="logoutUser()" style="color: #94a3b8; cursor:pointer; font-size: 11px;">دەرچوون ↩</small>
                    <span class="delete-account-btn" onclick="deleteAccount()">سڕینەوە 🗑️</span>
                </div>
            </div>
            <div style="display: flex; gap: 15px;">
                <div style="text-align:center;"><div id="uWeekly" style="color:var(--success); font-weight:bold;">0</div><small>هەفتە</small></div>
                <div style="text-align:center;"><div id="uTotal" style="color:var(--secondary); font-weight:bold;">0</div><small>گشتی</small></div>
            </div>
        </div>
        
        <button class="btn-leaderboard" onclick="openLeaderboard()">
            <span>📊</span> بینینی ڕیزبەندی یاریزانان <span>🏆</span>
        </button>

        <div id="matches-list"></div>
    </div>
</div>

<div id="leaderboard-overlay">
    <button class="btn-main" style="background:var(--danger); margin-bottom:15px;" onclick="document.getElementById('leaderboard-overlay').style.display='none'">داخستن ✖</button>
    <table class="rank-table">
        <thead>
            <tr>
                <th style="text-align: right;">یاریزانەکان</th>
                <th style="text-align: left;">هەفتە / گشتی</th>
            </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
    </table>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBCXp7vjnb1naq1GpiyN29Br3SH_yNGkkQ",
        authDomain: "brayan-2a1ef.firebaseapp.com",
        databaseURL: "https://brayan-2a1ef-default-rtdb.firebaseio.com",
        projectId: "brayan-2a1ef",
        storageBucket: "brayan-2a1ef.firebasestorage.app",
        messagingSenderId: "655783456427",
        appId: "1:655783456427:web:1535d3dfd9b53515c391ee"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentUser = localStorage.getItem('groupBryanUser');

    const matches = [
        { id: "m1", t1: "ئیسپانیۆل", t2: "ریال ئۆڤیدۆ", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/80.png", img2: "https://crests.football-data.org/71.png", stadium: "RCDE Stadium", deadline: "2026-03-09T23:00:00+03:00" },
        { id: "m2", t1: "لیڤەرپووڵ", t2: "گەلەتەسەرای", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/64.png", img2: "https://crests.football-data.org/610.png", stadium: "Anfield", deadline: "2026-03-10T20:45:00+03:00" },
        { id: "m3", t1: "ئەتڵانتا", t2: "بایرن میونشن", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/102.png", img2: "https://crests.football-data.org/5.png", stadium: "Gewiss Stadium", deadline: "2026-03-10T23:00:00+03:00" },
        { id: "m4", t1: "ئەتلەتیکۆ مەدرید", t2: "تۆتنهام", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/78.png", img2: "https://crests.football-data.org/73.png", stadium: "Metropolitano", deadline: "2026-03-10T23:00:00+03:00" },
        { id: "m5", t1: "بارسێلۆنا", t2: "نیوکاسڵ", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/81.png", img2: "https://crests.football-data.org/67.png", stadium: "Camp Nou", deadline: "2026-03-10T23:00:00+03:00" },
        { id: "m6", t1: "ئارسناڵ", t2: "لیڤەرکوزن", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/57.png", img2: "https://crests.football-data.org/3.png", stadium: "Emirates Stadium", deadline: "2026-03-11T20:45:00+03:00" },
        { id: "m7", t1: "ڕیاڵ مەدرید", t2: "مان سیتی", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/86.png", img2: "https://crests.football-data.org/65.png", stadium: "Santiago Bernabéu", deadline: "2026-03-11T23:00:00+03:00" },
        { id: "m8", t1: "بۆدۆ گلیمت", t2: "لیشبۆنە", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/5444.png", img2: "https://crests.football-data.org/498.png", stadium: "Aspmyra Stadion", deadline: "2026-03-11T23:00:00+03:00" },
        { id: "m9", t1: "پاریس", t2: "چێڵسی", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/524.png", img2: "https://crests.football-data.org/61.png", stadium: "Parc des Princes", deadline: "2026-03-11T23:00:00+03:00" },
        { id: "m10", t1: "بۆلۆگنا", t2: "ڕۆما", p1: 2, pX: 3, p2: 4, img1: "https://crests.football-data.org/103.png", img2: "https://crests.football-data.org/100.png", stadium: "Stadio Renato Dall'Ara", deadline: "2026-03-12T20:45:00+03:00" }
    ];

    async function loginUser() {
        const name = document.getElementById('userNameInput').value.trim();
        const pass = document.getElementById('userPassInput').value.trim();
        if(name.length < 2) return;
        const snap = await db.ref('users/' + name).once('value');
        const userData = snap.val();
        if(userData && userData.password && userData.password !== pass) { alert("⚠️ پاسوۆرد هەڵەیە!"); return; }
        localStorage.setItem('groupBryanUser', name);
        location.reload();
    }

    if (currentUser) {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('welcomeText').innerText = "سڵاو، " + currentUser;

        let h = '';
        matches.forEach(m => {
            h += `<div class="match-card" id="${m.id}">
                <div style="text-align:center;"><div class="timer" id="timer-${m.id}">...</div></div>
                <div class="prediction-container">
                    <div class="predict-box"><span class="team-name">${m.t1}</span><img src="${m.img1}" class="team-logo">
                        <button class="opt-btn" id="${m.id}-btn1" onclick="vote('${m.id}', 1, ${m.p1})">${m.p1} خاڵ</button></div>
                    <div class="predict-box"><span class="team-name">X</span>
                        <button class="opt-btn" id="${m.id}-btn2" onclick="vote('${m.id}', 2, ${m.pX})" style="margin-top:55px;">${m.pX} خاڵ</button></div>
                    <div class="predict-box"><span class="team-name">${m.t2}</span><img src="${m.img2}" class="team-logo">
                        <button class="opt-btn" id="${m.id}-btn3" onclick="vote('${m.id}', 3, ${m.p2})">${m.p2} خاڵ</button></div>
                </div><div class="stadium-info">🏟️ ${m.stadium}</div></div>`;
        });
        document.getElementById('matches-list').innerHTML = h;

        db.ref('users/' + currentUser).on('value', snap => {
            const d = snap.val() || {total:0, weekly:0};
            document.getElementById('uTotal').innerText = d.total || 0;
            document.getElementById('uWeekly').innerText = d.weekly || 0;
            if (d.predictions) {
                Object.keys(d.predictions).forEach(mid => {
                    const btn = document.getElementById(mid + '-btn' + d.predictions[mid].choice);
                    if(btn) btn.classList.add('selected');
                });
            }
        });
    }

    function openLeaderboard() {
        db.ref('users').once('value').then(snap => {
            let arr = []; snap.forEach(u => { const data = u.val(); arr.push({name: u.key, t: data.total || 0, w: data.weekly || 0}); });
            arr.sort((a,b) => b.w - a.w);
            let row = ''; 
            arr.forEach((u, i) => { 
                let medal = i === 0 ? "🥇 " : i === 1 ? "🥈 " : i === 2 ? "🥉 " : (i+1) + ". ";
                row += `<tr class="rank-row">
                    <td>${medal}${u.name}</td>
                    <td><span class="pts-badge">${u.w}</span> / <span class="total-badge">${u.t}</span></td>
                </tr>`; 
            });
            document.getElementById('leaderboard-body').innerHTML = row;
            document.getElementById('leaderboard-overlay').style.display = 'block';
        });
    }

    function logoutUser() { localStorage.removeItem('groupBryanUser'); location.reload(); }
    function deleteAccount() { if(confirm("دڵنیای؟")) { db.ref('users/'+currentUser).remove(); logoutUser(); } }
    function vote(mId, c, p) { if(confirm("پێشبینییەکەت قفڵ دەکەیت؟")) db.ref('users/'+currentUser+'/predictions/'+mId).set({choice:c, pts:p}); }
</script>
</body>
</html>
