<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گروپی برایان - ئۆنلاین</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --primary: #3b82f6; --secondary: #f59e0b; --bg: #0f172a; --card-bg: rgba(30, 41, 59, 0.95); --border: rgba(255, 255, 255, 0.1); --danger: #ef4444; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: white; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; padding: 20px; }
        
        /* Styles */
        #login-page, #main-app { background: var(--card-bg); padding: 30px; border-radius: 25px; border: 1px solid var(--border); margin-top: 50px; text-align: center; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: #0f172a; color: white; margin-bottom: 20px; text-align: center; }
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .match-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-top: 20px; }
        .opt-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; padding: 10px; border-radius: 10px; cursor: pointer; margin: 5px; width: 30%; font-size: 12px; }
        .opt-btn.selected { background: var(--primary); border-color: white; }
        .rank-btn { margin-top: 20px; background: none; border: 1px solid var(--secondary); color: var(--secondary); padding: 10px 20px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-page">
        <h2 style="color: var(--secondary)">چوونە ژوورەوە</h2>
        <input type="text" id="userNameInput" placeholder="ناوەکەت بنووسە...">
        <button class="btn-main" onclick="loginUser()">دەستپێبکە</button>
    </div>

    <div id="main-app" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span id="welcomeText"></span>
            <button onclick="logoutUser()" style="color: var(--danger); background:none; border:none; cursor:pointer;">دەرچوون</button>
        </div>
        
        <div class="match-card">
            <p>ئیتاڵیا: ئینتەر - میلان</p>
            <div style="display: flex; justify-content: center;">
                <button class="opt-btn" id="m1-btn1" onclick="makeChoice('m1', 1)">ئینتەر</button>
                <button class="opt-btn" id="m1-btn2" onclick="makeChoice('m1', 2)">یەکسان</button>
                <button class="opt-btn" id="m1-btn3" onclick="makeChoice('m1', 3)">میلان</button>
            </div>
        </div>

        <button class="rank-btn" onclick="showLeaderboard()">🏆 بینینی ڕیزبەندی</button>
        <div id="leaderboard" style="margin-top: 20px; text-align: right;"></div>
    </div>
</div>

<script>
     // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBCXp7vjnb1naq1GpiyN29Br3SH_yNGkkQ",
  authDomain: "brayan-2a1ef.firebaseapp.com",
  databaseURL: "https://brayan-2a1ef-default-rtdb.firebaseio.com",
  projectId: "brayan-2a1ef",
  storageBucket: "brayan-2a1ef.firebasestorage.app",
  messagingSenderId: "655783456427",
  appId: "1:655783456427:web:1535d3dfd9b53515c391ee",
  measurementId: "G-ZJEW7HEPVE"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
    const firebaseConfig = {
        apiKey: "AIzaSy...",
        authDomain: "...",
        databaseURL: "...", // دڵنیابە ئەم لینکە لێرەیە
        projectId: "...",
        storageBucket: "...",
        messagingSenderId: "...",
        appId: "..."
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = localStorage.getItem('groupBryanUser');

    function loginUser() {
        const name = document.getElementById('userNameInput').value.trim();
        if (name.length < 2) return alert("ناوەکەت زۆر کورتە");

        // پشکنین و پاشەکەوتکردن لە سێرڤەر
        db.ref('users/' + name).once('value', (snap) => {
            if (!snap.exists()) {
                db.ref('users/' + name).set({ points: 0, predictions: {} });
            }
            localStorage.setItem('groupBryanUser', name);
            currentUser = name;
            startApp();
        }).catch(err => alert("هەڵە لە فایەربەیس: " + err.message));
    }

    function startApp() {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('welcomeText').innerText = "سڵاو " + currentUser;
        
        // هێنانی پێشبینییەکان
        db.ref('users/' + currentUser + '/predictions').on('value', (snap) => {
            const preds = snap.val() || {};
            highlight(preds);
        });
    }

    function makeChoice(mId, cId) {
        db.ref('users/' + currentUser + '/predictions/' + mId).set(cId);
    }

    function highlight(preds) {
        document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
        Object.keys(preds).forEach(mId => {
            const btn = document.getElementById(mId + '-btn' + preds[mId]);
            if(btn) btn.classList.add('selected');
        });
    }

    function showLeaderboard() {
        const list = document.getElementById('leaderboard');
        db.ref('users').once('value', (snap) => {
            let html = "<h4>ڕیزبەندی:</h4>";
            snap.forEach(user => {
                html += `<div>${user.key}: ${user.val().points} خاڵ</div>`;
            });
            list.innerHTML = html;
        });
    }

    function logoutUser() {
        localStorage.removeItem('groupBryanUser');
        location.reload();
    }

    if (currentUser) startApp();
</script>
</body>
    </html>
