<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brothers Group | Premium Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Noto+Sans+Arabic:wght@300;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #050505;
            --accent: #fbbf24; /* ئاڵتوونی */
            --card-bg: #111111;
            --border: #222222;
            --text-main: #e2e8f0;
        }

        * { box-sizing: border-box; font-family: 'Noto Sans Arabic', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 480px; padding: 25px; position: relative; }

        /* لۆگۆیەکی ناوازە */
        .premium-header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        .premium-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 4px;
            color: white;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
        }

        .premium-logo::after {
            content: "";
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        /* کارتەکان */
        .p-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0px; /* ستایلی تیژ و مۆدێرن */
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        .p-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent);
        }

        /* دوگمەکان */
        .btn-premium {
            width: 100%;
            padding: 16px;
            background: none;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.4s;
            margin-bottom: 15px;
        }

        .btn-premium:hover {
            background: var(--accent);
            color: black;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
        }

        /* بەشی پێشبینی */
        .match-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
        }

        .team-box { text-align: center; flex: 1; }
        .team-box img { width: 55px; height: 55px; filter: grayscale(0.3); transition: 0.3s; }
        .team-box:hover img { filter: grayscale(0); transform: scale(1.1); }

        .vs-circle {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron';
            font-size: 12px;
            color: var(--accent);
        }

        .opt-grid { display: flex; gap: 10px; }
        .opt-item {
            flex: 1;
            padding: 15px 5px;
            border: 1px solid var(--border);
            background: #0a0a0a;
            color: white;
            text-align: center;
            cursor: pointer;
        }

        .opt-item.selected {
            border-color: var(--accent);
            background: rgba(251, 191, 36, 0.1);
            color: var(--accent);
        }

        /* هادیسەکە */
        .quote-box {
            font-style: italic;
            border-right: 2px solid var(--accent);
            padding: 15px;
            background: #0a0a0a;
            margin-bottom: 30px;
            font-size: 14px;
            line-height: 1.8;
            color: #888;
        }

        input {
            width: 100%;
            padding: 18px;
            background: #0a0a0a;
            border: 1px solid var(--border);
            color: white;
            margin-bottom: 20px;
            outline: none;
        }

        input:focus { border-color: var(--accent); }

        .back-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 20px;
            cursor: pointer;
        }

        /* ئەنیمەیشنی هاتنە ناوەوە */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section { animation: slideUp 0.5s ease-out; }

    </style>
</head>
<body>

<div class="container">
    <div id="login-page" class="section" style="margin-top: 100px;">
        <div class="premium-header">
            <div class="premium-logo">BROTHERS</div>
        </div>
        <input type="text" id="userNameInput" placeholder="ناوەکەت لێرە بنووسە">
        <button class="btn-premium" onclick="loginUser()">ENTER SYSTEM</button>
    </div>

    <div id="selection-page" class="section" style="display: none;">
        <div class="quote-box">
             «ارْحَمُوا مَنْ فِي الأَرْضِ يَرْحَمْكُمْ مَنْ فِي السَّمَاءِ»<br>
             ڕەحم بەوانە بکە کە لەسەر زەوین، تاوەکو ئەوەی لە ئاسمانە ڕەحمتان پێ بکات.
        </div>
        
        <div class="premium-header" style="margin-bottom: 20px;">
            <div class="premium-logo" style="font-size: 24px;">DASHBOARD</div>
        </div>

        <button class="btn-premium" onclick="showSection('preds')">FOOTBALL PREDICTIONS</button>
        <button class="btn-premium" onclick="showSection('quiz')" style="border-color: #8b5cf6; color: #8b5cf6;">KNOWLEDGE QUIZ</button>
        
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn-premium" style="font-size: 10px; padding: 10px;" onclick="openRank('preds')">LEADERBOARD</button>
            <button class="btn-premium" style="font-size: 10px; padding: 10px; border-color: #444; color: #444;" onclick="logout()">LOGOUT</button>
        </div>
    </div>

    <div id="main-app" style="display: none;">
        <div id="preds-section" class="section" style="display: none;">
            <span class="back-link" onclick="showSection('home')">← گەڕانەوە بۆ سەرەکی</span>
            <div id="matches-list"></div>
        </div>

        <div id="quiz-section" class="section" style="display: none;">
            <span class="back-link" onclick="showSection('home')">← گەڕانەوە بۆ سەرەکی</span>
            <div class="p-card">
                <h3 id="quiz-question" style="text-align: center; font-weight: 300;">ئامادەیت بۆ تاقیکردنەوە؟</h3>
                <div id="quiz-options"></div>
                <button id="start-quiz-btn" class="btn-premium" onclick="nextQuestion()">START QUIZ</button>
            </div>
        </div>
    </div>
</div>

<script>
    // لێرە Firebaseەکەت وەکو خۆی دادەنێیتەوە
    const firebaseConfig = { 
        apiKey: "AIzaSyBCXp7vjnb1naq1GpiyN29Br3SH_yNGkkQ", 
        authDomain: "brayan-2a1ef.firebaseapp.com", 
        databaseURL: "https://brayan-2a1ef-default-rtdb.firebaseio.com", 
        projectId: "brayan-2a1ef", 
        storageBucket: "brayan-2a1ef.firebasestorage.app", 
        messagingSenderId: "655783456427", 
        appId: "1:655783456427:web:1535d3dfd9b53515c391ee" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentUser = localStorage.getItem('groupBryanUser');

    // بەشی لۆجیک (هەمان ماسیەکان و فەنکشنەکانت لێرە کۆپی بکەرەوە)
    // من لێرە نموونەیەک لە renderMatches دادەنێم بە دیزاینە نوێیەکە:

    function renderMatches() {
        // ئەمە تەنیا نموونەیە، تۆ لیستە گەورەکەی خۆتی تێبکە
        const matches = [ {id: "m1", t1: "ڕیاڵ مەدرید", t2: "بارسێلۆنا", p1: 3, pX: 2, p2: 4, event: "LALIGA", img1: "https://crests.football-data.org/86.png", img2: "https://crests.football-data.org/81.png", deadline: "2026-10-10T22:00:00"} ];
        
        let h = '';
        matches.forEach(m => {
            h += `
            <div class="p-card">
                <div style="font-size: 10px; color: var(--accent); letter-spacing: 2px;">${m.event}</div>
                <div class="match-row">
                    <div class="team-box"><img src="${m.img1}"><div>${m.t1}</div></div>
                    <div class="vs-circle">VS</div>
                    <div class="team-box"><img src="${m.img2}"><div>${m.t2}</div></div>
                </div>
                <div class="opt-grid">
                    <div class="opt-item" onclick="vote('${m.id}',1)">1 <br> <small>${m.p1}pts</small></div>
                    <div class="opt-item" onclick="vote('${m.id}',2)">X <br> <small>${m.pX}pts</small></div>
                    <div class="opt-item" onclick="vote('${m.id}',3)">2 <br> <small>${m.p2}pts</small></div>
                </div>
            </div>`;
        });
        document.getElementById('matches-list').innerHTML = h;
    }

    function loginUser() {
        const n = document.getElementById('userNameInput').value.trim();
        if(!n) return; localStorage.setItem('groupBryanUser', n); location.reload();
    }

    function showSection(sec) {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('selection-page').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('preds-section').style.display = 'none';
        document.getElementById('quiz-section').style.display = 'none';
        
        if(sec === 'home') { document.getElementById('selection-page').style.display = 'block'; document.getElementById('main-app').style.display = 'none'; }
        else if(sec === 'preds') { document.getElementById('preds-section').style.display = 'block'; renderMatches(); }
        else if(sec === 'quiz') { document.getElementById('quiz-section').style.display = 'block'; }
    }

    if(currentUser) {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('selection-page').style.display = 'block';
    }

    function logout() { localStorage.removeItem('groupBryanUser'); location.reload(); }
</script>

</body>
</html>
