<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گروپی برایان - وەشانی نوێ</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #3b82f6; --secondary: #f59e0b; --bg: #0f172a; --card-bg: rgba(30, 41, 59, 0.95); --border: rgba(255, 255, 255, 0.1); --danger: #ef4444; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0f172a; color: white; margin: 0; min-height: 100vh; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; padding: 20px; padding-bottom: 120px; }
        
        #login-page { margin-top: 80px; text-align: center; background: var(--card-bg); padding: 40px 20px; border-radius: 30px; border: 1px solid var(--border); }
        input { width: 100%; background: rgba(15, 23, 42, 0.7); border: 1px solid var(--border); padding: 15px; border-radius: 15px; color: white; margin-bottom: 15px; text-align: center; outline: none; font-size: 16px; }
        
        #main-app { display: none; width: 100%; }
        .match-card { background: var(--card-bg); padding: 20px; border-radius: 25px; border: 1px solid var(--border); text-align: center; margin-bottom: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .teams-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .team-box { flex: 1; }
        .team-box img { width: 60px; height: 60px; object-fit: contain; margin-bottom: 8px; }
        .team-name { font-weight: bold; font-size: 14px; display: block; }
        .vs-badge { background: var(--secondary); color: black; font-weight: 900; padding: 4px 10px; border-radius: 8px; font-size: 12px; }

        .prediction-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .opt-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); border-radius: 15px; padding: 12px 5px; cursor: pointer; color: white; transition: 0.3s; position: relative; }
        .opt-btn strong { display: block; font-size: 13px; margin-bottom: 5px; }
        .pts-badge { background: rgba(245, 158, 11, 0.2); color: var(--secondary); font-size: 11px; padding: 2px 6px; border-radius: 10px; border: 1px solid rgba(245, 158, 11, 0.3); }
        
        .opt-btn.selected { background: var(--primary); border-color: white; transform: translateY(-3px); }
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        
        /* Logout Button Style */
        .logout-link { color: var(--danger); font-size: 13px; text-decoration: none; cursor: pointer; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); padding: 5px 12px; border-radius: 8px; margin-top: 8px; display: inline-block; transition: 0.3s; }
        .logout-link:hover { background: var(--danger); color: white; }

        .nav-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 85%; max-width: 400px; background: #1e293b; padding: 15px; border-radius: 20px; text-align: center; border: 1px solid var(--border); z-index: 50; }
        
        #leaderboard-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; width: 90%; max-width: 350px; padding: 25px; border-radius: 25px; border: 1px solid var(--border); }
    </style>
</head>
<body>

<div class="container">
    <div id="login-page">
        <h1 style="color: var(--secondary); margin-bottom: 10px;">گروپی برایان</h1>
        <p style="color: #94a3b8; margin-bottom: 30px;">سیستەمی پێشبینی یارییەکان</p>
        <input type="text" id="userNameInput" placeholder="ناوەکەت بنووسە">
        <button class="btn-main" onclick="loginUser()">چوونە ژوورەوە</button>
    </div>

    <div id="main-app">
        <header style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px;">
            <div>
                <span id="welcomeText" style="font-weight: bold; font-size: 18px;"></span><br>
                <button class="logout-link" onclick="logoutUser()">دەرچوون لە ئەکاونت</button>
            </div>
            <div style="text-align: center;">
                <span style="font-size: 12px; color: #94a3b8;">کۆی خاڵەکان</span><br>
                <span id="userPoints" style="color: var(--secondary); font-size: 22px; font-weight: bold;">0</span>
            </div>
        </header>

        <div class="match-card">
            <div class="teams-header">
                <div class="team-box">
                    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/c/ce/Inter_Milan_2021.svg/1024px-Inter_Milan_2021.svg.png">
                    <span class="team-name">ئینتەر</span>
                </div>
                <div class="vs-badge">VS</div>
                <div class="team-box">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Logo_of_AC_Milan.svg/1024px-Logo_of_AC_Milan.svg.png">
                    <span class="team-name">میلان</span>
                </div>
            </div>
            <div class="prediction-grid">
                <button class="opt-btn" onclick="makeChoice(1, 1)"><strong>بردنەوەی ئینتەر</strong><span class="pts-badge">2 خاڵ</span></button>
                <button class="opt-btn" onclick="makeChoice(1, 2)"><strong>یەکسانبوون</strong><span class="pts-badge">3 خاڵ</span></button>
                <button class="opt-btn" onclick="makeChoice(1, 3)"><strong>بردنەوەی میلان</strong><span class="pts-badge">4 خاڵ</span></button>
            </div>
        </div>

        <div class="nav-bar">
            <button onclick="toggleLeaderboard(true)" style="background:none; border:none; color:white; font-weight:bold; cursor:pointer; font-size:16px;">🏆 بینینی ڕیزبەندی گشتی</button>
        </div>
    </div>
</div>

<div id="leaderboard-modal">
    <div class="modal-content">
        <h3 style="text-align: center; color: var(--secondary); margin-bottom: 20px;">🏆 ڕیزبەندی برادەران</h3>
        <div id="leaderboardList"></div>
        <button class="btn-main" style="margin-top: 20px; background: #334155;" onclick="toggleLeaderboard(false)">داخستن</button>
    </div>
</div>

<script>
    // لۆجیکی سادە بۆ تاقیکردنەوە
    function loginUser() {
        const name = document.getElementById('userNameInput').value;
        if(name.trim() !== "") {
            localStorage.setItem('username', name);
            showApp(name);
        } else {
            alert("تکایە ناوەکەت بنووسە");
        }
    }

    function showApp(name) {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('welcomeText').innerText = "سڵاو، " + name;
    }

    function logoutUser() {
        if(confirm("ئایا دڵنیایت لە دەرچوون؟")) {
            localStorage.removeItem('username');
            location.reload(); // لاپەڕەکە نوێ دەکاتەوە و دەچێتەوە سەر لۆگین
        }
    }

    function toggleLeaderboard(show) {
        document.getElementById('leaderboard-modal').style.display = show ? 'flex' : 'none';
    }

    // پشکنینی ئەوەی پێشتر لۆگین کراوە یاخود نا
    window.onload = function() {
        const savedName = localStorage.getItem('username');
        if(savedName) {
            showApp(savedName);
        }
    }
</script>

</body>
</html>
