<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گروپی برایان - پێشبینی یەکجارە</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --primary: #3b82f6; --secondary: #f59e0b; --bg: #0f172a; --card-bg: rgba(30, 41, 59, 0.95); --border: rgba(255, 255, 255, 0.1); --danger: #ef4444; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: white; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; padding: 20px; }
        
        #login-page, #main-app { background: var(--card-bg); padding: 30px; border-radius: 25px; border: 1px solid var(--border); margin-top: 50px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: #1e293b; color: white; margin-bottom: 20px; text-align: center; font-size: 16px; outline: none; }
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; }
        
        .match-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-top: 20px; position: relative; }
        .prediction-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        
        .opt-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; padding: 12px 5px; border-radius: 12px; cursor: pointer; transition: 0.3s; position: relative; }
        .opt-btn.selected { background: var(--primary); border-color: white; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); opacity: 1 !important; }
        .opt-btn:disabled { cursor: not-allowed; }
        
        .pts-badge { display: block; font-size: 11px; color: var(--secondary); margin-top: 5px; font-weight: bold; }
        .leaderboard-section { margin-top: 30px; background: rgba(255,255,255,0.02); border-radius: 15px; padding: 15px; }
        .rank-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<div class="container">
    <div id="login-page">
        <h2 style="color: var(--secondary); margin-bottom: 10px;">گروپی برایان</h2>
        <input type="text" id="userNameInput" placeholder="ناوەکەت بنووسە...">
        <button class="btn-main" onclick="loginUser()">چوونە ژوورەوە</button>
    </div>

    <div id="main-app" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div style="text-align: right;">
                <span id="welcomeText" style="font-weight: bold;"></span><br>
                <button onclick="logoutUser()" style="color: var(--danger); background:none; border:none; cursor:pointer; font-size: 12px; padding:0;">دەرچوون</button>
            </div>
            <div style="background: rgba(245, 158, 11, 0.1); padding: 5px 15px; border-radius: 10px; border: 1px solid var(--secondary);">
                <span style="font-size: 12px; color: #94a3b8;">خاڵەکانت:</span>
                <strong id="userPoints" style="color: var(--secondary); font-size: 18px;">0</strong>
            </div>
        </div>
        
        <div class="match-card" id="m1">
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 15px;">خولی ئیتاڵیا - سان سیرۆ</p>
            <div style="display: flex; justify-content: space-around; align-items: center;">
                <div>
                    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/c/ce/Inter_Milan_2021.svg/1024px-Inter_Milan_2021.svg.png" width="45"><br>
                    <small>ئینتەر</small>
                </div>
                <div style="font-weight: 900; color: var(--secondary);">VS</div>
                <div>
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Logo_of_AC_Milan.svg/1024px-Logo_of_AC_Milan.svg.png" width="45"><br>
                    <small>میلان</small>
                </div>
            </div>

            <div class="prediction-grid">
                <button class="opt-btn" id="m1-btn1" onclick="makeChoice('m1', 1, 2)">
                    <strong>ئینتەر</strong>
                    <span class="pts-badge">2 خاڵ</span>
                </button>
                <button class="opt-btn" id="m1-btn2" onclick="makeChoice('m1', 2, 3)">
                    <strong>یەکسان</strong>
                    <span class="pts-badge">3 خاڵ</span>
                </button>
                <button class="opt-btn" id="m1-btn3" onclick="makeChoice('m1', 3, 4)">
                    <strong>میلان</strong>
                    <span class="pts-badge">4 خاڵ</span>
                </button>
            </div>
            <p id="lock-msg" style="display:none; font-size: 11px; color: var(--secondary); margin-top: 10px;">⚠️ پێشبینییەکەت قفڵ کراوە و ناگۆڕدرێت</p>
        </div>

        <div class="leaderboard-section">
            <h4 style="color: var(--secondary); margin-bottom: 15px;">🏆 ڕیزبەندی گشتی</h4>
            <div id="leaderboardList"></div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBCXp7vjnb1naq1GpiyN29Br3SH_yNGkkQ",
        authDomain: "brayan-2a1ef.firebaseapp.com",
        databaseURL: "https://brayan-2a1ef-default-rtdb.firebaseio.com",
        projectId: "brayan-2a1ef",
        storageBucket: "brayan-2a1ef.firebasestorage.app",
        messagingSenderId: "655783456427",
        appId: "1:655783456427:web:1535d3dfd9b53515c391ee"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = localStorage.getItem('groupBryanUser');

    function loginUser() {
        const name = document.getElementById('userNameInput').value.trim();
        if (name.length < 2) return alert("ناوەکەت بنووسە");

        db.ref('users/' + name).once('value').then((snap) => {
            if (!snap.exists()) {
                db.ref('users/' + name).set({ points: 0, predictions: {} });
            }
            localStorage.setItem('groupBryanUser', name);
            currentUser = name;
            startApp();
        });
    }

    function startApp() {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('welcomeText').innerText = "سڵاو، " + currentUser;
        
        db.ref('users/' + currentUser).on('value', (snap) => {
            const data = snap.val();
            if (data) {
                document.getElementById('userPoints').innerText = data.points || 0;
                if (data.predictions) highlight(data.predictions);
            }
        });
        loadLeaderboard();
    }

    function makeChoice(matchId, choiceId, points) {
        if (!currentUser) return;

        // سەرەتا دڵنیادەبینەوە کە پێشتر پێشبینی نەکردووە
        db.ref('users/' + currentUser + '/predictions/' + matchId).once('value').then((snap) => {
            if (snap.exists()) {
                alert("تۆ پێشتر پێشبینیت کردووە!");
            } else {
                if(confirm("ئایا دڵنیایت؟ پێشبینییەکەت ناگۆڕدرێت.")) {
                    db.ref('users/' + currentUser + '/predictions/' + matchId).set({
                        choice: choiceId,
                        potentialPoints: points
                    });
                }
            }
        });
    }

    function highlight(preds) {
        Object.keys(preds).forEach(mId => {
            const choiceData = preds[mId];
            const choiceId = typeof choiceData === 'object' ? choiceData.choice : choiceData;
            
            // قفڵکردنی دوگمەکان
            document.querySelectorAll(`#${mId} .opt-btn`).forEach(btn => {
                btn.disabled = true;
                if (btn.id === `${mId}-btn${choiceId}`) {
                    btn.classList.add('selected');
                } else {
                    btn.style.opacity = "0.4";
                }
            });
            document.getElementById('lock-msg').style.display = 'block';
        });
    }

    function loadLeaderboard() {
        db.ref('users').orderByChild('points').on('value', (snap) => {
            let users = [];
            snap.forEach(u => {
                users.push({ name: u.key, points: u.val().points || 0 });
            });
            users.reverse();
            document.getElementById('leaderboardList').innerHTML = users.map((u, i) => `
                <div class="rank-row">
                    <span>${i+1}. ${u.name}</span>
                    <span style="color: var(--secondary)">${u.points} xاڵ</span>
                </div>
            `).join('');
        });
    }

    function logoutUser() {
        localStorage.removeItem('groupBryanUser');
        location.reload();
    }

    if (currentUser) startApp();
</script>

</body>
            </html>
