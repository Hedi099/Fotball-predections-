<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brothers Cup</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #6366f1; --secondary: #fbbf24; --bg: #030712; --card-inner: rgba(30, 41, 59, 0.7); --border: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(circle at top, #1e1b4b, #030712); color: white; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .glass { background: var(--card-inner); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 24px; }
        .container { width: 100%; max-width: 450px; padding: 20px; }
        
        .hadith-box { background: rgba(251, 191, 36, 0.1); border: 1px solid var(--secondary); border-radius: 15px; padding: 15px; text-align: center; margin-bottom: 20px; font-size: 13px; line-height: 1.6; color: #fefefe; }
        .hadith-arabic { display: block; color: var(--secondary); font-weight: bold; margin-bottom: 5px; font-size: 15px; }

        .logo-text { font-size: 28px; font-weight: 900; text-align: center; background: linear-gradient(to right, #fbbf24, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
        .top-nav { display: flex; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
        .nav-btn { flex: 1; padding: 10px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 12px; }
        
        .match-card { margin-bottom: 25px; overflow: hidden; }
        .match-header { padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .stadium-info { text-align: center; font-size: 11px; color: #fbbf24; margin: 10px 0 -10px 0; }
        .match-body { padding: 20px 15px; }
        
        /* چاککردنی قەبارەی لۆگۆکان */
        .teams-grid { display: flex; justify-content: space-around; align-items: center; margin-bottom: 20px; }
        .team { flex: 1; display: flex; flex-direction: column; align-items: center; }
        .team img { width: 42px; height: 42px; object-fit: contain; margin-bottom: 6px; }
        .team div { font-size: 11px; font-weight: bold; }
        
        .prediction-row { display: flex; gap: 6px; }
        .opt-btn { flex: 1; padding: 10px 2px; border-radius: 14px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .opt-btn span:first-child { font-size: 9px; opacity: 0.8; }
        .opt-btn span:last-child { font-size: 12px; font-weight: bold; }
        .opt-btn.selected { background: var(--secondary); color: #000; font-weight: bold; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; padding: 20px; align-items: center; justify-content: center; }
        .modal-content { width: 100%; max-width: 380px; padding: 20px; max-height: 80vh; overflow-y: auto; }
        .admin-zone { margin-top: 15px; display: flex; justify-content: center; gap: 5px; border-top: 1px dashed #444; padding-top: 10px; }
        .admin-action { padding: 6px 10px; border-radius: 8px; border: none; font-size: 10px; cursor: pointer; background: #22c55e; color: white; }
        
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: #000; color: white; margin-bottom: 10px; }
        .btn-main { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-page" style="margin-top: 50px;" class="glass match-body">
        <div class="logo-text">Brothers Cup</div>
        <input type="text" id="userNameInput" placeholder="ناوەکەت بنووسە">
        <button class="btn-main" onclick="loginUser()">چوونە ژوورەوە</button>
    </div>

    <div id="main-app" style="display: none;">
        <div class="hadith-box">
            <span class="hadith-arabic">«ارْحَمُوا مَنْ فِي الأَرْضِ يَرْحَمْكُمْ مَنْ فِي السَّمَاءِ»</span>
            پێغەمبەر (ص) دەفەرموێت: ڕەحم بەوانە بکە کە لەسەر زەوین، تاوەکو ئەوەی لە ئاسمانە ڕەحمتان پێ بکات.
        </div>
        
        <div class="logo-text">Brothers Cup</div>

        <div class="top-nav">
            <button class="nav-btn" style="background:var(--secondary)" onclick="openRank()">📊 ڕیزبەندی</button>
            <button id="reset-weekly-btn" class="nav-btn" style="background:#ef4444; color:white; display:none;" onclick="resetWeeklyPoints()">🧹 سفرکردنەوەی هەفتە</button>
            <button class="nav-btn" style="background:#334155; color:white; flex:0.3" onclick="logout()">🚪</button>
        </div>

        <div id="matches-list"></div>
    </div>
</div>

<div id="leaderboard-view" class="modal"><div class="modal-content glass"><h2 style="text-align:center;color:var(--secondary)">ڕیزبەندی</h2><div id="rank-list"></div><button class="btn-main" style="margin-top:20px" onclick="closeView('leaderboard-view')">داخستن</button></div></div>
<div id="all-preds-view" class="modal"><div class="modal-content glass"><h3 id="pred-match-title" style="text-align:center;color:var(--secondary)"></h3><div id="preds-content"></div><button class="btn-main" style="margin-top:20px" onclick="closeView('all-preds-view')">داخستن</button></div></div>

        { id: "m22_4", t1: "تۆتنهام", t2: "نۆتێنگهام", p1: 3, pX: 4, p2: 5, event: "پرێمەرلیگ", deadline: "2026-03-22T17:15:00", img1: "https://crests.football-data.org/73.png", img2: "https://crests.football-data.org/351.png" },
        { id: "m22_5", t1: "بارسێلۆنا", t2: "ڕایۆڤاییکانۆ", p1: 2, pX: 4, p2: 5, event: "خولی ئیسپانی", deadline: "2026-03-22T16:00:00", img1: "https://crests.football-data.org/81.png", img2: "https://crests.football-data.org/87.png" },
        { id: "m22_6", t1: "ئەتلەتیک بلباو", t2: "ریاڵ بیتس", p1: 3, pX: 2, p2: 4, event: "خولی ئیسپانی", deadline: "2026-03-22T20:30:00", img1: "https://crests.football-data.org/77.png", img2: "https://crests.football-data.org/90.png" },

        { id: "m22_8", t1: "کۆمۆ", t2: "پیسا", p1: 2, pX: 3, p2: 5, event: "خولی ئیتاڵی", deadline: "2026-03-22T14:30:00", img1: "https://crests.football-data.org/445.png", img2: "https://crests.football-data.org/1107.png" },
        { id: "m22_9", t1: "ڕۆما", t2: "لیچی", p1: 2, pX: 3, p2: 5, event: "خولی ئیتاڵی", deadline: "2026-03-22T20:00:00", img1: "https://crests.football-data.org/100.png", img2: "https://crests.football-data.org/112.png" },
        { id: "m22_10", t1: "فیۆرێنتینا", t2: "ئینتەرمیلان", p1: 5, pX: 3, p2: 2, event: "خولی ئیتاڵی", deadline: "2026-03-22T22:45:00", img1: "https://crests.football-data.org/99.png", img2: "https://crests.football-data.org/108.png" },
        { id: "m22_11", t1: "لیۆن", t2: "مۆناکۆ", p1: 4, pX: 2, p2: 3, event: "خولی فەڕەنسی", deadline: "2026-03-22T17:00:00", img1: "https://crests.football-data.org/521.png", img2: "https://crests.football-data.org/548.png" },
        { id: "m22_12", t1: "مارسیلیا", t2: "لیل", p1: 3, pX: 4, p2: 5, event: "خولی فەڕەنسی", deadline: "2026-03-22T19:15:00", img1: "https://crests.football-data.org/516.png", img2: "https://crests.football-data.org/527.png" },
        { id: "m22_13", t1: "ئارسناڵ", t2: "مان سیتی", p1: 3, pX: 2, p2: 4, event: "کاراباو کەپ", deadline: "2026-03-22T19:30:00", img1: "https://crests.football-data.org/57.png", img2: "https://crests.football-data.org/65.png" },
        { id: "m22_14", t1: "New York City", t2: "Inter Miami", p1: 3, pX: 4, p2: 5, event: "خولی ئەمریکی", deadline: "2026-03-22T20:00:00", img1: "https://crests.football-data.org/4330.png", img2: "https://crests.football-data.org/1132.png" },
        { id: "m26_1", t1: "ئیتاڵیا", t2: "ئێرلەندا", p1: 2, pX: 4, p2: 5, event: "پاڵاوتنی مۆندیال", deadline: "2026-03-26T22:45:00", img1: "https://crests.football-data.org/784.png", img2: "https://crests.football-data.org/791.png" },
        { id: "m26_2", t1: "بەرازیل", t2: "فەڕەنسا", p1: 5, pX: 3, p2: 4, event: "دۆستانە", deadline: "2026-03-26T23:00:00", img1: "https://crests.football-data.org/764.png", img2: "https://crests.football-data.org/773.png" }
    ];

    function loginUser() {
        const n = document.getElementById('userNameInput').value.trim();
        if(!n) return; localStorage.setItem('groupBryanUser', n); location.reload();
    }

    if (currentUser) {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        if(currentUser === 'Hedi') document.getElementById('reset-weekly-btn').style.display = 'block';
        renderMatches();
    }

    function renderMatches() {
        let h = '';
        matches.forEach(m => {
            const isLocked = new Date() >= new Date(m.deadline);
            h += `<div class="match-card glass">
                <div class="match-header"><span style="background:var(--primary);font-size:10px;padding:3px 8px;border-radius:10px">${m.event}</span><span style="font-size:10px;opacity:0.6">${new Date(m.deadline).toLocaleString('ku-IQ',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span></div>
                <div class="stadium-info">🏟️ یاریگای ${m.t1}</div>
                <div class="match-body">
                    <div class="teams-grid"><div class="team"><img src="${m.img1}"><div>${m.t1}</div></div><div style="color:var(--secondary);font-weight:900;font-size:14px">VS</div><div class="team"><img src="${m.img2}"><div>${m.t2}</div></div></div>
                    <div class="prediction-row">
                        <button class="opt-btn" id="${m.id}-btn1" ${isLocked?'disabled':''} onclick="vote('${m.id}',1,${m.p1})"><span>بردنەوەی ${m.t1}</span><span>${m.p1} خاڵ</span></button>
                        <button class="opt-btn" id="${m.id}-btn2" ${isLocked?'disabled':''} onclick="vote('${m.id}',2,${m.pX})"><span>یەکسان بوون</span><span>${m.pX} خاڵ</span></button>
                        <button class="opt-btn" id="${m.id}-btn3" ${isLocked?'disabled':''} onclick="vote('${m.id}',3,${m.p2})"><span>بردنەوەی ${m.t2}</span><span>${m.p2} خاڵ</span></button>
                    </div>
                    <button class="btn-main" id="viewbtn-${m.id}" style="margin-top:12px;padding:8px;font-size:11px;display:none;background:rgba(255,255,255,0.1)" onclick="showPredictions('${m.id}')">👁️ پێشبینی ئەوانی تر</button>
                    <div class="admin-zone" id="admin-tools-${m.id}" style="display:none"><button class="admin-action" onclick="setResult('${m.id}',1,${m.p1})">W1</button><button class="admin-action" style="background:#64748b" onclick="setResult('${m.id}',2,${m.pX})">X</button><button class="admin-action" onclick="setResult('${m.id}',3,${m.p2})">W2</button></div>
                </div>
            </div>`;
        });
        document.getElementById('matches-list').innerHTML = h;
        loadStates();
    }

    function loadStates() {
        const isAdmin = currentUser === 'Hedi';
        db.ref('results').on('value', s => {
            const res = s.val() || {};
            matches.forEach(m => {
                const tools = document.getElementById(`admin-tools-${m.id}`);
                if(isAdmin && !res[m.id]) tools.style.display='flex'; else if(tools) tools.style.display='none';
            });
        });
        db.ref('users/'+currentUser+'/predictions').on('value', s => {
            const ps = s.val() || {};
            matches.forEach(m => {
                if(ps[m.id]) {
                    document.getElementById(m.id+'-btn'+ps[m.id].choice).classList.add('selected');
                    document.querySelectorAll(`#${m.id} .opt-btn`).forEach(b=>b.disabled=true);
                    document.getElementById('viewbtn-'+m.id).style.display='block';
                }
            });
        });
    }

    function vote(mId, c, p) { if(confirm("پێشبینییەکە قفڵ بکرێت؟")) db.ref('users/'+currentUser+'/predictions/'+mId).set({choice:c, pts:p}); }

    function setResult(mId, win, pts) {
        if(!confirm("خاڵەکان هەژمار بکرێن؟ تەنها یەکجار دەکرێت!")) return;
        db.ref('results/'+mId).set({winner:win}).then(() => {
            db.ref('users').once('value', s => {
                s.forEach(u => {
                    const d = u.val();
                    if(d.predictions && d.predictions[mId] && d.predictions[mId].choice == win) {
                        db.ref('users/'+u.key).update({ weekly:(d.weekly||0)+pts, total:(d.total||0)+pts });
                    }
                });
            });
        });
    }

    function resetWeeklyPoints() {
        if(confirm("ئایا دڵنیایت لە سفرکردنەوەی خاڵی هەفتە بۆ هەمووان؟")) {
            db.ref('users').once('value', s => {
                s.forEach(u => db.ref('users/'+u.key).update({ weekly: 0 }));
                alert("خاڵەکانی هەفتە سفر کرانەوە.");
            });
        }
    }

    function openRank() {
        db.ref('users').once('value', s => {
            let r = []; s.forEach(u => { r.push({ n:u.key, ...u.val() }); });
            r.sort((a,b) => (b.total||0)-(a.total||0));
            document.getElementById('rank-list').innerHTML = r.map(i => `<div style="display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid var(--border)"><b>${i.n}</b><span>هـ: ${i.weekly||0} | گشتی: <b style="color:var(--secondary)">${i.total||0}</b></span></div>`).join('');
            document.getElementById('leaderboard-view').style.display = 'flex';
        });
    }

    function showPredictions(mId) {
        const m = matches.find(x => x.id === mId);
        document.getElementById('pred-match-title').innerText = `${m.t1} - ${m.t2}`;
        db.ref('users').once('value', s => {
            let h = '';
            s.forEach(u => {
                const p = u.val().predictions ? u.val().predictions[mId] : null;
                const txt = p ? (p.choice==1?m.t1:(p.choice==2?"یەکسان":m.t2)) : "---";
                h += `<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #333"><span>${u.key}</span><span style="color:var(--secondary)">${txt}</span></div>`;
            });
            document.getElementById('preds-content').innerHTML = h;
            document.getElementById('all-preds-view').style.display = 'flex';
        });
    }

    function closeView(id) { document.getElementById(id).style.display = 'none'; }
    function logout() { localStorage.removeItem('groupBryanUser'); location.reload(); }
</script>
</body>
</html>
