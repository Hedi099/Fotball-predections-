<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گروپی برایان - وەشانی پێشکەوتوو</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #3b82f6; --secondary: #f59e0b; --bg: #0f172a; --card-bg: rgba(30, 41, 59, 0.95); --border: rgba(255, 255, 255, 0.1); --danger: #ef4444; --success: #22c55e; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: white; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; padding: 20px; }
        #login-page, #main-app, .admin-box { background: var(--card-bg); padding: 30px; border-radius: 25px; border: 1px solid var(--border); margin-top: 20px; text-align: center; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: #1e293b; color: white; margin-bottom: 20px; text-align: center; }
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .match-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-top: 20px; position: relative; }
        .prediction-container { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 15px; gap: 5px; }
        .predict-box { flex: 1; display: flex; flex-direction: column; align-items: center; }
        .team-logo { width: 50px; height: 50px; object-fit: contain; margin-bottom: 8px; }
        .opt-btn { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; padding: 10px 2px; border-radius: 10px; cursor: pointer; font-size: 11px; }
        .opt-btn.selected { background: var(--primary); border-color: white; box-shadow: 0 0 10px var(--primary); }
        .pts-text { font-size: 11px; color: var(--secondary); margin-top: 5px; font-weight: bold; }
        .deadline-text { font-size: 10px; color: #94a3b8; display: block; margin-top: 5px; }
        
        /* Leaderboard Tabs */
        .tabs { display: flex; gap: 5px; margin-top: 20px; background: #1e293b; padding: 5px; border-radius: 12px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: none; color: #94a3b8; cursor: pointer; font-size: 12px; }
        .tab-btn.active { background: var(--primary); color: white; }
        .rank-row { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-page">
        <h2 style="color: var(--secondary)">گروپی برایان</h2>
        <input type="text" id="userNameInput" placeholder="ناوەکەت بنووسە...">
        <button class="btn-main" onclick="loginUser()">چوونە ژوورەوە</button>
    </div>

    <div id="main-app" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="text-align: right;">
                <span id="welcomeText" style="font-weight: bold;"></span><br>
                <button onclick="logoutUser()" style="color: var(--danger); background:none; border:none; cursor:pointer; font-size: 11px;">دەرچوون</button>
            </div>
            <div style="background: rgba(245, 158, 11, 0.1); padding: 5px 15px; border-radius: 10px; border: 1px solid var(--secondary);">
                <span id="userPoints" style="color: var(--secondary); font-size: 18px; font-weight: bold;">0</span>
                <span style="font-size: 10px; color: #94a3b8;">خاڵ</span>
            </div>
        </div>

        <div class="match-card" id="m1" data-deadline="2026-03-08T22:45:00">
            <p style="font-size: 12px; margin:0;">ئیتاڵیا - 22:45</p>
            <div class="prediction-container">
                <div class="predict-box">
                    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/c/ce/Inter_Milan_2021.svg/1024px-Inter_Milan_2021.svg.png" class="team-logo">
                    <button class="opt-btn" id="m1-btn1" onclick="makeChoice('m1', 1, 2)">ئینتەر</button>
                    <span class="pts-text">2 خاڵ</span>
                </div>
                <div class="predict-box">
                    <span style="margin-bottom: 15px; font-weight: bold; color: #475569;">VS</span>
                    <button class="opt-btn" id="m1-btn2" onclick="makeChoice('m1', 2, 3)">یەکسان</button>
                    <span class="pts-text">3 خاڵ</span>
                </div>
                <div class="predict-box">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Logo_of_AC_Milan.svg/1024px-Logo_of_AC_Milan.svg.png" class="team-logo">
                    <button class="opt-btn" id="m1-btn3" onclick="makeChoice('m1', 3, 4)">میلان</button>
                    <span class="pts-text">4 خاڵ</span>
                </div>
            </div>
            <span class="deadline-text" id="timer-m1"></span>
        </div>

        <div class="match-card" id="m_sev_ray" data-deadline="2026-03-08T21:00:00">
            <p style="font-size: 12px; margin:0;">ئیسپانیا - 21:00</p>
            <div class="prediction-container">
                <div class="predict-box">
                    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/3/3b/Sevilla_FC_logo.svg/800px-Sevilla_FC_logo.svg.png" class="team-logo">
                    <button class="opt-btn" id="m_sev_ray-btn1" onclick="makeChoice('m_sev_ray', 1, 2)">سێڤیلیا</button>
                    <span class="pts-text">2 خاڵ</span>
                </div>
                <div class="predict-box">
                    <span style="margin-bottom: 15px; font-weight: bold; color: #475569;">VS</span>
                    <button class="opt-btn" id="m_sev_ray-btn2" onclick="makeChoice('m_sev_ray', 2, 3)">یەکسان</button>
                    <span class="pts-text">3 خاڵ</span>
                </div>
                <div class="predict-box">
                    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/1/1b/Rayo_Vallecano_logo.svg/800px-Rayo_Vallecano_logo.svg.png" class="team-logo">
                    <button class="opt-btn" id="m_sev_ray-btn3" onclick="makeChoice('m_sev_ray', 3, 4)">ڤاییکانۆ</button>
                    <span class="pts-text">4 خاڵ</span>
                </div>
            </div>
            <span class="deadline-text" id="timer-m_sev_ray"></span>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('total', this)">گشتی</button>
            <button class="tab-btn" onclick="switchTab('monthly', this)">مانگانە</button>
            <button class="tab-btn" onclick="switchTab('weekly', this)">هەفتانە</button>
        </div>
        <div id="leaderboardList" style="margin-top: 10px; background: rgba(255,255,255,0.02); border-radius: 12px;"></div>

        <div id="admin-panel" class="admin-box" style="display:none; border: 1px dashed var(--secondary);">
            <h4 style="color:var(--secondary); margin-top:0;">کۆنترۆڵی Hedi</h4>
            <div style="font-size: 11px; margin-bottom: 10px;">ئەنجامی میلان-ئینتەر:</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px;">
                <button class="opt-btn" onclick="finishMatch('m1', 1, 2)">ئینتەر</button>
                <button class="opt-btn" onclick="finishMatch('m1', 2, 3)">یەکسان</button>
                <button class="opt-btn" onclick="finishMatch('m1', 3, 4)">میلان</button>
            </div>
            <div style="font-size: 11px; margin: 15px 0 10px 0;">ئەنجامی سێڤیلیا-ڤاییکانۆ:</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px;">
                <button class="opt-btn" onclick="finishMatch('m_sev_ray', 1, 2)">سێڤیلیا</button>
                <button class="opt-btn" onclick="finishMatch('m_sev_ray', 2, 3)">یەکسان</button>
                <button class="opt-btn" onclick="finishMatch('m_sev_ray', 3, 4)">ڤاییکانۆ</button>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBCXp7vjnb1naq1GpiyN29Br3SH_yNGkkQ",
        authDomain: "brayan-2a1ef.firebaseapp.com",
        databaseURL: "https://brayan-2a1ef-default-rtdb.firebaseio.com",
        projectId: "brayan-2a1ef",
        storageBucket: "brayan-2a1ef.firebasestorage.app",
        messagingSenderId: "655783456427",
        appId: "1:655783456427:web:1535d3dfd9b53515c391ee"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentUser = localStorage.getItem('groupBryanUser');
    let currentTab = 'total';

    function loginUser() {
        const name = document.getElementById('userNameInput').value.trim();
        if (name.length < 2) return alert("ناو بنووسە");
        db.ref('users/' + name).once('value').then((snap) => {
            if (!snap.exists()) db.ref('users/' + name).set({ total: 0, monthly: 0, weekly: 0, predictions: {} });
            localStorage.setItem('groupBryanUser', name);
            currentUser = name;
            startApp();
        });
    }

    function startApp() {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('welcomeText').innerText = "سڵاو، " + currentUser;
        if (currentUser === "Hedi") document.getElementById('admin-panel').style.display = 'block';
        
        db.ref('users/' + currentUser).on('value', (snap) => {
            const data = snap.val();
            if (data) {
                document.getElementById('userPoints').innerText = data.total || 0;
                if (data.predictions) highlight(data.predictions);
            }
        });
        loadLeaderboard();
        checkDeadlines();
    }

    function checkDeadlines() {
        setInterval(() => {
            document.querySelectorAll('.match-card').forEach(card => {
                const deadline = new Date(card.dataset.deadline).getTime();
                const now = new Date().getTime();
                const timerId = 'timer-' + card.id;
                const diff = deadline - now;

                if (diff <= 0) {
                    document.getElementById(timerId).innerText = "🔒 کات بەسەرچوو";
                    card.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
                } else {
                    const hours = Math.floor(diff / (1000 * 60 * 60));
                    const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    document.getElementById(timerId).innerText = `⏰ ماوە: ${hours}ک و ${mins}خ`;
                }
            });
        }, 1000);
    }

    function makeChoice(matchId, choiceId, pts) {
        const deadline = new Date(document.getElementById(matchId).dataset.deadline).getTime();
        if (new Date().getTime() > deadline) return alert("کات بەسەرچوو!");
        
        db.ref('users/' + currentUser + '/predictions/' + matchId).once('value').then((snap) => {
            if (snap.exists()) return alert("قفڵ کراوە!");
            if (confirm("دڵنیایت؟ ناگۆڕدرێت.")) {
                db.ref('users/' + currentUser + '/predictions/' + matchId).set({ choice: choiceId, pts: pts });
            }
        });
    }

    function highlight(preds) {
        Object.keys(preds).forEach(mId => {
            const choice = preds[mId].choice;
            document.querySelectorAll(`#${mId} .opt-btn`).forEach(btn => {
                btn.disabled = true;
                if (btn.id === `${mId}-btn${choice}`) btn.classList.add('selected');
                else btn.style.opacity = "0.3";
            });
        });
    }

    function switchTab(type, btn) {
        currentTab = type;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadLeaderboard();
    }

    function loadLeaderboard() {
        db.ref('users').on('value', (snap) => {
            let users = [];
            snap.forEach(u => users.push({ name: u.key, pts: u.val()[currentTab] || 0 }));
            users.sort((a, b) => b.pts - a.pts);
            document.getElementById('leaderboardList').innerHTML = users.map((u, i) => `
                <div class="rank-row"><span>${i+1}. ${u.name}</span><span style="color:var(--secondary)">${u.pts} خاڵ</span></div>
            `).join('');
        });
    }

    function finishMatch(matchId, result, pts) {
        if (!confirm("خاڵ دابەش بکرێت؟")) return;
        db.ref('users').once('value').then(snap => {
            snap.forEach(child => {
                const data = child.val();
                if (data.predictions && data.predictions[matchId] && data.predictions[matchId].choice == result) {
                    const uRef = db.ref('users/' + child.key);
                    uRef.update({
                        total: (data.total || 0) + pts,
                        monthly: (data.monthly || 0) + pts,
                        weekly: (data.weekly || 0) + pts
                    });
                }
            });
            alert("خاڵەکان هەژمار کران!");
        });
    }

    function logoutUser() { localStorage.removeItem('groupBryanUser'); location.reload(); }
    if (currentUser) startApp();
</script>
</body>
</html>
