<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گروپی برایان - وەشانی کۆتایی</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --primary: #3b82f6; --secondary: #f59e0b; --bg: #0f172a; --card-bg: rgba(30, 41, 59, 0.95); --border: rgba(255, 255, 255, 0.1); --danger: #ef4444; --success: #22c55e; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: white; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; padding: 20px; }
        
        #login-page, #main-app, .admin-box { background: var(--card-bg); padding: 30px; border-radius: 25px; border: 1px solid var(--border); margin-top: 50px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: #1e293b; color: white; margin-bottom: 20px; text-align: center; font-size: 16px; outline: none; }
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-main:active { transform: scale(0.98); }

        .match-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 20px; padding: 25px 15px; margin-top: 20px; }
        .prediction-container { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 20px; gap: 10px; }
        .predict-box { flex: 1; display: flex; flex-direction: column; align-items: center; }
        .team-logo { width: 60px; height: 60px; object-fit: contain; margin-bottom: 10px; }
        
        .opt-btn { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; padding: 10px 5px; border-radius: 12px; cursor: pointer; font-size: 13px; }
        .opt-btn.selected { background: var(--primary); border-color: white; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        .pts-text { font-size: 12px; color: var(--secondary); margin-top: 6px; font-weight: bold; }
        
        .leaderboard-section { margin-top: 30px; background: rgba(255,255,255,0.02); border-radius: 15px; padding: 15px; }
        .rank-row { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .rank-row:last-child { border-bottom: none; }
        
        .admin-box { border: 2px dashed var(--secondary); margin-top: 30px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-page">
        <h2 style="color: var(--secondary)">گروپی برایان</h2>
        <input type="text" id="userNameInput" placeholder="ناوەکەت بنووسە...">
        <button class="btn-main" onclick="loginUser()">چوونە ژوورەوە</button>
    </div>

    <div id="main-app" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div style="text-align: right;">
                <span id="welcomeText" style="font-weight: bold;"></span><br>
                <button onclick="logoutUser()" style="color: var(--danger); background:none; border:none; cursor:pointer; font-size: 12px;">دەرچوون</button>
            </div>
            <div style="background: rgba(245, 158, 11, 0.1); padding: 5px 15px; border-radius: 10px; border: 1px solid var(--secondary);">
                <span style="font-size: 11px; color: #94a3b8;">خاڵەکانت:</span><br>
                <strong id="userPoints" style="color: var(--secondary); font-size: 18px;">0</strong>
            </div>
        </div>
        
        <div class="match-card" id="m1">
            <p style="font-size: 13px; color: #94a3b8;">خولی ئیتاڵیا - سان سیرۆ</p>
            <div class="prediction-container">
                <div class="predict-box">
                    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/c/ce/Inter_Milan_2021.svg/1024px-Inter_Milan_2021.svg.png" class="team-logo">
                    <button class="opt-btn" id="m1-btn1" onclick="makeChoice('m1', 1, 2)">ئینتەر</button>
                    <span class="pts-text">2 خاڵ</span>
                </div>
                <div class="predict-box" style="justify-content: flex-end;">
                    <div style="font-weight: 900; color: var(--border); font-size: 20px; margin-bottom: 15px;">VS</div>
                    <button class="opt-btn" id="m1-btn2" onclick="makeChoice('m1', 2, 3)">یەکسان</button>
                    <span class="pts-text">3 خاڵ</span>
                </div>
                <div class="predict-box">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Logo_of_AC_Milan.svg/1024px-Logo_of_AC_Milan.svg.png" class="team-logo">
                    <button class="opt-btn" id="m1-btn3" onclick="makeChoice('m1', 3, 4)">میلان</button>
                    <span class="pts-text">4 خاڵ</span>
                </div>
            </div>
            <p id="lock-msg" style="display:none; font-size: 11px; color: var(--secondary); margin-top: 15px;">🔒 پێشبینییەکەت قفڵ کرا</p>
        </div>

        <div id="admin-panel" class="admin-box">
            <h3 style="color: var(--secondary); margin-top: 0;">کۆنترۆڵی Hedi</h3>
            <p style="font-size: 12px;">ئەنجامی ڕاستەقینە هەڵبژێرە بۆ دابەشکردنی خاڵ:</p>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
                <button class="btn-main" style="background: var(--success); font-size: 12px;" onclick="finishMatch('m1', 1, 2)">ئینتەر بردی</button>
                <button class="btn-main" style="background: #64748b; font-size: 12px;" onclick="finishMatch('m1', 2, 3)">یەکسان بوون</button>
                <button class="btn-main" style="background: var(--danger); font-size: 12px;" onclick="finishMatch('m1', 3, 4)">میلان بردی</button>
            </div>
        </div>

        <div class="leaderboard-section">
            <h4 style="color: var(--secondary); margin-bottom: 15px;">🏆 ڕیزبەندی گشتی</h4>
            <div id="leaderboardList"></div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBCXp7vjnb1naq1GpiyN29Br3SH_yNGkkQ",
        authDomain: "brayan-2a1ef.firebaseapp.com",
        databaseURL: "https://brayan-2a1ef-default-rtdb.firebaseio.com",
        projectId: "brayan-2a1ef",
        storageBucket: "brayan-2a1ef.firebasestorage.app",
        messagingSenderId: "655783456427",
        appId: "1:655783456427:web:1535d3dfd9b53515c391ee"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentUser = localStorage.getItem('groupBryanUser');

    function loginUser() {
        const name = document.getElementById('userNameInput').value.trim();
        if (name.length < 2) return alert("ناوەکەت بنووسە");
        db.ref('users/' + name).once('value').then((snap) => {
            if (!snap.exists()) db.ref('users/' + name).set({ points: 0, predictions: {} });
            localStorage.setItem('groupBryanUser', name);
            currentUser = name;
            startApp();
        });
    }

    function startApp() {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('welcomeText').innerText = "سڵاو، " + currentUser;
        
        if (currentUser === "Hedi") document.getElementById('admin-panel').style.display = 'block';

        db.ref('users/' + currentUser).on('value', (snap) => {
            const data = snap.val();
            if (data) {
                document.getElementById('userPoints').innerText = data.points || 0;
                if (data.predictions) highlight(data.predictions);
            }
        });
        loadLeaderboard();
    }

    function makeChoice(matchId, choiceId, points) {
        db.ref('users/' + currentUser + '/predictions/' + matchId).once('value').then((snap) => {
            if (snap.exists()) return alert("ناگۆڕدرێت!");
            if(confirm("پێشبینییەکەت قفڵ دەکەیت؟")) {
                db.ref('users/' + currentUser + '/predictions/' + matchId).set({ choice: choiceId, potentialPoints: points });
            }
        });
    }

    function highlight(preds) {
        Object.keys(preds).forEach(mId => {
            const choiceData = preds[mId];
            const choiceId = typeof choiceData === 'object' ? choiceData.choice : choiceData;
            document.querySelectorAll(`#${mId} .opt-btn`).forEach(btn => {
                btn.disabled = true;
                if (btn.id === `${mId}-btn${choiceId}`) btn.classList.add('selected');
                else {
                    btn.style.opacity = "0.3";
                    btn.parentElement.querySelector('.team-logo')?.style.setProperty('filter', 'grayscale(1)');
                }
            });
            document.getElementById('lock-msg').style.display = 'block';
        });
    }

    function loadLeaderboard() {
        // ئەم بەشە نوێکراوەتەوە بۆ هێنانی هەموو یوزەرەکان
        db.ref('users').on('value', (snap) => {
            let users = [];
            snap.forEach(u => {
                users.push({ 
                    name: u.key, 
                    points: u.val().points || 0 
                });
            });
            // ڕیزکردن بەپێی خاڵ
            users.sort((a, b) => b.points - a.points);
            
            const listDiv = document.getElementById('leaderboardList');
            if (users.length === 0) {
                listDiv.innerHTML = "<p style='font-size:12px; color:#94a3b8;'>تائێستا کەس لۆگینی نەکردووە</p>";
            } else {
                listDiv.innerHTML = users.map((u, i) => `
                    <div class="rank-row">
                        <span>${i+1}. ${u.name}</span>
                        <span style="color:var(--secondary)">${u.points} خاڵ</span>
                    </div>
                `).join('');
            }
        });
    }

    function finishMatch(matchId, finalResult, pointsToGive) {
        if (!confirm("خاڵەکان دابەش بکرێن؟")) return;
        db.ref('users').once('value').then((snapshot) => {
            snapshot.forEach((child) => {
                const userData = child.val();
                if (userData.predictions && userData.predictions[matchId]) {
                    const choiceId = typeof userData.predictions[matchId] === 'object' ? userData.predictions[matchId].choice : userData.predictions[matchId];
                    if (choiceId == finalResult) {
                        db.ref('users/' + child.key + '/points').set((userData.points || 0) + pointsToGive);
                    }
                }
            });
            alert("خاڵەکان بۆ براوەکان هەژمار کران!");
        });
    }

    function logoutUser() { localStorage.removeItem('groupBryanUser'); location.reload(); }
    if (currentUser) startApp();
</script>
</body>
</html>
