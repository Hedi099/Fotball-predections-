<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گروپی برایان - وەشانی نوێ بە لۆگۆوە</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #3b82f6; --secondary: #f59e0b; --bg: #0f172a; --card-bg: rgba(30, 41, 59, 0.95); --border: rgba(255, 255, 255, 0.1); --danger: #ef4444; --success: #22c55e; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0f172a; color: white; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; padding: 20px; }
        #login-page, #main-app, .admin-box { background: var(--card-bg); padding: 30px; border-radius: 25px; border: 1px solid var(--border); margin-top: 20px; text-align: center; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: #1e293b; color: white; margin-bottom: 20px; text-align: center; }
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .rank-toggle-btn { background: var(--secondary); color: #000; font-weight: bold; padding: 12px; border-radius: 12px; border: none; width: 100%; margin: 20px 0; cursor: pointer; }
        .match-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-top: 20px; position: relative; }
        .prediction-container { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 15px; gap: 5px; }
        .predict-box { flex: 1; display: flex; flex-direction: column; align-items: center; }
        .team-logo { width: 45px; height: 45px; margin-bottom: 8px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.2)); object-fit: contain; }
        .opt-btn { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; padding: 10px 2px; border-radius: 10px; cursor: pointer; font-size: 11px; margin-bottom: 5px; transition: 0.3s; }
        .opt-btn.selected { background: var(--primary); border-color: white; box-shadow: 0 0 10px var(--primary); }
        .pts-text { font-size: 11px; color: var(--secondary); margin-top: 5px; font-weight: bold; }
        .deadline-text { font-size: 10px; color: #94a3b8; display: block; margin-top: 10px; }
        .view-preds-btn { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--border); padding: 8px; border-radius: 10px; font-size: 11px; margin-top: 15px; cursor: pointer; width: 100%; display: none; }
        #leaderboard-overlay, #preds-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 1000; padding: 20px; overflow-y: auto; }
        .close-btn { background: var(--danger); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; margin-bottom: 20px; }
        .rank-row { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); margin-bottom: 5px; border-radius: 10px; }
        .admin-section { border-top: 1px solid rgba(255,255,255,0.1); padding: 15px 0; margin-top: 10px; text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-page">
        <h2 style="color: var(--secondary)">گروپی برایان</h2>
        <input type="text" id="userNameInput" placeholder="ناوەکەت بنووسە...">
        <button class="btn-main" onclick="loginUser()">چوونە ژوورەوە</button>
    </div>

    <div id="main-app" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="text-align: right;">
                <span id="welcomeText" style="font-weight: bold;"></span><br>
                <button onclick="logoutUser()" style="color: var(--danger); background:none; border:none; cursor:pointer; font-size: 11px;">دەرچوون</button>
            </div>
            <div style="background: rgba(245, 158, 11, 0.1); padding: 5px 15px; border-radius: 10px; border: 1px solid var(--secondary);">
                <span id="userPoints" style="color: var(--secondary); font-size: 18px; font-weight: bold;">0</span>
                <span style="font-size: 10px; color: #94a3b8;">خاڵەکانت</span>
            </div>
        </div>

        <button class="rank-toggle-btn" onclick="openLeaderboard()">🏆 ڕیزبەندی گشتی</button>

        <div id="matches-list"></div>

        <div id="admin-panel" class="admin-box" style="display:none; border: 1px dashed var(--secondary);">
            <h4 style="color:var(--secondary); margin-top:0;">بەشی ئەدمین (Hedi)</h4>
            <div id="admin-controls"></div>
            <button class="btn-main" style="background:var(--danger); margin-top:20px; font-size:12px;" onclick="resetWeekly()">🔄 سفرکردنەوەی پێشبینییەکان</button>
        </div>
    </div>

    <div id="leaderboard-overlay">
        <button class="close-btn" onclick="document.getElementById('leaderboard-overlay').style.display='none'">داخستن ✖</button>
        <div id="leaderboard-list"></div>
    </div>

    <div id="preds-overlay">
        <button class="close-btn" onclick="document.getElementById('preds-overlay').style.display='none'">گەڕانەوە ↩</button>
        <div id="preds-content"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBCXp7vjnb1naq1GpiyN29Br3SH_yNGkkQ",
        authDomain: "brayan-2a1ef.firebaseapp.com",
        databaseURL: "https://brayan-2a1ef-default-rtdb.firebaseio.com",
        projectId: "brayan-2a1ef",
        storageBucket: "brayan-2a1ef.firebasestorage.app",
        messagingSenderId: "655783456427",
        appId: "1:655783456427:web:1535d3dfd9b53515c391ee"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentUser = localStorage.getItem('groupBryanUser');

    // لیستی ١٣ یارییەکە لەگەڵ کۆدی لۆگۆکان (بەکارهێنانی ID یانەکانی فەرمی)
    const matches = [
        { id: "m1", stadium: "ئیسپانیۆل", t1: "ئیسپانیۆل", t2: "ئۆڤیدۆ", p1: 2, pX: 3, p2: 4, time: "2026-03-09T23:00:00", l1: "85", l2: "191" },
        { id: "m2", stadium: "گەلەتەسەرای", t1: "گەلەتەسەرای", t2: "لیڤەرپوول", p1: 5, pX: 3, p2: 2, time: "2026-03-10T20:45:00", l1: "603", l2: "64" },
        { id: "m3", stadium: "ئەتلەنتا", t1: "ئەتلەنتا", t2: "بایرن", p1: 4, pX: 3, p2: 2, time: "2026-03-10T23:00:00", l1: "102", l2: "157" },
        { id: "m4", stadium: "ئەتلەتیکۆ مەدرید", t1: "ئەتلەتیکۆ", t2: "تۆتنهام", p1: 2, pX: 3, p2: 4, time: "2026-03-10T23:00:00", l1: "78", l2: "73" },
        { id: "m5", stadium: "نیوکاسڵ", t1: "نیوکاسڵ", t2: "بارسا", p1: 4, pX: 3, p2: 2, time: "2026-03-10T23:00:00", l1: "67", l2: "81" },
        { id: "m6", stadium: "لیڤەرکوزن", t1: "لیڤەرکوزن", t2: "ئەرسناڵ", p1: 3, pX: 4, p2: 2, time: "2026-03-11T20:45:00", l1: "168", l2: "57" },
        { id: "m7", stadium: "بۆدۆگلیمت", t1: "بۆدۆگلیمت", t2: "لیشبۆنە", p1: 5, pX: 4, p2: 2, time: "2026-03-11T23:00:00", l1: "1144", l2: "498" },
        { id: "m8", stadium: "پاریس", t1: "پاریس", t2: "چێڵسی", p1: 2, pX: 3, p2: 4, time: "2026-03-11T23:00:00", l1: "524", l2: "61" },
        { id: "m9", stadium: "ڕیاڵ مەدرید", t1: "ڕیاڵ مەدرید", t2: "مان سیتی", p1: 3, pX: 4, p2: 2, time: "2026-03-11T23:00:00", l1: "86", l2: "65" },
        { id: "m10", stadium: "ڕۆما", t1: "بۆلۆگنا", t2: "ڕۆما", p1: 4, pX: 3, p2: 2, time: "2026-03-12T20:45:00", l1: "103", l2: "100" },
        { id: "m11", stadium: "لیل", t1: "لیل", t2: "ئەستۆن ڤێلا", p1: 3, pX: 2, p2: 4, time: "2026-03-12T20:45:00", l1: "527", l2: "58" },
        { id: "m12", stadium: "شتوتگارت", t1: "شتوتگارت", t2: "پۆرتۆ", p1: 2, pX: 3, p2: 4, time: "2026-03-12T20:45:00", l1: "188", l2: "503" },
        { id: "m13", stadium: "سێلتاڤیگۆ", t1: "سێلتاڤیگۆ", t2: "لیۆن", p1: 4, pX: 2, p2: 3, time: "2026-03-12T20:45:00", l1: "80", l2: "523" }
    ];

    function getLogo(id) { return `https://www.thesportsdb.com/images/media/team/badge/small/${id}.png`; }

    function renderMatches() {
        let html = ''; let adminHtml = '';
        matches.forEach(m => {
            html += `<div class="match-card" id="${m.id}" data-deadline="${m.time}" data-teams="${m.t1},یەکسان,${m.t2}">
                <p style="font-size: 11px; margin:0; color: var(--secondary);">یاریگای ${m.stadium}</p>
                <div class="prediction-container">
                    <div class="predict-box">
                        <img src="${getLogo(m.l1)}" class="team-logo" onerror="this.src='https://via.placeholder.com/45?text=T1'">
                        <button class="opt-btn" id="${m.id}-btn1" onclick="makeChoice('${m.id}', 1, ${m.p1})">${m.t1}</button>
                        <span class="pts-text">${m.p1}خ</span>
                    </div>
                    <div class="predict-box">
                        <div style="height:45px; display:flex; align-items:center; font-weight:bold; color:#475569;">VS</div>
                        <button class="opt-btn" id="${m.id}-btn2" onclick="makeChoice('${m.id}', 2, ${m.pX})">یەکسان</button>
                        <span class="pts-text">${m.pX}خ</span>
                    </div>
                    <div class="predict-box">
                        <img src="${getLogo(m.l2)}" class="team-logo" onerror="this.src='https://via.placeholder.com/45?text=T2'">
                        <button class="opt-btn" id="${m.id}-btn3" onclick="makeChoice('${m.id}', 3, ${m.p2})">${m.t2}</button>
                        <span class="pts-text">${m.p2}خ</span>
                    </div>
                </div>
                <span class="deadline-text" id="timer-${m.id}"></span>
                <button class="view-preds-btn" id="view-${m.id}" onclick="showAllPredictions('${m.id}')">👁 بینینی پێشبینی هەمووان</button>
            </div>`;
            adminHtml += `<div class="admin-section"><span>${m.t1} - ${m.t2}:</span><br>
                <button class="opt-btn" style="background:var(--success)" onclick="finishMatch('${m.id}', 1, ${m.p1})">1</button>
                <button class="opt-btn" style="background:#444" onclick="finishMatch('${m.id}', 2, ${m.pX})">X</button>
                <button class="opt-btn" style="background:var(--danger)" onclick="finishMatch('${m.id}', 3, ${m.p2})">2</button>
            </div>`;
        });
        document.getElementById('matches-list').innerHTML = html;
        document.getElementById('admin-controls').innerHTML = adminHtml;
    }

    function loginUser() {
        const name = document.getElementById('userNameInput').value.trim();
        if (name.length < 2) return alert("ناو بنووسە");
        db.ref('users/' + name).once('value').then((snap) => {
            if (!snap.exists()) db.ref('users/' + name).set({ total: 0, weekly: 0, predictions: {} });
            localStorage.setItem('groupBryanUser', name);
            currentUser = name;
            startApp();
        });
    }

    function startApp() {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('welcomeText').innerText = "سڵاو " + currentUser;
        if (currentUser === "Hedi") document.getElementById('admin-panel').style.display = 'block';
        renderMatches();
        db.ref('users/' + currentUser).on('value', snap => {
            if (snap.exists() && snap.val().predictions) highlight(snap.val().predictions);
            document.getElementById('userPoints').innerText = snap.val()?.total || 0;
        });
        checkDeadlines();
    }

    function checkDeadlines() {
        setInterval(() => {
            matches.forEach(m => {
                const diff = new Date(m.time).getTime() - new Date().getTime();
                const timer = document.getElementById('timer-' + m.id);
                const viewBtn = document.getElementById('view-' + m.id);
                if (diff <= 0) {
                    timer.innerText = "🔒 داخراوە";
                    document.getElementById(m.id).querySelectorAll('.opt-btn').forEach(b => { if(!b.classList.contains('selected')) b.disabled = true; });
                    if(viewBtn) viewBtn.style.display = 'block';
                } else {
                    const h = Math.floor(diff / 3600000);
                    const m_ = Math.floor((diff % 3600000) / 60000);
                    timer.innerText = `⏰ دێدلاین: ${h}ک : ${m_}خ`;
                }
            });
        }, 1000);
    }

    function makeChoice(mId, cId, pts) {
        if(confirm("پێشبینییەکەت قفڵ دەکەیت؟")) db.ref('users/' + currentUser + '/predictions/' + mId).set({ choice: cId, pts: pts });
    }

    function highlight(preds) {
        Object.keys(preds).forEach(mId => {
            const btn = document.getElementById(`${mId}-btn${preds[mId].choice}`);
            if(btn) {
                document.getElementById(mId).querySelectorAll('.opt-btn').forEach(b => {
                    b.disabled = true;
                    b.style.opacity = (b === btn) ? "1" : "0.2";
                    if(b === btn) b.classList.add('selected');
                });
            }
        });
    }

    function finishMatch(mId, res, pts) {
        if(!confirm("خاڵ دابەش بکرێت؟")) return;
        db.ref('users').once('value').then(snap => {
            snap.forEach(u => {
                const data = u.val();
                if(data.predictions && data.predictions[mId] && data.predictions[mId].choice == res) {
                    db.ref('users/'+u.key).update({ total: (data.total||0)+pts });
                }
            });
            alert("خاڵەکان دابەش کران!");
        });
    }

    function showAllPredictions(mId) {
        const teamNames = document.getElementById(mId).dataset.teams.split(',');
        db.ref('users').once('value').then(snap => {
            let html = `<h3 style="text-align:center;color:var(--secondary)">پێشبینی برادەران</h3>`;
            snap.forEach(u => {
                const p = u.val().predictions?.[mId];
                html += `<div class="rank-row"><span>${u.key}</span><b>${p ? teamNames[p.choice-1] : '---'}</b></div>`;
            });
            document.getElementById('preds-content').innerHTML = html;
            document.getElementById('preds-overlay').style.display = 'block';
        });
    }

    function openLeaderboard() {
        db.ref('users').once('value', snap => {
            let arr = [];
            snap.forEach(u => arr.push({ name: u.key, pts: u.val().total || 0 }));
            arr.sort((a,b) => b.pts - a.pts);
            document.getElementById('leaderboard-list').innerHTML = arr.map((u,i) => `<div class="rank-row"><span>${i+1}. ${u.name}</span><b>${u.pts} خاڵ</b></div>`).join('');
            document.getElementById('leaderboard-overlay').style.display = 'block';
        });
    }

    function resetWeekly() {
        if(confirm("سفر بکرێتەوە؟")) {
            db.ref('users').once('value').then(snap => snap.forEach(u => db.ref('users/' + u.key).update({ predictions: {} })));
        }
    }

    function logoutUser() { localStorage.removeItem('groupBryanUser'); location.reload(); }
    if (currentUser) startApp();
</script>
</body>
</html>
