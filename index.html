<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brothers Group - Auto</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { 
            --primary: #6366f1; --secondary: #fbbf24; --accent: #ef4444;
            --glass-bg: rgba(0, 0, 0, 0.65); --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; min-height: 100vh; color: var(--text-color); display: flex; justify-content: center; background-color: #000; overflow-x: hidden; }
        .bg-fixed { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: url('https://r2.erweima.ai/i/eAtF7Ua1QfWf6-xM3A8L1A.jpg'); background-size: cover; background-position: center; filter: brightness(0.5) blur(2px); z-index: -1; }
        .container { width: 100%; max-width: 480px; padding: 20px; z-index: 1; }
        .glass { background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }
        .logo-text { font-size: 32px; font-weight: 900; text-align: center; color: var(--secondary); text-shadow: 0 4px 10px rgba(0,0,0,0.5); margin-bottom: 20px; }
        .match-card { margin-bottom: 20px; overflow: hidden; transition: 0.3s; }
        .match-header { padding: 10px 15px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--glass-border); font-size: 11px; background: rgba(255,255,255,0.05); }
        .match-body { padding: 20px 15px; }
        .opt-btn { flex: 1; padding: 12px 5px; border-radius: 15px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; }
        .opt-btn.selected { background: var(--secondary); color: #000; font-weight: bold; border-color: var(--secondary); }
        .btn-main { width: 100%; padding: 15px; border-radius: 15px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; }
        .nav-btn { padding: 12px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 11px; margin-bottom: 5px; }
        input { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.5); color: white; margin-bottom: 15px; text-align: center; }
        .rank-row { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .status-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: var(--accent); }
    </style>
</head>
<body>

<div class="bg-fixed"></div>

<div class="container">
    <div id="login-page" style="margin-top: 80px;" class="glass">
        <div style="padding: 30px;">
            <div class="logo-text">Brothers Group</div>
            <input type="text" id="userNameInput" placeholder="ناوەکەت بنووسە">
            <button class="btn-main" onclick="loginUser()">چوونە ژوورەوە</button>
        </div>
    </div>

    <div id="selection-page" style="display: none;">
        <div class="logo-text">Brothers Group</div>
        <div style="display: grid; grid-template-columns: 1fr; gap: 15px;">
            <div class="glass" style="padding:25px; text-align:center; cursor:pointer;" onclick="showSection('preds')">
                <span style="font-size: 40px;">⚽</span>
                <div style="font-size: 20px; font-weight: bold; color: var(--secondary); margin-top:10px;">پێشبینی یارییەکان</div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button class="nav-btn" style="background:var(--secondary)" onclick="openRank()">📊 ڕیزبەندی</button>
                <button class="nav-btn" style="background:#4b5563; color:white;" onclick="logout()">🚪 دەرچوون</button>
                
                <button id="sync-api-btn" class="nav-btn" style="background:#10b981; color:white; display:none; grid-column: span 2;" onclick="syncFixtures()">🔄 نوێکردنەوەی یارییەکان (API)</button>
                <button id="check-results-btn" class="nav-btn" style="background:#3b82f6; color:white; display:none; grid-column: span 2;" onclick="autoCheckResults()">✅ پشکنینی ئەنجامەکان و خاڵ</button>
            </div>
        </div>
    </div>

    <div id="preds-section" style="display: none;">
        <button class="nav-btn" style="background:rgba(0,0,0,0.6); color:white; margin-bottom:15px; border:1px solid var(--glass-border);" onclick="showSection('home')">⬅️ گەڕانەوە</button>
        <div id="matches-list"></div>
    </div>
</div>

<div id="leaderboard-view" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; padding: 20px; align-items: center; justify-content: center;">
    <div class="glass" style="width: 100%; max-width: 400px; padding: 25px;">
        <h2 style="text-align:center;color:var(--secondary)">🏆 ڕیزبەندی گشتی</h2>
        <div id="rank-list"></div>
        <button class="btn-main" style="margin-top:20px" onclick="document.getElementById('leaderboard-view').style.display='none'">داخستن</button>
    </div>
</div>

<script>
    // کۆنفیک و کلیلەکان
    const firebaseConfig = { apiKey: "AIzaSyBCXp7vjnb1naq1GpiyN29Br3SH_yNGkkQ", authDomain: "brayan-2a1ef.firebaseapp.com", databaseURL: "https://brayan-2a1ef-default-rtdb.firebaseio.com", projectId: "brayan-2a1ef", storageBucket: "brayan-2a1ef.firebasestorage.app", messagingSenderId: "655783456427", appId: "1:655783456427:web:1535d3dfd9b53515c391ee" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    const API_KEY = "002cfeace3b4455da72b33c9a25b4733";
    const LEAGUE_ID = 39; // Premier League
    let currentUser = localStorage.getItem('groupBryanUser');

    function loginUser() { 
        const n = document.getElementById('userNameInput').value.trim(); 
        if(!n) return; 
        localStorage.setItem('groupBryanUser', n); 
        location.reload(); 
    }

    if (currentUser) {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('selection-page').style.display = 'block';
        if(currentUser === 'Hedi') {
            document.getElementById('sync-api-btn').style.display = 'block';
            document.getElementById('check-results-btn').style.display = 'block';
        }
    }

    function showSection(sec) {
        document.getElementById('selection-page').style.display = sec === 'home' ? 'block' : 'none';
        document.getElementById('preds-section').style.display = sec === 'preds' ? 'block' : 'none';
        if(sec === 'preds') loadMatches();
    }

    // --- بەشی API و فایەربەیس ---

    async function syncFixtures() {
        try {
            const response = await fetch(`https://v3.football.api-sports.io/fixtures?league=${LEAGUE_ID}&next=10`, {
                "headers": { "x-rapidapi-key": API_KEY, "x-rapidapi-host": "v3.football.api-sports.io" }
            });
            const data = await response.json();
            data.response.forEach(item => {
                db.ref('matches/' + item.fixture.id).update({
                    id: item.fixture.id,
                    t1: item.teams.home.name, t2: item.teams.away.name,
                    img1: item.teams.home.logo, img2: item.teams.away.logo,
                    deadline: item.fixture.date, status: item.fixture.status.short,
                    event: "Premier League"
                });
            });
            alert("یارییەکان نوێکرانەوە!");
        } catch (e) { alert("کێشەیەک لە API هەیە"); }
    }

    function loadMatches() {
        db.ref('matches').on('value', (s) => {
            const matches = s.val();
            db.ref('users/'+currentUser+'/predictions').on('value', (sp) => {
                const userPreds = sp.val() || {};
                let h = '';
                for (let id in matches) {
                    const m = matches[id];
                    const isLocked = new Date() >= new Date(m.deadline) || m.status === 'FT';
                    const myChoice = userPreds[id] ? userPreds[id].choice : null;

                    h += `<div class="match-card glass">
                        <div class="match-header">
                            <span>${m.event}</span>
                            ${m.status === 'FT' ? '<span class="status-badge" style="background:#22c55e">تەواو بووە</span>' : `<span>${new Date(m.deadline).toLocaleString('ku-IQ')}</span>`}
                        </div>
                        <div class="match-body">
                            <div style="display:flex; justify-content:space-around; align-items:center;">
                                <div style="text-align:center; width:30%"><img src="${m.img1}" width="45"><br><small>${m.t1}</small></div>
                                <div style="font-size:20px; font-weight:bold; color:var(--secondary)">${m.status==='FT'? m.finalScore.home + " - " + m.finalScore.away : 'VS'}</div>
                                <div style="text-align:center; width:30%"><img src="${m.img2}" width="45"><br><small>${m.t2}</small></div>
                            </div>
                            <div style="display:flex; gap:10px; margin-top:20px;">
                                <button class="opt-btn ${myChoice==1?'selected':''}" onclick="vote('${id}',1,'${m.deadline}')" ${isLocked?'disabled':''}>1</button>
                                <button class="opt-btn ${myChoice==2?'selected':''}" onclick="vote('${id}',2,'${m.deadline}')" ${isLocked?'disabled':''}>X</button>
                                <button class="opt-btn ${myChoice==3?'selected':''}" onclick="vote('${id}',3,'${m.deadline}')" ${isLocked?'disabled':''}>2</button>
                            </div>
                        </div>
                    </div>`;
                }
                document.getElementById('matches-list').innerHTML = h || '<p style="text-align:center">هیچ یارییەک نییە، ئەدمین دەبێت نوێی بکاتەوە.</p>';
            });
        });
    }

    function vote(mId, choice, dl) {
        if(new Date() >= new Date(dl)) return;
        db.ref('users/'+currentUser+'/predictions/'+mId).set({choice: choice});
    }

    async function autoCheckResults() {
        db.ref('matches').once('value', async (s) => {
            const matches = s.val();
            for (let id in matches) {
                if (matches[id].status !== 'FT') {
                    const res = await fetch(`https://v3.football.api-sports.io/fixtures?id=${id}`, {
                        "headers": { "x-rapidapi-key": API_KEY, "x-rapidapi-host": "v3.football.api-sports.io" }
                    });
                    const data = await res.json();
                    const f = data.response;
                    if (f && f.fixture.status.short === 'FT') {
                        const winner = f.teams.home.winner ? 1 : (f.teams.away.winner ? 3 : 2);
                        await awardPoints(id, winner);
                        db.ref('matches/'+id).update({ status: 'FT', finalScore: {home: f.goals.home, away: f.goals.away} });
                    }
                }
            }
            alert("پشکنین تەواو بوو!");
        });
    }

    async function awardPoints(mId, win) {
        const usersS = await db.ref('users').once('value');
        usersS.forEach(u => {
            const d = u.val();
            if (d.predictions && d.predictions[mId] && d.predictions[mId].choice == win) {
                db.ref('users/'+u.key).update({ total: (d.total || 0) + 3 });
            }
        });
    }

    function openRank() {
        db.ref('users').once('value', s => {
            let r = [];
            s.forEach(u => r.push({ n: u.key, p: u.val().total || 0 }));
            r.sort((a,b) => b.p - a.p);
            document.getElementById('rank-list').innerHTML = r.map(i => `<div class="rank-row"><span>${i.n}</span><span style="color:var(--secondary)">${i.p} خاڵ</span></div>`).join('');
            document.getElementById('leaderboard-view').style.display = 'flex';
        });
    }

    function logout() { localStorage.removeItem('groupBryanUser'); location.reload(); }
</script>
</body>
    </html>
