<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئەپی پێشبینی - هاوار</title>
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #f59e0b;
            --danger: #ef4444;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: radial-gradient(circle at top right, #1e293b, #0f172a); color: white; margin: 0; min-height: 100vh; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; padding: 20px; }

        /* لۆگین */
        #login-page { margin-top: 80px; text-align: center; background: var(--card-bg); padding: 40px 20px; border-radius: 30px; border: 1px solid var(--border); }
        input { width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); padding: 15px; border-radius: 12px; color: white; margin-bottom: 15px; outline: none; text-align: center; }
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* ئەپ */
        #main-app { display: none; width: 100%; }
        .match-card { background: var(--card-bg); padding: 25px; border-radius: 25px; border: 1px solid var(--border); position: relative; overflow: hidden; }

        /* کاتژمێر */
        .timer-box { background: rgba(239, 68, 68, 0.1); color: var(--danger); padding: 10px; border-radius: 12px; text-align: center; margin-bottom: 15px; font-weight: bold; font-size: 14px; border: 1px solid rgba(239, 68, 68, 0.2); }

        .odds-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .odd-box { background: rgba(255, 255, 255, 0.05); padding: 15px 5px; border-radius: 15px; text-align: center; border: 1px solid var(--border); cursor: pointer; transition: 0.3s; }
        .odd-box span { display: block; font-size: 11px; color: #94a3b8; }
        .odd-box strong { color: var(--secondary); }

        /* ستایڵی هەڵبژاردن و قوفڵ کردن */
        .odd-box.selected { background: var(--primary); border-color: white; transform: scale(1.03); }
        .odd-box.disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

        .status-msg { text-align: center; margin-top: 15px; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-page">
        <h2>بەخێرهاتی ⚽</h2>
        <input type="text" id="userNameInput" placeholder="ناوەکەت بنووسە">
        <button class="btn-main" onclick="saveUser()">چوونە ژوورەوە</button>
    </div>

    <div id="main-app">
        <header style="display: flex; justify-content: space-between; margin-bottom: 25px;">
            <span id="welcomeText"></span>
            <button onclick="logout()" style="background:none; border:none; color:var(--danger); cursor:pointer;">دەرچوون</button>
        </header>

        <div class="match-card">
            <div id="timer" class="timer-box">ماوە بۆ داخستن: --:--:--</div>

            <div style="text-align:center; margin-bottom:20px;">
                <small style="color:#94a3b8;">دێربی میلانۆ 🇮🇹</small><br>
                <strong style="font-size:20px;">ئینتەر 🆚 میلان</strong>
            </div>

            <div class="odds-container" id="odds-wrapper">
                <div class="odd-box" id="opt-1" onclick="makeChoice(1, 'بردنەوەی ئینتەر')"><span>ئینتەر</span><strong>2خ</strong></div>
                <div class="odd-box" id="opt-2" onclick="makeChoice(2, 'یەکسانبوون')"><span>یەکسان</span><strong>3خ</strong></div>
                <div class="odd-box" id="opt-3" onclick="makeChoice(3, 'میلان')"><span>میلان</span><strong>4خ</strong></div>
            </div>

            <div id="statusMsg" class="status-msg"></div>
        </div>
    </div>
</div>

<script>
    // کاتی دەستپێکی یاری (ساڵ، مانگ-١، ڕۆژ، کاتژمێر، خولەک)
    // تێبینی: مانگ لە سفرەوە دەست پێ دەکات، واتە ئازار (٣) دەبێتە ٢.
    const matchTime = new Date(2026, 2, 8, 21, 0, 0).getTime(); 
    let isLocked = false;

    window.onload = function() {
        const name = localStorage.getItem('app_user_name');
        if (name) {
            showApp(name);
            updateTimer(); 
            setInterval(updateTimer, 1000);
        }
    };

    function updateTimer() {
        const now = new Date().getTime();
        const distance = matchTime - now;

        if (distance < 0) {
            isLocked = true;
            document.getElementById('timer').innerText = "⚠️ پێشبینی داخرا - یاری دەستی پێکرد";
            document.getElementById('timer').style.color = "#94a3b8";
            document.getElementById('timer').style.background = "rgba(255,255,255,0.05)";
            lockOdds();
            return;
        }

        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById('timer').innerText = `کات ماوە: ${hours}:${minutes}:${seconds}`;
    }

    function lockOdds() {
        document.querySelectorAll('.odd-box').forEach(el => el.classList.add('disabled'));
    }

    function makeChoice(id, text) {
        if (isLocked) {
            alert("ببورە، کاتی پێشبینی کۆتایی هاتووە!");
            return;
        }

        document.querySelectorAll('.odd-box').forEach(el => el.classList.remove('selected'));
        document.getElementById('opt-' + id).classList.add('selected');
        
        localStorage.setItem('milan_choice', id);
        document.getElementById('statusMsg').innerText = "✓ پێشبینییەکەت تۆمارکرا: " + text;
        document.getElementById('statusMsg').style.color = "#10b981";
    }

    function saveUser() {
        const name = document.getElementById('userNameInput').value;
        if (!name) return;
        localStorage.setItem('app_user_name', name);
        location.reload();
    }

    function showApp(name) {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('welcomeText').innerText = "سڵاو، " + name;
        
        const saved = localStorage.getItem('milan_choice');
        if (saved) {
            document.getElementById('opt-' + saved).classList.add('selected');
            document.getElementById('statusMsg').innerText = "تۆ پێشتر پێشبینیت کردووە";
        }
    }

    function logout() { localStorage.clear(); location.reload(); }
</script>

</body>
</html>
