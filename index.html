<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گروپی برایان 2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --p: #2563eb; --s: #f59e0b; --bg: #f8fafc; --card: #ffffff; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg); color: #1e293b; margin: 0; padding: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; padding: 15px; }

        /* بەشی فەرموودە */
        .hadith-box {
            background: white; border-right: 4px solid var(--s); padding: 15px;
            border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .hadith-h { color: var(--s); font-size: 13px; font-weight: bold; display: block; margin-bottom: 5px; }
        .hadith-t { font-size: 14px; line-height: 1.6; color: #475569; }

        /* پڕۆفایلی خاڵەکان */
        .stats-card {
            background: var(--p); color: white; padding: 20px; border-radius: 20px;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
        }
        .stat-v { font-size: 22px; font-weight: bold; color: var(--s); }

        /* کارتەکانی یاری */
        .m-card {
            background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }
        .m-header { display: flex; justify-content: space-between; align-items: center; }
        .team { flex: 1; text-align: center; }
        .t-logo { width: 50px; height: 50px; object-fit: contain; margin-bottom: 8px; }
        .t-name { font-size: 12px; font-weight: bold; display: block; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 15px; }
        .o-btn {
            background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 10px;
            padding: 10px 2px; cursor: pointer; font-size: 12px; font-weight: bold;
        }
        .o-btn.selected { background: var(--p); color: white; }
        .pts { font-size: 9px; color: var(--s); display: block; }

        #login-page { text-align: center; padding-top: 100px; }
        .inp { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 10px; text-align: center; }
        .btn-lg { width: 100%; background: var(--p); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }

        #overlay { display: none; position: fixed; inset: 0; background: white; z-index: 100; padding: 20px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-page">
        <h2 style="color: var(--p)">گروپی برایان 🏆</h2>
        <input type="text" id="userInput" class="inp" placeholder="ناوەکەت لێرە بنووسە...">
        <button class="btn-lg" onclick="login()">چوونە ژوورەوە</button>
    </div>

    <div id="main-app" style="display:none;">
        <div class="hadith-box">
            <span class="hadith-h">پێغەمبەرمان محمد ﷺ ئەفەرموێت :</span>
            <div class="hadith-t">«الدَّالُّ عَلَى الخَيْرِ كَفَاعِلِهِ» (ئەوەی ڕێنمایی کەسێک بکات بۆ کارێکی چاک، وەک ئەوە وایە خۆی کردبێتی)</div>
        </div>

        <div class="stats-card">
            <div><span id="uName" style="font-weight:bold;"></span><br><small onclick="logout()" style="cursor:pointer; opacity:0.8;">دەرچوون ↩</small></div>
            <div style="display:flex; gap:15px;">
                <div style="text-align:center;"><span id="uW" class="stat-v">0</span><br><small style="font-size:9px;">هەفتانە</small></div>
                <div style="text-align:center;"><span id="uT" class="stat-v">0</span><br><small style="font-size:9px;">گشتی</small></div>
            </div>
        </div>

        <button onclick="openRank()" style="width:100%; padding:12px; border:1px solid var(--p); background:none; color:var(--p); border-radius:12px; font-weight:bold; margin-bottom:20px; cursor:pointer;">📊 ڕیزبەندی خاڵەکان</button>
        
        <div id="m-list"></div>
    </div>
</div>

<div id="overlay">
    <button onclick="document.getElementById('overlay').style.display='none'" style="margin-bottom:20px;">داخستن ✖</button>
    <div id="rank-list"></div>
</div>

<script>
    // کۆنفیگی فایەربەیس
    const firebaseConfig = {
        apiKey: "AIzaSyBCXp7vjnb1naq1GpiyN29Br3SH_yNGkkQ",
        authDomain: "brayan-2a1ef.firebaseapp.com",
        databaseURL: "https://brayan-2a1ef-default-rtdb.firebaseio.com",
        projectId: "brayan-2a1ef",
        storageBucket: "brayan-2a1ef.firebasestorage.app",
        messagingSenderId: "655783456427",
        appId: "1:655783456427:web:1535d3dfd9b53515c391ee"
    };

    // جێگیرکردنی فایەربەیس بە شێوەی سەلامەت
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    let user = localStorage.getItem('brayanUser');

    // لیستی یارییەکان
    const matches = [
        { id: "m1", t1: "ئیسپانیۆل", t2: "ئۆڤیدۆ", p1: 2, pX: 3, p2: 4, time: "2026-03-09T23:00:00", img1: "https://upload.wikimedia.org/wikipedia/en/thumb/d/d6/RCD_Espanyol_logo.svg/100px-RCD_Espanyol_logo.svg.png", img2: "https://upload.wikimedia.org/wikipedia/en/thumb/4/45/Real_Oviedo_logo.svg/100px-Real_Oviedo_logo.svg.png" },
        { id: "m2", t1: "گەلەتەسەرای", t2: "لیڤەرپوول", p1: 5, pX: 3, p2: 2, time: "2026-03-10T20:45:00", img1: "https://upload.wikimedia.org/wikipedia/en/thumb/3/31/Galatasaray_Star_Logo.svg/100px-Galatasaray_Star_Logo.svg.png", img2: "https://upload.wikimedia.org/wikipedia/en/thumb/0/0c/Liverpool_FC.svg/100px-Liverpool_FC.svg.png" }
    ];

    function login() {
        const n = document.getElementById('userInput').value.trim();
        if(n.length < 2) return alert("ناو بنووسە");
        db.ref('users/' + n).once('value', s => {
            if(!s.exists()) db.ref('users/' + n).set({total:0, weekly:0});
            localStorage.setItem('brayanUser', n);
            location.reload();
        });
    }

    if(user) {
        document.getElementById('login-page').style.display='none';
        document.getElementById('main-app').style.display='block';
        document.getElementById('uName').innerText = user;
        renderMatches();
        
        db.ref('users/' + user).on('value', s => {
            const d = s.val();
            if(d) {
                document.getElementById('uT').innerText = d.total || 0;
                document.getElementById('uW').innerText = d.weekly || 0;
                if(d.predictions) highlight(d.predictions);
            }
        });
    }

    function renderMatches() {
        let html = '';
        matches.forEach(m => {
            html += `
            <div class="m-card" id="${m.id}">
                <div class="m-header">
                    <div class="team"><img src="${m.img1}" class="t-logo"><span class="t-name">${m.t1}</span></div>
                    <div style="color:#94a3b8; font-weight:bold;">VS</div>
                    <div class="team"><img src="${m.img2}" class="t-logo"><span class="t-name">${m.t2}</span></div>
                </div>
                <div class="btn-grid">
                    <button class="o-btn" id="${m.id}-1" onclick="vote('${m.id}',1,${m.p1})">1 <span class="pts">${m.p1}خاڵ</span></button>
                    <button class="o-btn" id="${m.id}-2" onclick="vote('${m.id}',2,${m.pX})">X <span class="pts">${m.pX}خاڵ</span></button>
                    <button class="o-btn" id="${m.id}-3" onclick="vote('${m.id}',3,${m.p2})">2 <span class="pts">${m.p2}خاڵ</span></button>
                </div>
            </div>`;
        });
        document.getElementById('m-list').innerHTML = html;
    }

    function vote(mId, c, p) {
        if(confirm("پێشبینییەکەت قفڵ دەکەیت؟")) {
            db.ref('users/'+user+'/predictions/'+mId).set({choice:c, pts:p});
        }
    }

    function highlight(preds) {
        Object.keys(preds).forEach(mId => {
            const choice = preds[mId].choice;
            const btn = document.getElementById(mId + '-' + choice);
            if(btn) {
                const card = document.getElementById(mId);
                card.querySelectorAll('.o-btn').forEach(b => {
                    b.disabled = true;
                    b.style.opacity = "0.3";
                });
                btn.classList.add('selected');
                btn.style.opacity = "1";
            }
        });
    }

    function openRank() {
        db.ref('users').once('value', s => {
            let a = [];
            s.forEach(u => a.push({name: u.key, points: u.val().total || 0}));
            a.sort((x, y) => y.points - x.points);
            document.getElementById('rank-list').innerHTML = a.map((u, i) => 
                `<div style="display:flex; justify-content:space-between; padding:15px; border-bottom:1px solid #eee;">
                    <span>${i+1}. ${u.name}</span><b>${u.points} خاڵ</b>
                </div>`
            ).join('');
            document.getElementById('overlay').style.display='block';
        });
    }

    function logout() { localStorage.removeItem('brayanUser'); location.reload(); }
</script>
</body>
</html>
