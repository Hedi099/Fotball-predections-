<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گروپی برایان - پێشبینی</title>
    <style>
        :root { --primary: #3b82f6; --secondary: #f59e0b; --bg: #0f172a; --card-bg: rgba(30, 41, 59, 0.95); --border: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: radial-gradient(circle at top right, #1e293b, #0f172a); color: white; margin: 0; min-height: 100vh; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; padding: 20px; padding-bottom: 120px; }
        
        /* لۆگین */
        #login-page { margin-top: 80px; text-align: center; background: var(--card-bg); padding: 40px 20px; border-radius: 30px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 100%; background: rgba(15, 23, 42, 0.7); border: 1px solid var(--border); padding: 15px; border-radius: 15px; color: white; margin-bottom: 15px; text-align: center; outline: none; }
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        
        /* ئەپ */
        #main-app { display: none; width: 100%; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
        
        .match-card { background: var(--card-bg); padding: 20px; border-radius: 30px; border: 1px solid var(--border); text-align: center; margin-bottom: 25px; position: relative; }
        .teams-area { display: flex; justify-content: space-around; align-items: center; margin: 15px 0; }
        .team img { width: 65px; height: 65px; object-fit: contain; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3)); }
        .team div { margin-top: 8px; font-weight: bold; font-size: 14px; }
        .vs { font-size: 18px; font-weight: 900; color: var(--secondary); background: rgba(245, 158, 11, 0.1); padding: 5px 10px; border-radius: 10px; }
        
        .prediction-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .opt-btn { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 15px; padding: 12px 2px; cursor: pointer; color: white; transition: 0.3s; }
        .opt-btn span { display: block; font-size: 10px; color: #94a3b8; margin-top: 4px; }
        .opt-btn strong { display: block; font-size: 13px; }
        
        .opt-btn.selected { background: var(--primary); border-color: white; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        .opt-btn.disabled { opacity: 0.4; cursor: not-allowed; }

        .nav-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 85%; max-width: 400px; background: rgba(30, 41, 59, 0.98); backdrop-filter: blur(15px); padding: 18px; border-radius: 25px; text-align: center; border: 1px solid var(--border); box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
        
        #leaderboard-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; width: 90%; max-width: 350px; padding: 30px; border-radius: 30px; border: 1px solid var(--border); }
        .rank-row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>

<div class="container">
    <div id="login-page">
        <h1 style="font-size: 26px; margin-bottom: 10px; color: var(--secondary);">گروپی برایان</h1>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 30px;">بەخێرهاتن بۆ پێشبینی یارییەکان</p>
        <input type="text" id="userNameInput" placeholder="ناوەکەت بنووسە">
        <button class="btn-main" onclick="saveUser()">چوونە ژوورەوە</button>
    </div>

    <div id="main-app">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <div id="welcomeText" style="font-weight: bold; font-size: 18px;"></div>
            <div id="totalPointsDisplay" style="color: var(--secondary); font-weight: bold; background: rgba(245, 158, 11, 0.1); padding: 5px 12px; border-radius: 10px;">خاڵ: 0</div>
        </header>

        <div class="match-card" id="match-1">
            <div class="teams-area">
                <div class="team"><img src="https://upload.wikimedia.org/wikipedia/en/thumb/c/ce/Inter_Milan_2021.svg/200px-Inter_Milan_2021.svg.png"><div>ئینتەر</div></div>
                <div class="vs">VS</div>
                <div class="team"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Logo_of_AC_Milan.svg/200px-Logo_of_AC_Milan.svg.png"><div>میلان</div></div>
            </div>
            <div class="prediction-options">
                <button class="opt-btn" id="m1-opt1" onclick="makeChoice(1, 1, 2)"><strong>١</strong><span>2 خ</span></button>
                <button class="opt-btn" id="m1-opt2" onclick="makeChoice(1, 2, 3)"><strong>X</strong><span>3 خ</span></button>
                <button class="opt-btn" id="m1-opt3" onclick="makeChoice(1, 3, 4)"><strong>٢</strong><span>4 خ</span></button>
            </div>
        </div>

        <div class="match-card" id="match-2">
            <div class="teams-area">
                <div class="team"><img src="https://upload.wikimedia.org/wikipedia/en/thumb/3/3b/Sevilla_FC_logo.svg/200px-Sevilla_FC_logo.svg.png"><div>سێڤییا</div></div>
                <div class="vs">VS</div>
                <div class="team"><img src="https://upload.wikimedia.org/wikipedia/en/thumb/1/1b/Rayo_Vallecano_logo.svg/200px-Rayo_Vallecano_logo.svg.png"><div>ڕایۆ</div></div>
            </div>
            <div class="prediction-options">
                <button class="opt-btn" id="m2-opt1" onclick="makeChoice(2, 1, 2)"><strong>١</strong><span>2 خ</span></button>
                <button class="opt-btn" id="m2-opt2" onclick="makeChoice(2, 2, 3)"><strong>X</strong><span>3 خ</span></button>
                <button class="opt-btn" id="m2-opt3" onclick="makeChoice(2, 3, 4)"><strong>٢</strong><span>4 خ</span></button>
            </div>
        </div>

        <div class="match-card" id="match-3">
            <div class="teams-area">
                <div class="team"><img src="https://upload.wikimedia.org/wikipedia/en/thumb/6/6c/Genoa_C.F.C._logo.svg/200px-Genoa_C.F.C._logo.svg.png"><div>جەنەوا</div></div>
                <div class="vs">VS</div>
                <div class="team"><img src="https://upload.wikimedia.org/wikipedia/en/thumb/f/f7/AS_Roma_logo_%282017%29.svg/200px-AS_Roma_logo_%282017%29.svg.png"><div>ڕۆما</div></div>
            </div>
            <div class="prediction-options">
                <button class="opt-btn" id="m3-opt1" onclick="makeChoice(3, 1, 4)"><strong>١</strong><span>4 خ</span></button>
                <button class="opt-btn" id="m3-opt2" onclick="makeChoice(3, 2, 2)"><strong>X</strong><span>2 خ</span></button>
                <button class="opt-btn" id="m3-opt3" onclick="makeChoice(3, 3, 3)"><strong>٢</strong><span>3 خ</span></button>
            </div>
        </div>

        <div class="nav-bar">
            <button onclick="toggleLeaderboard(true)" style="background:none; border:none; color:white; font-weight:bold; cursor:pointer; font-size:16px;">🏆 ڕیزبەندی گروپی برایان</button>
        </div>
    </div>
</div>

<div id="leaderboard-modal">
    <div class="modal-content">
        <h3 style="text-align: center; color: var(--secondary); margin-bottom: 20px;">🏆 لیستى خاڵەکان</h3>
        <div id="myRankDisplay" class="rank-row" style="color: var(--primary); font-weight: bold;"></div>
        <button class="btn-main" style="margin-top: 25px; background: #334155;" onclick="toggleLeaderboard(false)">داخستن</button>
    </div>
</div>

<script>
    // ئەنجامەکان لێرە بنووسە (1: چەپ، 2: یەکسان، 3: ڕاست)
    const realResults = { 1: 0, 2: 0, 3: 0 };
    const matchPoints = {
        1: {1: 2, 2: 3, 3: 4},
        2: {1: 2, 2: 3, 3: 4},
        3: {1: 4, 2: 2, 3: 3}
    };

    window.onload = function() {
        const name = localStorage.getItem('app_user_name');
        if (name) {
            showApp(name);
            calculatePoints();
        }
    };

    function saveUser() {
        const name = document.getElementById('userNameInput').value;
        if (!name || name.trim() === "") return alert("تکایە ناوت بنووسە");
        localStorage.setItem('app_user_name', name);
        location.reload();
    }

    function showApp(name) {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('welcomeText').innerText = "سڵاو " + name;
        checkAllChoices();
    }

    function makeChoice(mId, oId, pts) {
        if (localStorage.getItem('match_' + mId)) return;
        if (confirm("ئایا دڵنیایت؟ پێشبینییەکەت قوفڵ دەکرێت!")) {
            localStorage.setItem('match_' + mId, oId);
            checkAllChoices();
            calculatePoints();
        }
    }

    function checkAllChoices() {
        for (let i = 1; i <= 3; i++) {
            const saved = localStorage.getItem('match_' + i);
            if (saved) {
                document.querySelectorAll(`#match-${i} .opt-btn`).forEach(b => b.classList.add('disabled'));
                document.getElementById(`m${i}-opt${saved}`).classList.add('selected');
                document.getElementById(`m${i}-opt${saved}`).classList.remove('disabled');
            }
        }
    }

    function calculatePoints() {
        let total = 0;
        const name = localStorage.getItem('app_user_name');
        for (let i = 1; i <= 3; i++) {
            const userChoice = localStorage.getItem('match_' + i);
            if (realResults[i] !== 0 && userChoice == realResults[i]) {
                total += matchPoints[i][userChoice];
            }
        }
        document.getElementById('totalPointsDisplay').innerText = "خاڵ: " + total;
        document.getElementById('myRankDisplay').innerHTML = `<span>١. ${name}</span> <strong>${total} خاڵ</strong>`;
    }

    function toggleLeaderboard(show) { document.getElementById('leaderboard-modal').style.display = show ? 'flex' : 'none'; }
</script>

</body>
                                      </html>
