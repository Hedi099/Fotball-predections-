<html lang="ku" dir="rtl">

    <style>
        :root { 
            --primary: #8b5cf6; 
            --secondary: #fbbf24; 
            --accent: #ec4899;
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text: #ffffff;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }

        body { 
            margin: 0; 
            min-height: 100vh; 
            color: var(--text);
            display: flex; 
            justify-content: center;
            background: #030712;
            position: relative;
            overflow-x: hidden;
        }

        /* وێنەی باکگراوند */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('https://r2.erweima.ai/i/eAtF7Ua1QfWf6-xM3A8L1A.jpg') no-repeat center center;
            background-size: cover;
            filter: brightness(0.4) saturate(1.2);
            z-index: -1;
        }

        .container { width: 100%; max-width: 480px; padding: 20px; position: relative; z-index: 1; }

        .glass { 
            background: var(--glass-bg); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); 
            border-radius: 28px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .logo-text { 
            font-size: 32px; font-weight: 900; text-align: center; 
            background: linear-gradient(135deg, #fbbf24, #f59e0b, #ec4899);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            margin-bottom: 25px; text-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .hadith-box { 
            background: rgba(251, 191, 36, 0.15); border: 1px solid var(--secondary); 
            border-radius: 20px; padding: 15px; text-align: center; margin-bottom: 25px; 
            font-size: 13px; line-height: 1.7; 
        }

        .match-card { margin-bottom: 25px; transition: transform 0.3s ease; }
        .match-card:hover { transform: translateY(-5px); }
        
        .match-header { 
            padding: 12px 20px; border-bottom: 1px solid var(--glass-border); 
            display: flex; justify-content: space-between; font-size: 11px;
        }

        .opt-btn { 
            flex: 1; padding: 12px 5px; border-radius: 18px; border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.08); color: #fff; cursor: pointer;
            transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        
        .opt-btn.selected { background: var(--secondary); color: #000; border-color: var(--secondary); box-shadow: 0 0 15px rgba(251, 191, 36, 0.4); }
        .btn-main { 
            width: 100%; padding: 16px; border-radius: 18px; border: none; 
            background: linear-gradient(135deg, var(--primary), #6366f1); 
            color: white; font-weight: bold; cursor: pointer; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }
        .btn-main:active { transform: scale(0.98); }

        .choice-card { 
            padding: 40px 20px; text-align: center; cursor: pointer; transition: 0.4s; 
            border: 1px solid var(--glass-border); margin-bottom: 15px;
        }
        .choice-card:hover { background: rgba(255,255,255,0.15); border-color: var(--secondary); }

        input { 
            width: 100%; padding: 18px; border-radius: 18px; border: 1px solid var(--glass-border); 
            background: rgba(0,0,0,0.4); color: white; margin-bottom: 15px; text-align: center;
        }

        .nav-btn { 
            padding: 12px; border-radius: 15px; border: none; font-weight: bold; 
            cursor: pointer; font-size: 11px; transition: 0.3s;
        }

        .rank-row { background: rgba(255,255,255,0.03); margin-bottom: 8px; border-radius: 15px; padding: 12px; }
        
        /* Quiz Specific Styling */
        .quiz-option { 
            width: 100%; padding: 16px; margin-bottom: 12px; border-radius: 18px; 
            border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); 
            color: white; text-align: right; cursor: pointer; font-weight: 600;
        }
    </style>
</head>

    let quizTimer;
    let userQuizRecords = {};
    let isReviewing = false;

    function loginUser() {
        const n = document.getElementById('userNameInput').value.trim();
        if(!n) return; localStorage.setItem('groupBryanUser', n); location.reload();
    }

    if (currentUser) {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('selection-page').style.display = 'block';
        if(currentUser === 'Hedi') {
            document.getElementById('reset-weekly-btn-main').style.display = 'block';
            document.getElementById('reset-just-weekly-btn').style.display = 'block';
            document.getElementById('reset-quiz-btn').style.display = 'block';
        }
    }

    function showSection(sec) {
        document.getElementById('selection-page').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('preds-section').style.display = 'none';
        document.getElementById('quiz-section').style.display = 'none';
        clearInterval(quizTimer);
        if(sec === 'home') { document.getElementById('selection-page').style.display = 'block'; document.getElementById('main-app').style.display = 'none'; }
        else if(sec === 'preds') { document.getElementById('preds-section').style.display = 'block'; renderMatches(); startCountdowns(); }
        else if(sec === 'quiz') { document.getElementById('quiz-section').style.display = 'block'; checkQuizStatus(); }
    }

    function checkQuizStatus() {
        db.ref('quizRecords/'+currentUser).once('value', s => {
            userQuizRecords = s.val() || {};
            const answeredCount = Object.keys(userQuizRecords).length;
            document.getElementById('start-quiz-btn').style.display = "none";
            document.getElementById('review-quiz-btn').style.display = "none";
            document.getElementById('quiz-options').innerHTML = "";
            if (answeredCount >= quizData.length) {
                document.getElementById('quiz-question').innerText = "تەواو! هەموو پرسیارەکانت وەڵام دایەوە.";
                document.getElementById('review-quiz-btn').style.display = "block";
            } else {
                currentQIdx = 0;
                document.getElementById('quiz-question').innerText = "ئامادەیت؟ " + quizData.length + " پرسیار هەیە.";
                document.getElementById('start-quiz-btn').style.display = "block";
            }
        });
    }

    function nextQuestion() {
        if(currentQIdx >= quizData.length) { checkQuizStatus(); return; }
        const qId = "q_" + currentQIdx;
        if (userQuizRecords[qId]) { currentQIdx++; nextQuestion(); } else { renderQuiz(); }
    }

    function renderQuiz() {
        const q = quizData[currentQIdx];
        document.getElementById('quiz-question').innerText = q.q;
        document.getElementById('start-quiz-btn').style.display = "none";
        document.getElementById('quiz-timer-container').style.display = "block";
        let h = '';
        q.opts.forEach((opt, i) => { h += `<button class="quiz-option" onclick="submitAnswer(${i})">${opt}</button>`; });
        document.getElementById('quiz-options').innerHTML = h;
        let time = 30;
        const fill = document.getElementById('timer-fill');
        clearInterval(quizTimer);
        quizTimer = setInterval(() => { time--; fill.style.width = (time/30*100) + "%"; if(time <= 0) { clearInterval(quizTimer); submitAnswer(-1); } }, 1000);
    }

    function submitAnswer(choice) {
        clearInterval(quizTimer);
        const q = quizData[currentQIdx];
        const correct = (choice === q.ans);
        db.ref('quizRecords/'+currentUser+'/q_'+currentQIdx).set({choice, status: correct}).then(() => {
            if(correct) { db.ref('quizPoints/'+currentUser).once('value', s => { db.ref('quizPoints/'+currentUser).set((s.val() || 0) + 1); }); }
            currentQIdx++; setTimeout(nextQuestion, 1000);
        });
    }

    function renderMatches() {
        let h = '';
        matches.forEach(m => {
            const isLocked = new Date() >= new Date(m.deadline);
            h += `<div class="match-card glass">
                <div class="match-header"><span>${m.event}</span><span>${new Date(m.deadline).toLocaleString('ku-IQ')}</span></div>
                <div class="match-body" style="padding:20px;">
                    <div style="display:flex; justify-content:space-around; align-items:center; margin-bottom:15px;">
                        <div style="text-align:center"><img src="${m.img1}" width="45"><br><small>${m.t1}</small></div>
                        <div style="font-weight:bold">VS</div>
                        <div style="text-align:center"><img src="${m.img2}" width="45"><br><small>${m.t2}</small></div>
                    </div>
                    <div id="cd-${m.id}" style="text-align:center; color:var(--accent); font-size:12px; margin-bottom:15px;"></div>
                    <div class="prediction-row" style="display:flex; gap:10px;">
                        <button class="opt-btn" id="${m.id}-btn1" ${isLocked?'disabled':''} onclick="vote('${m.id}',1,${m.p1},'${m.deadline}')"><span>1</span><span>${m.p1}</span></button>
                        <button class="opt-btn" id="${m.id}-btn2" ${isLocked?'disabled':''} onclick="vote('${m.id}',2,${m.pX},'${m.deadline}')"><span>X</span><span>${m.pX}</span></button>
                        <button class="opt-btn" id="${m.id}-btn3" ${isLocked?'disabled':''} onclick="vote('${m.id}',3,${m.p2},'${m.deadline}')"><span>2</span><span>${m.p2}</span></button>
                    </div>
                    <div id="admin-tools-${m.id}" style="display:none; margin-top:15px; text-align:center;">
                        <button onclick="setResult('${m.id}',1,${m.p1})" style="background:#22c55e; border:none; color:white; padding:5px 10px; border-radius:5px;">W1</button>
                        <button onclick="setResult('${m.id}',2,${m.pX})" style="background:#64748b; border:none; color:white; padding:5px 10px; border-radius:5px;">X</button>
                        <button onclick="setResult('${m.id}',3,${m.p2})" style="background:#22c55e; border:none; color:white; padding:5px 10px; border-radius:5px;">W2</button>
                    </div>
                </div>
            </div>`;
        });
        document.getElementById('matches-list').innerHTML = h;
        loadStates();
    }

    function startCountdowns() { setInterval(() => { matches.forEach(m => { const now = new Date().getTime(); const diff = new Date(m.deadline).getTime() - now; const el = document.getElementById(`cd-${m.id}`); if (!el) return; if (diff <= 0) { el.innerHTML = "🔒 داخراوە"; return; } const h = Math.floor(diff / (3600000)); const m_ = Math.floor((diff % 3600000) / 60000); const s = Math.floor((diff % 60000) / 1000); el.innerHTML = `⏳ ${h}:${m_}:${s}`; }); }, 1000); }
    function loadStates() { db.ref('results').on('value', sRes => { const results = sRes.val() || {}; db.ref('users/'+currentUser+'/predictions').on('value', sPred => { const ps = sPred.val() || {}; matches.forEach(m => { const res = results[m.id]; const pred = ps[m.id]; if(currentUser === 'Hedi' && !res) document.getElementById(`admin-tools-${m.id}`).style.display='block'; if(pred) { const btn = document.getElementById(m.id+'-btn'+pred.choice); if(btn) btn.classList.add('selected'); } }); }); }); }
    function vote(mId, c, p, dl) { if(new Date() >= new Date(dl)) return; if(confirm("پەسەندە؟")) db.ref('users/'+currentUser+'/predictions/'+mId).set({choice:c, pts:p}); }
    function setResult(mId, win, pts) { db.ref('results/'+mId).set({winner:win}).then(() => { db.ref('users').once('value', s => { s.forEach(u => { const d = u.val(); if(d.predictions && d.predictions[mId] && d.predictions[mId].choice == win) { db.ref('users/'+u.key).update({ weekly:(d.weekly||0)+pts, total:(d.total||0)+pts }); } }); }); }); }
    
    function resetWeeklyPoints() { if(confirm("هەموو داتاکان بسڕێنەوە؟")) { db.ref('users').once('value', s => { s.forEach(u => { db.ref('users/'+u.key).update({weekly:0, total:0, predictions:null}); }); db.ref('results').set(null); }); } }
    function resetOnlyWeekly() { if(confirm("تەنها هەفتە؟")) { db.ref('users').once('value', s => { s.forEach(u => { db.ref('users/'+u.key).update({weekly:0}); }); }); } }
    function resetAllQuizAnswers() { if(confirm("سڕینەوەی وەڵامی پرسیارەکان؟")) { db.ref('quizRecords').set(null); db.ref('quizPoints').set(null); } }

    function openRank(type) {
        const path = (type === 'preds') ? 'users' : 'quizPoints';
        db.ref(path).once('value', s => {
            let r = [];
            if(type === 'preds') s.forEach(u => { r.push({ n: u.key, p: u.val().total||0 }); });
            else s.forEach(u => { r.push({ n: u.key, p: u.val()||0 }); });
            r.sort((a,b) => b.p - a.p);
            document.getElementById('rank-list').innerHTML = r.map(i => `<div class="rank-row"><span>${i.n}</span><span style="float:left; color:var(--secondary)">${i.p} خاڵ</span></div>`).join('');
            document.getElementById('leaderboard-view').style.display = 'flex';
        });
    }
    function closeView(id) { document.getElementById(id).style.display = 'none'; }
    function logout() { localStorage.removeItem('groupBryanUser'); location.reload(); }
</script>
</body>
</html>
