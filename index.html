            --danger: #ef4444; --success: #22c55e;

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: radial-gradient(circle at top right, #1e293b, #0f172a); color: white; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; padding: 15px; }
        .hadith-box { background: rgba(245, 158, 11, 0.1); border: 1px solid var(--secondary); border-radius: 20px; padding: 20px; margin-bottom: 15px; text-align: center; }
        
        .install-app-btn {
            display: block; width: 100%; background: linear-gradient(45deg, #059669, #10b981);
            color: white; border: none; padding: 14px; border-radius: 15px; font-weight: bold;
            font-size: 14px; cursor: pointer; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: 0.3s; animation: bounce 2s infinite;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        #login-page, #main-app, .admin-box { background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(10px); padding: 25px; border-radius: 30px; border: 1px solid var(--border); margin-top: 15px; text-align: center; }
        input { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid var(--border); background: rgba(15, 23, 42, 0.8); color: white; margin-bottom: 15px; text-align: center; font-size: 16px; }
        .btn-main { width: 100%; background: linear-gradient(to left, var(--primary), #8b5cf6); color: white; border: none; padding: 16px; border-radius: 15px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        
        .btn-leaderboard {
            width: 100%; background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid var(--secondary);
            padding: 14px; border-radius: 20px; font-weight: bold; cursor: pointer; margin: 20px 0;
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s;
        }
        .btn-leaderboard:hover { background: var(--secondary); color: black; }

        .btn-view-others {
            background: rgba(255,255,255,0.1); color: #cbd5e1; border: 1px solid var(--border);
            padding: 10px; border-radius: 15px; font-size: 11px; cursor: pointer; margin-top: 10px; width: 100%;
            display: none; transition: 0.3s;
        }
        .btn-view-others:hover { background: rgba(255,255,255,0.2); }

        .delete-account-btn { background: var(--danger); color: white; border: none; padding: 4px 8px; border-radius: 8px; font-size: 9px; cursor: pointer; font-weight: bold; }

        /* Modern Match Card Design */
        .match-card { 
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border: 1px solid var(--border); 
            border-radius: 30px; padding: 20px 10px; margin-top: 25px; position: relative; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden;
        }
        .match-event-badge {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            background: var(--primary); color: white; font-size: 10px; font-weight: bold;
            padding: 4px 15px; border-radius: 0 0 12px 12px; text-transform: uppercase;
        }
        .stadium-info { font-size: 11px; color: #94a3b8; display: block; margin-top: 15px; text-align: center; font-style: italic; }
        .timer { font-size: 12px; color: var(--secondary); font-weight: bold; background: rgba(245, 158, 11, 0.1); padding: 5px 15px; border-radius: 50px; margin-bottom: 15px; display: inline-block; direction: ltr; border: 1px solid rgba(245, 158, 11, 0.3); }
        .prediction-container { display: flex; justify-content: space-around; align-items: center; position: relative; z-index: 1; padding-top: 10px; }
        .predict-box { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .team-logo { width: 55px; height: 55px; object-fit: contain; filter: drop-shadow(0 0 8px rgba(255,255,255,0.2)); }
        .team-name { font-size: 12px; font-weight: bold; color: #ffffff; text-align: center; height: 35px; display: flex; align-items: center; }
        .opt-btn { width: 90%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; padding: 10px 2px; border-radius: 12px; cursor: pointer; font-size: 10px; font-weight: bold; transition: 0.3s; }
        .opt-btn.selected { background: var(--secondary); color: black; font-weight: 900; border-color: white; transform: scale(1.05); }
        .expired-overlay { opacity: 0.7; filter: grayscale(0.4); }
        
        #leaderboard-overlay, #predictions-overlay { display: none; position: fixed; inset: 0; background: #0f172a; z-index: 1000; padding: 20px; overflow-y: auto; }
        .rank-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        .rank-row td { padding: 15px 12px; background: rgba(255, 255, 255, 0.05); border-radius: 15px; }
        .pred-list-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }

    async function loginUser() {
        const name = document.getElementById('userNameInput').value.trim();
        const pass = document.getElementById('userPassInput').value.trim();
        if(!name) return;
        const snap = await db.ref('users/' + name).once('value');
        const userData = snap.val();
        if(userData && userData.password && userData.password !== pass) { alert("⚠️ پاسوۆرد هەڵەیە!"); return; }
        localStorage.setItem('groupBryanUser', name);
        location.reload();
    }

    function updateTimers() {
        matches.forEach(m => {
            const now = new Date().getTime();
            const target = new Date(m.deadline).getTime();
            const diff = target - now;
            const timerEl = document.getElementById('timer-' + m.id);
            const viewBtn = document.getElementById('view-' + m.id);
            if (diff <= 0) {
                if (timerEl) timerEl.innerHTML = "🔒 داخراوە";
                document.getElementById(m.id).classList.add('expired-overlay');
                document.querySelectorAll(`#${m.id} .opt-btn`).forEach(b => b.disabled = true);
                if (viewBtn) viewBtn.style.display = 'block';
            } else {
                const h = Math.floor(diff / (1000 * 60 * 60));
                const m_rem = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                if (timerEl) timerEl.innerHTML = `⏳ ${h}h ${m_rem}m ${s}s`;
            }
        });
    }

    function viewAllPredictions(mId) {
        const match = matches.find(m => m.id === mId);
        document.getElementById('pred-match-title').innerText = `${match.t1} 🆚 ${match.t2}`;
        document.getElementById('predictions-body').innerHTML = '<p style="text-align:center;">کەمێک چاوەڕوان بە...</p>';
        document.getElementById('predictions-overlay').style.display = 'block';

        db.ref('users').once('value').then(snap => {
            let listHtml = "";
            let hasPreds = false;
            snap.forEach(uSnap => {
                const u = uSnap.val();
                if(u.predictions && u.predictions[mId]) {
                    hasPreds = true;
                    const choice = u.predictions[mId].choice;
                    const team = choice == 1 ? match.t1 : choice == 2 ? "یەکسان" : match.t2;

                        <span class="pred-choice-box choice-${choice}">${team}</span>

                    const isLocked = settled[m.id];
                    admH += `<div class="admin-match-item">
                        <div style="font-weight:bold; margin-bottom:12px; font-size:13px; color:#94a3b8;"># ${m.id}</div>
                        <div id="adm-btns-${m.id}" class="admin-btns" style="${isLocked ? 'display:none' : ''}">
                            <button class="btn-adm-t1" onclick="settleMatch('${m.id}', 1)">${m.t1}</button>
                            <button class="btn-adm-x" onclick="settleMatch('${m.id}', 2)">یەکسان</button>
                            <button class="btn-adm-t2" onclick="settleMatch('${m.id}', 3)">${m.t2}</button>
                        </div>
                        <div id="adm-lock-${m.id}" class="admin-status-locked" style="${isLocked ? 'display:block' : ''}">🔒 ئەنجام تۆمارکراوە و قفڵە</div>
                    </div>`;
                });
                document.getElementById('admin-matches-list').innerHTML = admH;
            });
        }

        let h = '';
        matches.forEach(m => {
            h += `<div class="match-card" id="${m.id}">
                <div class="match-event-badge">${m.event}</div>
                <div style="text-align:center;"><div class="timer" id="timer-${m.id}">...</div></div>
                <div class="prediction-container">
                    <div class="predict-box"><span class="team-name">${m.t1}</span><img src="${m.img1}" class="team-logo">
                        <button class="opt-btn" id="${m.id}-btn1" onclick="vote('${m.id}', 1, ${m.p1})">${m.p1} خاڵ</button></div>
                    <div class="predict-box"><span class="team-name">X</span>
                        <button class="opt-btn" id="${m.id}-btn2" onclick="vote('${m.id}', 2, ${m.pX})" style="margin-top:55px;">${m.pX} خاڵ</button></div>
                    <div class="predict-box"><span class="team-name">${m.t2}</span><img src="${m.img2}" class="team-logo">
                        <button class="opt-btn" id="${m.id}-btn3" onclick="vote('${m.id}', 3, ${m.p2})">${m.p2} خاڵ</button></div>
                </div>
                <button id="view-${m.id}" class="btn-view-others" onclick="viewAllPredictions('${m.id}')">👥 پێشبینی هەمووان</button>
                <div class="stadium-info">🏟️ ${m.stadium}</div></div>`;
        });
        document.getElementById('matches-list').innerHTML = h;
        setInterval(updateTimers, 1000); updateTimers();

        db.ref('users/' + currentUser).on('value', snap => {
            const d = snap.val() || {total:0, weekly:0};
            document.getElementById('uTotal').innerText = d.total || 0;
            document.getElementById('uWeekly').innerText = d.weekly || 0;
            if (d.predictions) {
                Object.keys(d.predictions).forEach(mid => {
                    const btn = document.getElementById(mid + '-btn' + d.predictions[mid].choice);
                    if(btn) btn.classList.add('selected');
                });
            }
        });
    }

    function settleMatch(mId, winnerChoice) {
        const match = matches.find(m => m.id === mId);
        const choiceText = winnerChoice == 1 ? match.t1 : winnerChoice == 2 ? "یەکسانبوون" : match.t2;
        if(!confirm(`ئایا دڵنیای کە [${choiceText}] براوەیە؟`)) return;
        
        db.ref('users').once('value').then(snap => {
            snap.forEach(userSnap => {
                const userData = userSnap.val();
                if(userData.predictions && userData.predictions[mId]) {
                    if(userData.predictions[mId].choice == winnerChoice) {
                        const pts = userData.predictions[mId].pts;
                        db.ref('users/' + userSnap.key).update({
                            weekly: (userData.weekly || 0) + pts,
                            total: (userData.total || 0) + pts
                        });
                    }
                }
            });
            db.ref('settledMatches/' + mId).set(true);
            alert("ئەنجام قفڵ کرا و خاڵەکان دابەشکران.");
        });
    }

    function openLeaderboard() {
        db.ref('users').once('value').then(snap => {
            let arr = []; snap.forEach(u => { const data = u.val(); arr.push({name: u.key, t: data.total || 0, w: data.weekly || 0}); });
            arr.sort((a,b) => b.w - a.w);
            let row = ''; 
            arr.forEach((u, i) => { 
                let medal = i === 0 ? "🥇 " : i === 1 ? "🥈 " : i === 2 ? "🥉 " : (i+1) + ". ";
                row += `<tr class="rank-row"><td>${medal}${u.name}</td><td><span class="pts-badge">${u.w}</span> / ${u.t}</td></tr>`; 
            });
            document.getElementById('leaderboard-body').innerHTML = row;
            document.getElementById('leaderboard-overlay').style.display = 'block';
        });
    }

    function logoutUser() { localStorage.removeItem('groupBryanUser'); location.reload(); }
    function deleteAccount() { if(confirm("دڵنیای؟")) { db.ref('users/'+currentUser).remove(); logoutUser(); } }
    function vote(mId, c, p) { 
        const match = matches.find(m => m.id === mId);
        if(new Date().getTime() > new Date(match.deadline).getTime()) return;
        if(confirm("قفڵ؟")) db.ref('users/'+currentUser+'/predictions/'+mId).set({choice:c, pts:p}); 
    }
</script>
</body>
</html>
