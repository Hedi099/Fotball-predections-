<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گروپی برایان - وەشانی نوێ</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { 
            --primary: #6366f1; --secondary: #fbbf24; --bg: #030712; 
            --card-inner: rgba(15, 23, 42, 0.88); --border: rgba(255, 255, 255, 0.1); 
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 440px; padding: 15px; }
        
        .hadith-box { background: linear-gradient(135deg, #1e1b4b, #030712); border-radius: 20px; padding: 20px; margin-bottom: 25px; text-align: center; border: 1px solid #312e81; }

        .match-card { 
            position: relative; border-radius: 30px; margin-top: 30px; overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 1px solid var(--border);
            background-size: cover; background-position: center;
        }
        .card-overlay { 
            background: linear-gradient(to bottom, rgba(3,7,18,0.4), var(--card-inner)); 
            padding: 25px 15px; backdrop-filter: blur(4px); 
        }
        .match-event-badge {
            position: absolute; top: 15px; right: 15px;
            background: var(--primary); color: white; font-size: 10px; font-weight: bold;
            padding: 5px 12px; border-radius: 50px; z-index: 2;
        }
        .timer { font-size: 11px; color: var(--secondary); background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 50px; display: inline-block; margin-bottom: 15px; border: 1px solid rgba(251,191,36,0.3); direction: ltr; }
        
        .prediction-container { display: flex; justify-content: space-between; align-items: center; gap: 8px; position: relative; z-index: 1; }
        .predict-box { flex: 1; display: flex; flex-direction: column; align-items: center; }
        .team-logo { width: 60px; height: 60px; object-fit: contain; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.6)); margin-bottom: 8px; }
        .team-name { font-size: 12px; font-weight: 900; color: #fff; text-align: center; height: 35px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        
        .opt-btn { 
            width: 95%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); 
            color: #e2e8f0; padding: 12px 2px; border-radius: 15px; cursor: pointer; font-size: 11px; font-weight: bold; 
            transition: 0.3s; backdrop-filter: blur(5px);
        }
        .opt-btn.selected { 
            background: var(--secondary) !important; color: #000 !important; border-color: #fff;
            transform: scale(1.05); font-weight: 900; box-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
        }
        .opt-btn:disabled { cursor: not-allowed; }
        .locked-msg { color: var(--secondary); font-size: 12px; font-weight: bold; margin-top: 15px; display: none; }

        input { width: 100%; padding: 16px; border-radius: 15px; border: 1px solid var(--border); background: #111827; color: white; margin-bottom: 15px; text-align: center; }
        .btn-main { width: 100%; background: linear-gradient(to right, var(--primary), #4338ca); color: white; border: none; padding: 16px; border-radius: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="hadith-box">
        <div style="font-size:16px; font-weight: bold; line-height: 1.6;">«سُبْحَانَ اللهِ، وَالْحَمْدُ للهِ، وَلَا إِلَهَ إِلَّا اللهُ، وَاللهُ أَكْبەرُ»</div>
    </div>

    <div id="login-page">
        <h1 style="text-align: center; margin-bottom: 30px;">🏆 گروپی برایان</h1>
        <input type="text" id="userNameInput" placeholder="ناوەکەت بنووسە">
        <input type="password" id="userPassInput" placeholder="پاسوۆرد">
        <button class="btn-main" onclick="loginUser()">چوونە ژوورەوە</button>
    </div>

    <div id="main-app" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(30,41,59,0.5); padding: 15px; border-radius: 20px; border: 1px solid var(--border); backdrop-filter: blur(10px);">
            <span id="welcomeText" style="color: var(--secondary); font-weight: bold;"></span>
            <div style="display: flex; gap: 15px;">
                <div style="text-align:center;"><div id="uWeekly" style="color:#22c55e; font-weight:bold;">0</div><small>هەفتە</small></div>
                <div style="text-align:center;"><div id="uTotal" style="color:var(--secondary); font-weight:bold;">0</div><small>گشتی</small></div>
            </div>
        </div>
        <div id="matches-list"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBCXp7vjnb1naq1GpiyN29Br3SH_yNGkkQ",
        authDomain: "brayan-2a1ef.firebaseapp.com",

        projectId: "brayan-2a1ef",
        storageBucket: "brayan-2a1ef.firebasestorage.app",
        messagingSenderId: "655783456427",
        appId: "1:655783456427:web:1535d3dfd9b53515c391ee"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentUser = localStorage.getItem('groupBryanUser');

    const matches = [
        // 14/3
        { id: "m1", t1: "ئارسناڵ", t2: "ئیڤەرتۆن", p1: 2, pX: 3, p2: 5, event: "پرێمەرلیگ", deadline: "2026-03-14T20:30:00", bg: "https://images.unsplash.com/photo-1599321955419-7833bd4482c3?w=500" },
        { id: "m2", t1: "چێڵسی", t2: "نیوکاسڵ", p1: 3, pX: 2, p2: 4, event: "پرێمەرلیگ", deadline: "2026-03-14T20:30:00", bg: "https://images.unsplash.com/photo-1589487391730-58f20eb2c308?w=500" },
        { id: "m3", t1: "وێستهام", t2: "مان سیتی", p1: 4, pX: 3, p2: 2, event: "پرێمەرلیگ", deadline: "2026-03-14T23:00:00", bg: "https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=500" },
        { id: "m4", t1: "ئەتلەتیکۆ", t2: "خیتافی", p1: 2, pX: 4, p2: 5, event: "لالیگا", deadline: "2026-03-14T18:15:00", bg: "https://images.unsplash.com/photo-1622279457486-62dcc4a4bd13?w=500" },
        { id: "m5", t1: "ڕیاڵ ئۆڤیدۆ", t2: "ڤالێنسیا", p1: 3, pX: 4, p2: 2, event: "لالیگا", deadline: "2026-03-14T20:30:00", bg: "https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=500" },
        { id: "m6", t1: "ڕیاڵ مەدرید", t2: "ئێڵچی", p1: 2, pX: 3, p2: 5, event: "لالیگا", deadline: "2026-03-14T23:00:00", bg: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=500" },
        { id: "m7", t1: "ئینتەرمیلان", t2: "ئەتڵەنتا", p1: 2, pX: 3, p2: 4, event: "سێریا ئەی", deadline: "2026-03-14T17:00:00", bg: "https://images.unsplash.com/photo-1518091043644-c1d445bb5120?w=500" },
        { id: "m8", t1: "ناپۆلی", t2: "لیچی", p1: 2, pX: 3, p2: 4, event: "سێریا ئەی", deadline: "2026-03-14T20:00:00", bg: "https://images.unsplash.com/photo-1639031260004-98c47087053e?w=500" },
        { id: "m9", t1: "ئۆدێنێزی", t2: "یوڤێنتۆس", p1: 4, pX: 3, p2: 2, event: "سێریا ئەی", deadline: "2026-03-14T22:45:00", bg: "https://images.unsplash.com/photo-1551958219-acbc608c6377?w=500" },
        { id: "m10", t1: "بایرن", t2: "لیڤەرکوزن", p1: 2, pX: 3, p2: 4, event: "خولی ئەڵمانی", deadline: "2026-03-14T17:30:00", bg: "https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=500" },
        { id: "m11", t1: "دۆرتمۆند", t2: "ئۆگسبۆرگ", p1: 2, pX: 3, p2: 5, event: "خولی ئەڵمانی", deadline: "2026-03-14T17:30:00", bg: "https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=500" },
        // 15/3
        { id: "m12", t1: "مان یونایتد", t2: "ئەستۆن ڤێلا", p1: 3, pX: 2, p2: 4, event: "پرێمەرلیگ", deadline: "2026-03-15T17:00:00", bg: "https://images.unsplash.com/photo-1563299796-17596ed6b017?w=500" },
        { id: "m13", t1: "لیڤەرپووڵ", t2: "تۆتنهام", p1: 2, pX: 4, p2: 5, event: "پرێمەرلیگ", deadline: "2026-03-15T19:30:00", bg: "https://images.unsplash.com/photo-1556056504-5c7696c4c28d?w=500" },
        { id: "m14", t1: "بارسێلۆنا", t2: "سێڤیلیا", p1: 2, pX: 3, p2: 4, event: "لالیگا", deadline: "2026-03-15T18:15:00", bg: "https://images.unsplash.com/photo-1524311588144-62bb00b213f0?w=500" },
        { id: "m15", t1: "کۆمۆ", t2: "ڕۆما", p1: 3, pX: 2, p2: 4, event: "سێریا ئەی", deadline: "2026-03-15T20:00:00", bg: "https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=500" },
        { id: "m16", t1: "لازیۆ", t2: "میلان", p1: 4, pX: 3, p2: 2, event: "سێریا ئەی", deadline: "2026-03-15T22:45:00", bg: "https://images.unsplash.com/photo-1518091043644-c1d445bb5120?w=500" },
        { id: "m17", t1: "ئینتەرمیامی", t2: "Charlotte FC", p1: 4, pX: 2, p2: 3, event: "خولی ئەمریکی", deadline: "2026-03-15T02:30:00", bg: "https://images.unsplash.com/photo-1556056504-5c7696c4c28d?w=500" },
        // 17/3 & 18/3 Champions League
        { id: "m18", t1: "بۆدۆ گلیمت", t2: "لیشبۆنە", p1: 4, pX: 3, p2: 2, event: "چامپیۆنسلیگ", deadline: "2026-03-17T20:45:00", bg: "https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=500" },
        { id: "m19", t1: "ئارسناڵ", t2: "لیڤەرکوزن", p1: 2, pX: 4, p2: 5, event: "چامپیۆنسلیگ", deadline: "2026-03-17T23:00:00", bg: "https://images.unsplash.com/photo-1599321955419-7833bd4482c3?w=500" },
        { id: "m20", t1: "چێڵسی", t2: "پاریس", p1: 3, pX: 2, p2: 4, event: "چامپیۆنسلیگ", deadline: "2026-03-17T23:00:00", bg: "https://images.unsplash.com/photo-1589487391730-58f20eb2c308?w=500" },
        { id: "m21", t1: "مان سیتی", t2: "ڕیاڵ مەدرید", p1: 2, pX: 3, p2: 5, event: "چامپیۆنسلیگ", deadline: "2026-03-17T23:00:00", bg: "https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=500" },
        { id: "m22", t1: "بارسێلۆنا", t2: "نیوکاسڵ", p1: 2, pX: 4, p2: 5, event: "چامپیۆنسلیگ", deadline: "2026-03-18T20:45:00", bg: "https://images.unsplash.com/photo-1524311588144-62bb00b213f0?w=500" },
        { id: "m23", t1: "ئەتلەتیکۆ", t2: "تۆتنهام", p1: 2, pX: 4, p2: 3, event: "چامپیۆنسلیگ", deadline: "2026-03-18T23:00:00", bg: "https://images.unsplash.com/photo-1622279457486-62dcc4a4bd13?w=500" },
        { id: "m24", t1: "لیڤەرپووڵ", t2: "گەلەتەسەرای", p1: 2, pX: 4, p2: 5, event: "چامپیۆنسلیگ", deadline: "2026-03-18T23:00:00", bg: "https://images.unsplash.com/photo-1556056504-5c7696c4c28d?w=500" },
        { id: "m25", t1: "بایرن", t2: "ئەتڵەنتا", p1: 2, pX: 4, p2: 5, event: "چامپیۆنسلیگ", deadline: "2026-03-18T23:00:00", bg: "https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=500" }
    ];

    async function loginUser() {
        const name = document.getElementById('userNameInput').value.trim();
        if(!name) return;
        localStorage.setItem('groupBryanUser', name);
        location.reload();
    }

    if (currentUser) {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('welcomeText').innerText = "یاریزان: " + currentUser;

        let h = '';
        matches.forEach(m => {
            const dateObj = new Date(m.deadline);
            const timeStr = dateObj.getHours().toString().padStart(2, '0') + ":" + dateObj.getMinutes().toString().padStart(2, '0');
            const dateStr = dateObj.getDate() + "/" + (dateObj.getMonth() + 1);

            h += `<div class="match-card" id="${m.id}" style="background-image: url('${m.bg}')">
                <div class="card-overlay">
                    <div class="match-event-badge">${m.event}</div>
                    <div style="text-align:center;"><div class="timer">کات: ${dateStr} - ${timeStr}</div></div>
                    <div class="prediction-container">
                        <div class="predict-box"><div class="team-name">${m.t1}</div>
                            <button class="opt-btn" id="${m.id}-btn1" onclick="vote('${m.id}', 1, ${m.p1})">${m.p1} خاڵ</button></div>
                        <div class="predict-box" style="padding-top:40px;"><div class="team-name">یەکسان</div>
                            <button class="opt-btn" id="${m.id}-btn2" onclick="vote('${m.id}', 2, ${m.pX})">${m.pX} خاڵ</button></div>
                        <div class="predict-box"><div class="team-name">${m.t2}</div>
                            <button class="opt-btn" id="${m.id}-btn3" onclick="vote('${m.id}', 3, ${m.p2})">${m.p2} خاڵ</button></div>
                    </div>
                    <div id="lock-${m.id}" class="locked-msg" style="text-align:center;">🔒 قفڵ کرا</div>
                </div>
            </div>`;
        });
        document.getElementById('matches-list').innerHTML = h;

        db.ref('users/' + currentUser).on('value', snap => {
            const d = snap.val() || {};
            document.getElementById('uTotal').innerText = d.total || 0;
            document.getElementById('uWeekly').innerText = d.weekly || 0;
            if (d.predictions) {
                Object.keys(d.predictions).forEach(mid => {
                    const btn = document.getElementById(mid + '-btn' + d.predictions[mid].choice);
                    if(btn) {
                        btn.classList.add('selected');
                        document.getElementById('lock-' + mid).style.display = 'block';
                        document.querySelectorAll(`#${mid} .opt-btn`).forEach(b => b.disabled = true);
                    }
                });
            }
        });
    }

    function vote(mId, c, p) { 
        if(confirm("دڵنیای؟ دوای ئەمە ناتوانیت بیگۆڕیت!")) {
            db.ref('users/' + currentUser + '/predictions/' + mId).set({ choice: c, pts: p });
        }
    }
</script>
</body>
</html>
