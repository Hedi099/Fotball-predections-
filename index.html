<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brothers Group | یانەی برایان</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary: #fbbf24;
            --glass: rgba(0, 0, 0, 0.75);
            --border: rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; font-family: 'Noto Sans Arabic', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; 
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            /* لێرە وێنەکەت وەک باکگراوند دادەنرێت */
            background: url('IMG_20260409_045723_160.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
        }

        /* چینێکی تاریك بۆ ئەوەی وێنەکە نووسینەکان نەشارێتەوە */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.9));
            z-index: 0;
        }

        .container { 
            width: 100%; 
            max-width: 450px; 
            padding: 20px; 
            z-index: 1; 
            position: relative;
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .logo-area { text-align: center; margin-bottom: 30px; }
        .logo-area h1 { 
            font-size: 32px; 
            font-weight: 900; 
            margin: 0; 
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hadith-card {
            background: rgba(251, 191, 36, 0.1);
            border-right: 4px solid var(--primary);
            padding: 15px;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 25px;
            border-radius: 0 10px 10px 0;
        }

        .nav-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-card:hover { background: rgba(255,255,255,0.1); transform: translateY(-3px); border-color: var(--primary); }
        .nav-card .icon { font-size: 30px; }
        .nav-card h2 { margin: 0; font-size: 18px; }

        input {
            width: 100%;
            padding: 18px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            border-radius: 15px;
            color: white;
            margin-bottom: 15px;
            text-align: center;
            font-size: 16px;
        }

        .btn-main {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: black;
            border: none;
            border-radius: 15px;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(251, 191, 36, 0.3);
        }

        .section { display: none; }
        .active { display: block; animation: fadeIn 0.5s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>

<div class="container">
    <div id="login-page" class="section active" style="margin-top: 50px;">
        <div class="glass-panel">
            <div class="logo-area">
                <h1>BROTHERS GROUP</h1>
                <p style="color: #aaa; font-size: 12px;">سیستەمی پێشبینی و زانیاری</p>
            </div>
            <input type="text" id="userNameInput" placeholder="ناوەکەت بنووسە">
            <button class="btn-main" onclick="loginUser()">چوونە ژوورەوە</button>
        </div>
    </div>

    <div id="selection-page" class="section">
        <div class="hadith-card">
             «ارْحَمُوا مَنْ فِي الأَرْضِ يَرْحَمْكُمْ مَنْ فِي السَّمَاءِ»<br>
             ڕەحم بەوانە بکە کە لەسەر زەوین، تاوەکو ئەوەی لە ئاسمانە ڕەحمتان پێ بکات.
        </div>
        
        <div class="nav-card" onclick="showSection('preds')">
            <div class="icon">⚽</div>
            <div>
                <h2>پێشبینی یارییەکان</h2>
                <small style="color:#aaa;">خاڵەکانت زیاد بکە</small>
            </div>
        </div>

        <div class="nav-card" onclick="showSection('quiz')">
            <div class="icon">🧠</div>
            <div>
                <h2>پرسیار و وەڵام</h2>
                <small style="color:#aaa;">تاقیکردنەوەی زانیاری</small>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
            <button class="btn-main" style="background:#444; color:white; font-size:12px;" onclick="openRank('preds')">📊 ڕیزبەندی</button>
            <button class="btn-main" style="background:#800; color:white; font-size:12px;" onclick="logout()">🚪 چوونە دەرەوە</button>
        </div>
    </div>

    </div>

<script>
    // لێرە FirebaseConfig و فەنکشنەکان دابنێوە...
    // دڵنیابە ناوی وێنەکە لە CSSدا ڕێک هەمان ناوی وێنەکەی لای خۆت بێت.
    
    function loginUser() {
        const n = document.getElementById('userNameInput').value.trim();
        if(!n) return;
        localStorage.setItem('groupBryanUser', n);
        location.reload();
    }

    if (localStorage.getItem('groupBryanUser')) {
        document.getElementById('login-page').classList.remove('active');
        document.getElementById('selection-page').classList.add('active');
    }

    function showSection(sec) {
        // فەنکشنەکانی گۆڕینی بەشەکان لێرە بنووسە...
    }
</script>

</body>
</html>
