<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گروپی برایان</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #3b82f6; --secondary: #f59e0b; --bg: #0f172a; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg); color: white; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; padding: 15px; }
        
        #login-page, #main-app { background: rgba(30, 41, 59, 0.7); padding: 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); margin-top: 20px; text-align: center; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: none; margin-bottom: 15px; text-align: center; color: black; }
        button { cursor: pointer; border: none; font-weight: bold; }
        .btn-main { width: 100%; background: var(--primary); color: white; padding: 15px; border-radius: 10px; }
        
        .match-card { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 20px; margin-top: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .match-info { display: flex; justify-content: space-around; align-items: center; margin-bottom: 15px; }
        .team-box { flex: 1; text-align: center; }
        .team-logo { width: 60px; height: 60px; object-fit: contain; background: white; border-radius: 10px; padding: 5px; }
        .team-name { font-size: 14px; display: block; margin-top: 8px; font-weight: bold; }
        
        .options { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .opt-btn { background: rgba(255,255,255,0.1); color: white; padding: 10px; border-radius: 8px; font-size: 12px; }
        .opt-btn.selected { background: var(--secondary) !important; color: black !important; }
        
        .rank-btn { background: white; color: black; width: 100%; padding: 12px; border-radius: 10px; margin-top: 15px; }
        #leaderboard { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; padding: 20px; overflow-y: auto; z-index: 100; }
        .rank-row { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

<div class="container">
    <div id="login-page">
        <h2>🏆 گروپی برایان</h2>
        <input type="text" id="userName" placeholder="ناوەکەت بنووسە">
        <button class="btn-main" onclick="login()">چوونە ژوورەوە</button>
    </div>

    <div id="main-app" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span id="displayUser"></span>
            <div>
                <span id="scoreTotal" style="color: var(--secondary); font-weight: bold; font-size: 20px;">0</span> خاڵ
            </div>
        </div>
        
        <button class="rank-btn" onclick="showRank()">📊 خشتەی ڕیزبەندی</button>
        <div id="matches"></div>
    </div>
</div>

<div id="leaderboard">
    <button onclick="document.getElementById('leaderboard').style.display='none'" style="padding: 10px 20px; margin-bottom: 20px; background: red; color: white; border-radius: 10px;">داخستن ✖</button>
    <h3 style="text-align: center;">ڕیزبەندی خاڵەکان</h3>
    <div id="rank-list"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBCXp7vjnb1naq1GpiyN29Br3SH_yNGkkQ",
        authDomain: "brayan-2a1ef.firebaseapp.com",
        databaseURL: "https://brayan-2a1ef-default-rtdb.firebaseio.com",
        projectId: "brayan-2a1ef",
        storageBucket: "brayan-2a1ef.firebasestorage.app",
        messagingSenderId: "655783456427",
        appId: "1:655783456427:web:1535d3dfd9b53515c391ee"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    let currentUser = localStorage.getItem('bUser');

    // وێنەکان لە Transfermarkt - هەمان ئەو لینکەی کە پێشتر حەزت لێبوو
    const matchList = [
        { id: "m1", t1: "ئیسپانیۆل", t2: "ئۆڤیدۆ", p1: 2, pX: 3, p2: 4, img1: "https://tmssl.akamaized.net/images/crest/big/714.png", img2: "https://tmssl.akamaized.net/images/crest/big/2893.png" },
        { id: "m2", t1: "گەلەتەسەرای", t2: "لیڤەرپوول", p1: 5, pX: 3, p2: 2, img1: "https://tmssl.akamaized.net/images/crest/big/141.png", img2: "https://tmssl.akamaized.net/images/crest/big/31.png" },
        { id: "m3", t1: "ئەتلەنتا", t2: "بایرن", p1: 4, pX: 3, p2: 2, img1: "https://tmssl.akamaized.net/images/crest/big/800.png", img2: "https://tmssl.akamaized.net/images/crest/big/27.png" }
    ];

    function login() {
        const n = document.getElementById('userName').value.trim();
        if(n.length < 2) return alert("تکایە ناو بنووسە");
        localStorage.setItem('bUser', n);
        currentUser = n;
        location.reload();
    }

    if(currentUser) {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('displayUser').innerText = "سڵاو " + currentUser;
        
        let h = '';
        matchList.forEach(m => {
            h += `<div class="match-card" id="${m.id}">
                <div class="match-info">
                    <div class="team-box"><img src="${m.img1}" class="team-logo" onerror="this.src='https://via.placeholder.com/60'"><span class="team-name">${m.t1}</span></div>
                    <div style="font-weight:bold;">VS</div>
                    <div class="team-box"><img src="${m.img2}" class="team-logo" onerror="this.src='https://via.placeholder.com/60'"><span class="team-name">${m.t2}</span></div>
                </div>
                <div class="options">
                    <button class="opt-btn" id="${m.id}-1" onclick="vote('${m.id}', 1)">1 (${m.p1})</button>
                    <button class="opt-btn" id="${m.id}-2" onclick="vote('${m.id}', 2)">X (${m.pX})</button>
                    <button class="opt-btn" id="${m.id}-3" onclick="vote('${m.id}', 3)">2 (${m.p2})</button>
                </div>
            </div>`;
        });
        document.getElementById('matches').innerHTML = h;

        db.ref('users/' + currentUser).on('value', s => {
            const data = s.val();
            if(!data) {
                db.ref('users/' + currentUser).set({total:0});
            } else {
                document.getElementById('scoreTotal').innerText = data.total || 0;
                if(data.predictions) {
                    Object.keys(data.predictions).forEach(mid => {
                        const choiceValue = data.predictions[mid];
                        const btn = document.getElementById(mid + '-' + choiceValue);
                        if(btn) {
                            document.getElementById(mid).querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
                            btn.classList.add('selected');
                        }
                    });
                }
            }
        });
    }

    function vote(mId, choice) {
        if(confirm("پێشبینییەکەت جێگیر دەکەیت؟")) {
            db.ref('users/' + currentUser + '/predictions/' + mId).set(choice);
        }
    }

    function showRank() {
        db.ref('users').once('value', s => {
            let arr = [];
            s.forEach(u => {
                arr.push({ name: u.key, total: u.val().total || 0 });
            });
            arr.sort((a, b) => b.total - a.total);
            
            let rankHtml = '';
            arr.forEach((u, i) => {
                rankHtml += `
                    <div class="rank-row">
                        <span>${i+1}. ${u.name}</span>
                        <b>${u.total} خاڵ</b>
                    </div>`;
            });
            document.getElementById('rank-list').innerHTML = rankHtml;
            document.getElementById('leaderboard').style.display = 'block';
        });
    }
</script>
</body>
</html>
