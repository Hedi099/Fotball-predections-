<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brothers Group | یانەی برایان</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary: #fbbf24;
            --glass: rgba(0, 0, 0, 0.8);
            --border: rgba(255, 255, 255, 0.2);
        }

        * { box-sizing: border-box; font-family: 'Noto Sans Arabic', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; padding: 0; min-height: 100vh; display: flex; justify-content: center;
            background: url('IMG_20260409_045723_160.jpg') no-repeat center center fixed;
            background-size: cover; color: white; overflow-x: hidden;
        }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); z-index: 0;
        }

        .container { width: 100%; max-width: 450px; padding: 20px; z-index: 1; position: relative; }

        .glass-panel {
            background: var(--glass); backdrop-filter: blur(15px);
            border: 1px solid var(--border); border-radius: 25px;
            padding: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            margin-bottom: 20px;
        }

        .logo-text { 
            font-size: 30px; font-weight: 900; text-align: center; margin-bottom: 20px;
            background: linear-gradient(to bottom, #fff, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .nav-item {
            background: rgba(255,255,255,0.08); border: 1px solid var(--border);
            border-radius: 15px; padding: 15px; margin-bottom: 12px;
            display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.3s;
        }
        .nav-item:hover { background: rgba(251, 191, 36, 0.2); border-color: var(--primary); }

        .rank-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .rank-name { font-weight: bold; font-size: 15px; }
        .rank-pts { color: var(--primary); font-weight: 900; }

        input {
            width: 100%; padding: 15px; background: rgba(0,0,0,0.6);
            border: 1px solid var(--border); border-radius: 12px;
            color: white; margin-bottom: 15px; text-align: center;
        }

        .btn-gold {
            width: 100%; padding: 15px; background: var(--primary);
            color: black; border: none; border-radius: 12px;
            font-weight: 900; cursor: pointer;
        }

        .section { display: none; }
        .active { display: block; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div id="login-page" class="section active" style="margin-top: 80px;">
        <div class="glass-panel">
            <div class="logo-text">BROTHERS GROUP</div>
            <input type="text" id="userNameInput" placeholder="ناوەکەت بنووسە...">
            <button class="btn-gold" onclick="loginUser()">چوونە ژوورەوە</button>
        </div>
    </div>

    <div id="selection-page" class="section">
        <div class="logo-text" style="font-size: 22px;">بەخێربێیت، <span id="display-name"></span></div>
        
        <div class="glass-panel" style="padding: 10px;">
            <div class="nav-item" onclick="showSection('preds')">
                <span style="font-size: 25px;">⚽</span>
                <div><b>پێشبینی یارییەکان</b></div>
            </div>
            <div class="nav-item" onclick="showSection('quiz')">
                <span style="font-size: 25px;">🧠</span>
                <div><b>بڕوانامەی زانیاری</b></div>
            </div>
        </div>

        <div class="glass-panel">
            <h3 style="margin-top:0; color:var(--primary); font-size:16px; border-bottom:1px solid #444; padding-bottom:10px;">📊 ڕیزبەندی یاریزانەکان</h3>
            <div id="main-leaderboard">
                </div>
        </div>
        
        <button class="btn-gold" style="background:#444; color:white; font-size:12px;" onclick="logout()">🚪 چوونە دەرەوە</button>
    </div>
</div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyBCXp7vjnb1naq1GpiyN29Br3SH_yNGkkQ", 
        authDomain: "brayan-2a1ef.firebaseapp.com", 
        databaseURL: "https://brayan-2a1ef-default-rtdb.firebaseio.com", 
        projectId: "brayan-2a1ef", 
        storageBucket: "brayan-2a1ef.firebasestorage.app", 
        messagingSenderId: "655783456427", 
        appId: "1:655783456427:web:1535d3dfd9b53515c391ee" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // لیستی ئەو یاریزانانەی کە دەتەوێت لە ڕیزبەندی بن
    const brothersList = ["Hedi", "Hawar", "Saman", "Dana", "Rarez", "Aram", "Karwan", "Mhamad"];

    function loginUser() {
        const n = document.getElementById('userNameInput').value.trim();
        if(!n) return;
        localStorage.setItem('groupBryanUser', n);
        location.reload();
    }

    if (localStorage.getItem('groupBryanUser')) {
        document.getElementById('login-page').classList.remove('active');
        document.getElementById('selection-page').classList.add('active');
        document.getElementById('display-name').innerText = localStorage.getItem('groupBryanUser');
        loadLeaderboard();
    }

    function loadLeaderboard() {
        db.ref('users').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            let players = [];
            
            // تەنیا ئەو ناوانە دەهێنێت کە لە لیستەکەدان یان پێشتر هەبوون
            brothersList.forEach(name => {
                const userScore = data[name] || { total: 0 };
                players.push({ name: name, score: userScore.total || 0 });
            });

            // ڕیزکردن بەپێی خاڵ
            players.sort((a, b) => b.score - a.score);

            let html = '';
            players.forEach((p, index) => {
                html += `
                <div class="rank-row">
                    <span class="rank-name">${index + 1}. ${p.name}</span>
                    <span class="rank-pts">${p.score} خاڵ</span>
                </div>`;
            });
            document.getElementById('main-leaderboard').innerHTML = html;
        });
    }

    function logout() { localStorage.removeItem('groupBryanUser'); location.reload(); }
    function showSection(s) { alert('بەشی ' + s + ' بەم زووانە تەواو دەبێت!'); }
</script>

</body>
</html>
