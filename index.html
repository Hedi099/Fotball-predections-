<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گروپی برایان - سیستەمی خاڵ</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #6366f1; --secondary: #fbbf24; --bg: #030712; --card-inner: rgba(15, 23, 42, 0.9); --border: rgba(255, 255, 255, 0.12); }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 440px; padding: 15px; }
        .top-nav { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
        .rank-btn { background: var(--secondary); color: #000; border: none; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; flex: 1; }
        #leaderboard-view, #all-preds-view { display: none; background: var(--card-inner); border: 1px solid var(--border); border-radius: 20px; padding: 15px; margin-bottom: 20px; position: fixed; top: 10%; left: 5%; right: 5%; z-index: 100; max-height: 80vh; overflow-y: auto; box-shadow: 0 0 30px #000; }
        .rank-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid var(--border); }
        .match-card { position: relative; border-radius: 30px; margin-top: 25px; overflow: hidden; border: 1px solid var(--border); background-size: cover; background-position: center; }
        .card-overlay { background: linear-gradient(to bottom, rgba(3,7,18,0.5), var(--card-inner)); padding: 20px 15px; backdrop-filter: blur(3px); }
        .match-event-badge { position: absolute; top: 12px; right: 12px; background: var(--primary); color: white; font-size: 10px; font-weight: bold; padding: 4px 10px; border-radius: 50px; }
        .timer { font-size: 11px; color: var(--secondary); background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 50px; display: inline-block; margin-bottom: 10px; direction: ltr; }
        .prediction-container { display: flex; justify-content: space-between; align-items: center; gap: 5px; }
        .predict-box { flex: 1; display: flex; flex-direction: column; align-items: center; }
        .team-logo { width: 50px; height: 50px; object-fit: contain; margin-bottom: 5px; }
        .team-name { font-size: 11px; font-weight: bold; text-align: center; height: 30px; }
        .opt-btn { width: 90%; background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: #fff; padding: 10px 0; border-radius: 12px; cursor: pointer; font-size: 10px; transition: 0.3s; }
        .opt-btn.selected { background: var(--secondary) !important; color: #000 !important; font-weight: bold; }
        .view-preds-btn { width: 100%; margin-top: 15px; background: rgba(255,255,255,0.05); color: #aaa; border: 1px solid #333; padding: 8px; border-radius: 10px; font-size: 11px; cursor: pointer; }
        .admin-tools { margin-top: 15px; padding-top: 10px; border-top: 1px dashed #444; display: none; text-align: center; }
        .admin-btn { background: #22c55e; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 10px; cursor: pointer; margin: 2px; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: #111827; color: white; margin-bottom: 10px; text-align: center; }
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-page">
        <h1 style="text-align: center;">🏆 گروپی برایان</h1>
        <input type="text" id="userNameInput" placeholder="ناوەکەت بنووسە">
        <button class="btn-main" onclick="loginUser()">چوونە ژوورەوە</button>
    </div>

    <div id="main-app" style="display: none;">
        <div class="top-nav">
            <button class="rank-btn" onclick="toggleView('leaderboard-view')">📊 ڕیزبەندی</button>
            <button class="rank-btn" style="background:#ef4444; color:white; flex:0.4;" onclick="logout()">دەرچوون</button>
        </div>

        <div id="leaderboard-view">
            <h3 style="text-align:center">ڕیزبەندی گشتی</h3>
            <div id="rank-list"></div>
            <button class="btn-main" style="margin-top:10px; padding:10px;" onclick="toggleView('leaderboard-view')">داخستن</button>
        </div>

        <div id="all-preds-view">
            <h3 id="pred-title" style="text-align:center">پێشبینییەکان</h3>
            <div id="preds-content"></div>
            <button class="btn-main" style="margin-top:10px; padding:10px;" onclick="toggleView('all-preds-view')">داخستن</button>
        </div>

        <div id="matches-list"></div>
    </div>
</div>

        { id: "m25", t1: "بایرن", t2: "ئەتڵەنتا", p1: 2, pX: 4, p2: 5, event: "UCL", deadline: "18/3 23:00", img1: "https://crests.football-data.org/5.png", img2: "https://crests.football-data.org/102.png", bg: "https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=500" }
    ];

    function loginUser() {
        const name = document.getElementById('userNameInput').value.trim();
        if(!name) return;
        localStorage.setItem('groupBryanUser', name);
        location.reload();
    }

    if (currentUser) {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        const isAdmin = currentUser.toLowerCase() === 'admin';

        let h = '';
        matches.forEach(m => {
            h += `<div class="match-card" id="${m.id}" style="background-image: url('${m.bg}')">
                <div class="card-overlay">
                    <div class="match-event-badge">${m.event}</div>
                    <center><div class="timer">کات: ${m.deadline}</div></center>
                    <div class="prediction-container">
                        <div class="predict-box"><img src="${m.img1}" class="team-logo"><div class="team-name">${m.t1}</div>
                            <button class="opt-btn" id="${m.id}-btn1" onclick="vote('${m.id}', 1, ${m.p1})">${m.p1} خاڵ</button></div>
                        <div class="predict-box" style="padding-top:30px;"><div class="team-name">یەکسان</div>
                            <button class="opt-btn" id="${m.id}-btn2" onclick="vote('${m.id}', 2, ${m.pX})">${m.pX} خاڵ</button></div>
                        <div class="predict-box"><img src="${m.img2}" class="team-logo"><div class="team-name">${m.t2}</div>
                            <button class="opt-btn" id="${m.id}-btn3" onclick="vote('${m.id}', 3, ${m.p2})">${m.p2} خاڵ</button></div>
                    </div>
                    <button class="view-preds-btn" onclick="showAllPredictions('${m.id}', '${m.t1} vs ${m.t2}')">👁 بینینی پێشبینی یاریزانەکان</button>
                    <div class="admin-tools" style="display:${isAdmin?'block':'none'}">
                        <button class="admin-btn" onclick="setResult('${m.id}', 1, ${m.p1})">بردنی ١</button>
                        <button class="admin-btn" onclick="setResult('${m.id}', 2, ${m.pX})">یەکسان</button>
                        <button class="admin-btn" onclick="setResult('${m.id}', 3, ${m.p2})">بردنی ٢</button>
                    </div>
                </div>
            </div>`;
        });
        document.getElementById('matches-list').innerHTML = h;

        db.ref('users/' + currentUser).on('value', snap => {
            const d = snap.val() || {};
            if (d.predictions) {
                Object.keys(d.predictions).forEach(mid => {
                    const btn = document.getElementById(mid + '-btn' + d.predictions[mid].choice);
                    if(btn) { btn.classList.add('selected'); document.querySelectorAll(`#${mid} .opt-btn`).forEach(b => b.disabled = true); }
                });
            }
        });
    }

    function vote(mId, c, p) { 
        if(confirm("پێشبینییەکە قفڵ بکرێت؟")) {
            db.ref('users/' + currentUser + '/predictions/' + mId).set({ choice: c, pts: p });
        }
    }

    function setResult(mId, winnerChoice, points) {
        if(!confirm("ئایا دڵنیایت لە ئەنجام؟ خاڵەکان ڕاستەوخۆ بۆ یاریزانەکان زیاد دەبێت.")) return;
        db.ref('users').once('value', snap => {
            snap.forEach(userSnap => {
                const userData = userSnap.val();
                if(userData.predictions && userData.predictions[mId]) {
                    if(userData.predictions[mId].choice == winnerChoice) {
                        const newWeekly = (userData.weekly || 0) + points;
                        const newTotal = (userData.total || 0) + points;
                        db.ref('users/' + userSnap.key).update({ weekly: newWeekly, total: newTotal });
                    }
                }
            });
            alert("ئەنجام تۆمارکرا و خاڵەکان دابەشکران!");
        });
    }

    function showAllPredictions(mId, matchName) {
        toggleView('all-preds-view');
        document.getElementById('pred-title').innerText = matchName;
        db.ref('users').once('value', snap => {
            let h = '';
            snap.forEach(u => {
                const pred = u.val().predictions ? u.val().predictions[mId] : null;
                const choiceStr = pred ? (pred.choice == 1 ? "بردنی 1" : pred.choice == 2 ? "یەکسان" : "بردنی 2") : "نەیانووسیوە";
                h += `<div class="rank-row"><span>${u.key}</span><span style="color:${pred?'#fbbf24':'#555'}">${choiceStr}</span></div>`;
            });
            document.getElementById('preds-content').innerHTML = h;
        });
    }

    function toggleView(id) {
        const v = document.getElementById(id);
        v.style.display = v.style.display === 'block' ? 'none' : 'block';
        if(id === 'leaderboard-view' && v.style.display === 'block') {
            db.ref('users').once('value', s => {
                let p = []; s.forEach(u => { p.push({ n: u.key, ...u.val() }); });
                p.sort((a, b) => (b.total || 0) - (a.total || 0));
                document.getElementById('rank-list').innerHTML = p.map(i => `<div class="rank-row"><span>${i.n}</span><span>${i.weekly||0} / ${i.total||0}</span></div>`).join('');
            });
        }
    }

    function logout() { localStorage.removeItem('groupBryanUser'); location.reload(); }
</script>
</body>
</html>
